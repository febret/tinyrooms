<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tinyrooms Mission Control</title>
  <link rel="stylesheet" href="/mission-control/css/app.css">
</head>
<body>
  <div id="login-screen" class="login-screen" hidden>
    <form id="login-form" class="login-card">
      <h1>Tinyrooms Mission Control</h1>
      <p class="muted">Operator access only. This tool manages a trusted fleet.</p>
      <label for="passphrase">Passphrase</label>
      <input id="passphrase" name="passphrase" type="password" autocomplete="current-password" required>
      <button type="submit">Sign in</button>
      <p id="login-error" class="error" role="alert"></p>
    </form>
  </div>

  <div id="app-shell" hidden>
    <header class="topbar">
      <div class="brand">Tinyrooms <span>Mission Control</span></div>
      <div class="topbar-meta">
        <span id="operator-label" class="muted"></span>
        <span id="version-label" class="muted"></span>
        <button id="logout-button" type="button" class="link-button">Sign out</button>
      </div>
    </header>
    <div id="banner" class="banner" role="status" hidden></div>
    <nav class="tabs" role="tablist">
      <button class="tab active" role="tab" data-tab="servers">Server Manager</button>
      <button class="tab" role="tab" data-tab="packages">Package Manager</button>
      <button class="tab" role="tab" data-tab="users">User Manager</button>
      <button class="tab" role="tab" data-tab="audit">Audit</button>
    </nav>
    <main>
      <section id="panel-servers" class="panel" data-panel="servers"></section>
      <section id="panel-packages" class="panel" data-panel="packages" hidden></section>
      <section id="panel-users" class="panel" data-panel="users" hidden></section>
      <section id="panel-audit" class="panel" data-panel="audit" hidden></section>
    </main>
  </div>

  <script type="module" src="/mission-control/js/app.js"></script>
</body>
</html>
