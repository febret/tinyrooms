<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
    <meta name="theme-color" content="#061923">
    <title>Tinyrooms</title>
    <link rel="icon" href="/assets/stickers/s1.png">
    <link rel="stylesheet" href="/app/css/main.css">
    <link rel="stylesheet" href="/app/css/cards.css">
    <link rel="stylesheet" href="/app/css/inventory.css">
    <link rel="stylesheet" href="/app/css/journal.css">
    <link rel="stylesheet" href="/app/css/id-card.css">
    <link rel="stylesheet" href="/app/css/room-picker.css">
    <link rel="stylesheet" href="/app/css/activities.css">
    <link rel="stylesheet" href="/app/css/cutscenes.css">
    <link rel="stylesheet" href="/app/css/multiverse.css">
    <link rel="stylesheet" href="/app/css/phone.css">
    <link rel="stylesheet" href="/app/css/phone-messages.css">
    <script type="importmap">
      {
        "imports": {
          "three": "/app/vendor/three/three.module.js",
          "three/addons/": "/app/vendor/three/examples/jsm/",
          "#tinyrooms/": "/app/js/",
          "uqr": "/app/vendor/uqr/index.mjs"
        }
      }
    </script>
  </head>
  <body>
    <div id="app" class="app-shell" data-auth="booting">
      <aside id="peeps-panel" class="sidebar" aria-label="Peeps in this room"></aside>
      <main class="board-column">
        <header class="topbar">
          <div class="topbar-scroll">
            <nav id="status-tools" class="status-tools" aria-label="Wellbeing"></nav>
            <nav id="core-tools" class="core-tools" aria-label="Core cards"></nav>
            <nav id="activity-pills" class="activity-pills" aria-label="Minimized activities"></nav>
          </div>
          <p id="connection-status" class="connection-status" aria-live="polite"></p>
          <details id="settings" class="settings">
            <summary class="icon-button" aria-label="Settings" title="Settings"><img class="toolbar-icon" src="/assets/ui/settings.svg" alt="" aria-hidden="true" draggable="false"></summary>
            <nav id="top-actions" class="top-actions" aria-label="Settings"></nav>
          </details>
        </header>
        <section class="board-frame" aria-label="Room board">
          <canvas id="board-canvas" aria-label="Three-dimensional room. Drag to rotate; scroll or pinch to zoom."></canvas>
          <button id="prop-default-action" type="button" class="prop-default-action" hidden></button>
          <button id="target-confirm" type="button" class="target-confirm primary" hidden></button>
          <div id="room-filter" class="room-filter" aria-hidden="true"></div>
          <div id="board-overlay" class="board-overlay" aria-live="polite"></div>
          <div id="cutscene-layer" class="cutscene-layer" data-state="idle" hidden></div>
          <div id="activity-layer" class="activity-layer"></div>
          <div id="panel-layer" class="panel-layer"></div>
        </section>
        <section class="bottom-stack">
          <section id="card-hand" class="card-hand" aria-label="Equipped cards"></section>
          <div class="interaction-dock">
            <div class="look-row">
              <section id="look-bar" class="look-bar" aria-label="Current selection" aria-live="polite"></section>
              <section id="actions-bar" class="actions-bar" aria-label="Actions for current selection"></section>
            </div>
            <form id="chat-form" class="chat-bar">
              <button id="emote-toggle" type="button" class="icon-button emote-button" aria-label="Emotes" aria-expanded="false" aria-controls="emote-menu" title="Emotes">
                <img id="emote-toggle-icon" alt="" aria-hidden="true">
              </button>
              <input id="chat-input" name="chat" autocomplete="off" maxlength="240" placeholder="Chat or command" aria-label="Chat message or command" role="combobox" aria-expanded="false" aria-controls="chat-completions" aria-autocomplete="list" aria-haspopup="listbox">
              <div id="chat-completions" class="chat-completions" role="listbox" aria-label="Completions" hidden></div>
              <button type="submit" class="icon-button send-button" data-sound="none" aria-label="Send message" title="Send"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 3 10.5 13.5"></path><path d="M21 3 14.5 21l-4-7.5L3 9.5 21 3Z" fill="currentColor" fill-opacity=".22"></path></svg></button>
              <button id="push-to-talk" type="button" class="icon-button talk-button" aria-label="Push to talk" title="Push to talk" aria-pressed="false">
                <svg class="talk-ring" viewBox="0 0 36 36" aria-hidden="true">
                  <circle class="talk-ring-track" cx="18" cy="18" r="16"></circle>
                  <circle class="talk-ring-progress" cx="18" cy="18" r="16"></circle>
                </svg>
                <span class="talk-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="3" width="6" height="11" rx="3" fill="currentColor" fill-opacity=".22"></rect><path d="M5.5 11a6.5 6.5 0 0 0 13 0M12 17.5V21M8.5 21h7"></path></svg></span>
              </button>
              <div id="emote-menu" class="emote-menu" role="group" aria-label="Emotes" inert></div>
            </form>
          </div>
          <section id="editor-dock" class="editor-dock" aria-label="Room editor"></section>
        </section>
      </main>
      <aside id="action-log" class="log-panel" aria-label="Action Log"></aside>
      <div id="bubble-layer" class="bubble-layer"></div>
      <div id="multiverse-layer" data-state="idle" hidden></div>
      <div id="room-picker" class="room-picker" hidden inert></div>
      <div id="container-panel" class="room-picker" hidden inert></div>
      <div id="global-modal-layer" class="global-modal-layer"></div>
      <div id="auth-layer" class="auth-layer"></div>
      <div id="toast-stack" class="toast-stack" aria-live="polite"></div>
    </div>
    <script type="module" id="tinyrooms-entry" src="/app/js/ui.js"></script>
    <script src="/app/js/boot-guard.js"></script>
  </body>
</html>
