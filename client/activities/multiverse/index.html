<!doctype html>
<html lang="en" class="full-height">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Tinyrooms Multiverse</title>
    <link rel="stylesheet" href="/activities/shared.css">
    <link rel="stylesheet" href="/activities/multiverse/multiverse.css">
  </head>
  <body>
    <main class="multiverse-shell viewport-column">
      <header class="multiverse-header">
        <div class="multiverse-heading">
          <p class="multiverse-summary" id="multiverse-summary">Reading the map…</p>
        </div>
        <button type="button" class="quiet small multiverse-refresh" id="multiverse-refresh" aria-label="Refresh worlds" title="Refresh worlds">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
            <path d="M20 11a8 8 0 0 0-14.9-4M4 13a8 8 0 0 0 14.9 4"></path>
            <path d="M20 4v7h-7M4 20v-7h7"></path>
          </svg>
        </button>
      </header>

      <p class="connection" id="connection" role="status">Waiting for Tinyrooms…</p>
      <p class="multiverse-error" id="multiverse-error" role="alert" hidden></p>

      <section class="world-grid" id="worlds" aria-label="Reachable worlds" aria-live="polite"></section>
      <p class="empty multiverse-empty" id="multiverse-empty" hidden>No other worlds are humming right now.</p>

      <footer class="multiverse-footer">
        <span id="multiverse-count" class="multiverse-count"></span>
      </footer>
    </main>

    <script src="/activities/shared.js"></script>
    <script type="module" src="/activities/multiverse/multiverse.js"></script>
  </body>
</html>
