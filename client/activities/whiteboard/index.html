<!doctype html>
<html lang="en" class="full-height">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Whiteboard</title>
    <link rel="stylesheet" href="/activities/shared.css">
    <link rel="stylesheet" href="./whiteboard.css">
  </head>
  <body>
    <main class="shell viewport-column paint-shell">
      <p class="connection" id="connection" role="status">Waiting for Tinyrooms…</p>
      <header class="paint-topbar">
        <div class="paint-brand">
          <strong>Whiteboard</strong>
          <p id="status" role="status">Loading whiteboard…</p>
        </div>
        <div class="paint-actions" role="toolbar" aria-label="Whiteboard actions">
          <button type="button" id="palette-toggle" title="Color" aria-expanded="true" aria-controls="side-panel">
            <span class="label">Color</span> <span id="current-swatch" aria-hidden="true"></span>
          </button>
          <button type="button" id="frame-toggle" title="Frame" aria-expanded="false" aria-controls="side-panel">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 4h18v16H3zM7 8v8h10V8z" fill="currentColor" fill-rule="evenodd"/></svg><span class="label">Frame</span>
          </button>
          <button type="button" class="quiet" id="undo" title="Undo">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 5L4 10l5 5M4 10h10a6 6 0 0 1 0 12h-3" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg><span class="label">Undo</span>
          </button>
          <button type="button" class="quiet" id="redo" title="Redo">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l5 5-5 5M20 10H10a6 6 0 0 0 0 12h3" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg><span class="label">Redo</span>
          </button>
          <button type="button" class="quiet" id="clear" title="Clear">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 7h14M10 7V4h4v3M7 7l1 13h8l1-13" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg><span class="label">Clear</span>
          </button>
        </div>
      </header>
      <div class="paint-workspace">
        <aside class="brush-rail" id="brush-rail" role="toolbar" aria-label="Brushes"></aside>
        <section class="board-stage" id="board-stage" aria-label="Painting stage">
          <div class="board-shell" id="board-shell">
            <canvas id="frame-canvas" aria-hidden="true"></canvas>
            <canvas id="board" width="1024" height="640" aria-label="Shared whiteboard painting surface" tabindex="0"></canvas>
          </div>
        </section>
        <aside class="side-panel" id="side-panel" aria-label="Color and frame controls">
          <section id="palette-root" aria-label="Advanced palette"></section>
          <section id="frame-root" aria-label="Frame customization" hidden></section>
        </aside>
      </div>
      <footer class="paint-footer">
        <label class="tool-field">Size
          <span class="brush-tip" aria-hidden="true"></span>
          <input id="brush-size" type="range" min="1" max="96" value="10" aria-label="Brush size">
        </label>
        <label class="tool-field">Opacity
          <input id="brush-opacity" type="range" min="5" max="100" value="95" aria-label="Brush opacity">
        </label>
        <button type="button" id="eraser" aria-pressed="false">Eraser</button>
        <p id="lock-note" class="paint-lock" hidden>Signed print — this artwork cannot be modified.</p>
      </footer>
    </main>
    <script src="/activities/shared.js"></script>
    <script type="module" src="./whiteboard.js"></script>
  </body>
</html>
