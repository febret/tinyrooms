<!doctype html>
<html lang="en" class="full-height">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Sticker Designer</title>
    <link rel="stylesheet" href="/activities/shared.css">
    <link rel="stylesheet" href="./sticker-designer.css">
  </head>
  <body>
    <main class="shell viewport-column editor-shell">
      <p class="connection" id="connection" role="status">Waiting for Tinyrooms…</p>
      <div class="editor-tabs" id="mode-tabs" role="tablist" aria-label="Sticker designer mode">
        <button type="button" class="tab" data-mode="presets" role="tab" aria-selected="false" tabindex="-1">Preset stickers</button>
        <button type="button" class="tab" data-mode="custom" role="tab" aria-selected="true" tabindex="0">Design your own</button>
      </div>

      <section class="editor-pane presets-pane" id="presets-pane" role="tabpanel" aria-label="Preset stickers" hidden>
        <div class="grid" id="grid" role="group" aria-label="Choose a sticker"></div>
      </section>

      <section class="editor-pane custom-pane" id="custom-pane" role="tabpanel" aria-label="Design your own sticker">
        <div class="preview-col">
          <div class="preview-frame">
            <canvas id="preview" width="360" height="396" aria-label="Sticker preview"></canvas>
            <span class="peel" aria-hidden="true"></span>
          </div>
          <div class="preview-actions">
            <button type="button" class="quiet small" id="randomize"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2l2.2 6.3L20.5 10l-6.3 2.2L12 18.5l-2.2-6.3L3.5 10l6.3-1.7zM19 16l.9 2.1L22 19l-2.1.9L19 22l-.9-2.1L16 19l2.1-.9z" fill="currentColor"/></svg>Surprise me</button>
            <button type="button" class="quiet small" id="reset-design"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 5v5h5M5.6 10A7.5 7.5 0 1 1 4.5 14" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>Start over</button>
          </div>
          <div class="starter-row" id="starters" aria-label="Starter designs"></div>
        </div>
        <div class="controls-col">
          <div class="cat-tabs" id="cat-tabs" role="tablist" aria-label="Sticker parts"></div>
          <div class="part-grid" id="part-grid" role="group" aria-label="Choose a part"></div>
          <div class="palettes" id="palettes" aria-label="Colors"></div>
        </div>
      </section>

      <div class="summary">
        <p id="summary" role="status">Pick a sticker to continue.</p>
        <div class="actions">
          <button type="button" class="primary" id="confirm">Confirm sticker</button>
        </div>
      </div>
    </main>
    <script src="/activities/shared.js"></script>
    <script type="module" src="./sticker-designer.js"></script>
  </body>
</html>
