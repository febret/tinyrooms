<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#061923">
    <title>World Editor · Tinyrooms</title>
    <link rel="icon" href="/assets/stickers/s1.png">
    <link rel="stylesheet" href="/app/css/tool-base.css">
    <link rel="stylesheet" href="/app/vendor/drawflow/drawflow.min.css">
    <link rel="stylesheet" href="/world-editor/editor.css">
    <link rel="stylesheet" href="/app/css/editor-dock.css">
    <link rel="stylesheet" href="/app/css/card-catalog.css">
    <script type="importmap">
      {
        "imports": {
          "three": "/app/vendor/three/three.module.js"
        }
      }
    </script>
  </head>
  <body>
    <div id="we-app" class="we-shell">
      <header id="we-toolbar" class="we-toolbar" aria-label="World Editor toolbar"></header>
      <div class="we-body">
        <aside id="we-rooms" class="we-rooms" aria-label="Rooms"></aside>
        <main class="we-stage">
          <nav id="we-tabs" class="we-tabs" aria-label="Editor views"></nav>
          <section id="we-board-pane" class="we-board-pane" aria-label="Room board">
            <div class="board-frame">
              <canvas id="we-canvas" aria-label="Three-dimensional room preview"></canvas>
              <div id="we-overlay" class="board-overlay" aria-live="polite"></div>
            </div>
            <div id="we-lower" class="we-lower">
              <div class="we-splitter" role="separator" aria-orientation="horizontal" aria-label="Resize bottom panel" tabindex="0"></div>
              <nav class="we-tabs" aria-label="Board tools">
                <button type="button" class="tab" data-lower-tab="props">Props</button>
                <button type="button" class="tab" data-lower-tab="map">World map</button>
                <button type="button" class="quiet graph-fit" data-graph-fit="map">Fit</button>
              </nav>
              <div id="we-editor-dock" class="we-editor-dock"></div>
              <div id="we-map-graph" class="we-graph" aria-label="World map graph" hidden></div>
            </div>
          </section>
          <section id="we-systems-pane" class="we-systems-pane" hidden aria-label="Content editors">
            <div id="we-systems-content" class="we-systems-content"></div>
            <div id="we-dialog-panel" class="we-lower" hidden>
              <div class="we-splitter" role="separator" aria-orientation="horizontal" aria-label="Resize bottom panel" tabindex="0"></div>
              <header id="we-dialog-head" class="we-tabs dialog-head"></header>
              <div id="we-dialog-graph" class="we-graph" aria-label="Dialog graph"></div>
            </div>
          </section>
        </main>
        <aside id="we-properties" class="we-properties" aria-label="Properties"></aside>
      </div>
      <footer id="we-validation" class="we-validation" aria-label="Validation results"></footer>
      <div id="we-modal" class="we-modal"></div>
      <p id="we-toast" class="we-toast" aria-live="polite"></p>
    </div>
    <script type="module" src="/world-editor/js/app.js"></script>
  </body>
</html>
