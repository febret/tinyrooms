<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#ffcf87">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Play Tinyrooms</title>
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" type="image/png" href="/icons/icon-192.png">
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon-180.png">
  <link rel="stylesheet" href="/mission-control/css/entry.css">
  <script type="importmap">
    {
      "imports": {
        "three": "/mission-control/vendor/three/three.module.js",
        "three/addons/": "/mission-control/vendor/three/examples/jsm/"
      }
    }
  </script>
  <script type="module" src="/mission-control/js/entry.js"></script>
</head>
<body>
  <div class="entry-backdrop" aria-hidden="true">
    <div class="entry-blob entry-blob--sun"></div>
    <div class="entry-blob entry-blob--coral"></div>
    <div class="entry-blob entry-blob--mint"></div>
    <div class="entry-grid"></div>
    <div class="entry-sparkles">
      <i class="spark spark--1"></i>
      <i class="spark spark--2"></i>
      <i class="spark spark--3"></i>
      <i class="spark spark--4"></i>
      <i class="spark spark--5"></i>
      <i class="spark spark--6"></i>
      <i class="spark spark--7"></i>
      <i class="spark spark--8"></i>
    </div>
  </div>
  <canvas id="entry-canvas" class="entry-canvas" aria-hidden="true"></canvas>
  <main class="entry-layout" aria-labelledby="title">
    <section class="entry-card">
      <header class="entry-card__header">
        <div class="entry-badge" aria-hidden="true">
          <svg viewBox="0 0 48 48" focusable="false">
            <path d="M8 22.5 24 9l16 13.5V39a3 3 0 0 1-3 3H11a3 3 0 0 1-3-3Z" fill="#fff7e6" stroke="#123b44" stroke-width="2.4" stroke-linejoin="round"></path>
            <path d="M18 42V29.5a2.5 2.5 0 0 1 2.5-2.5h7a2.5 2.5 0 0 1 2.5 2.5V42" fill="#ff8a6b" stroke="#123b44" stroke-width="2.2" stroke-linejoin="round"></path>
            <circle cx="36.5" cy="13.5" r="4.5" fill="#ffcf5a" stroke="#123b44" stroke-width="2"></circle>
            <path d="M9 24.5 24 11.5l15 13" fill="none" stroke="#123b44" stroke-width="2.4" stroke-linecap="round"></path>
          </svg>
        </div>
        <h1 id="title">
          <span class="entry-title-lead">Welcome to</span>
          <span class="entry-title-accent">Tinyrooms</span>
        </h1>
        <p id="status" class="entry-status" role="status" aria-live="polite">Checking your login…</p>
      </header>
      <p id="error" class="entry-error" role="alert" hidden></p>
      <form id="auth-form" class="entry-form" hidden>
        <label class="entry-field" for="username">
          <span>Username</span>
          <input id="username" name="username" autocomplete="username" required>
        </label>
        <label class="entry-field" for="password">
          <span>Password</span>
          <input id="password" name="password" type="password" autocomplete="current-password" required>
        </label>
        <div id="invitation" class="entry-field" hidden>
          <label for="passphrase">Invitation passphrase</label>
          <input id="passphrase" name="passphrase" type="password" autocomplete="off">
        </div>
        <button id="submit" class="entry-submit" type="submit">Log in and play</button>
        <button id="toggle" class="entry-toggle" type="button">Create an account</button>
      </form>
      <div id="player-actions" class="entry-actions" hidden>
        <button id="retry" type="button">Retry connection</button>
        <button id="logout" class="entry-toggle" type="button">Log out</button>
      </div>
      <button id="install-app" class="entry-toggle entry-install" type="button" hidden>Install app</button>
      <noscript><p class="entry-error">Enable JavaScript to log in and connect to your world.</p></noscript>
    </section>
  </main>
</body>
</html>
