<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Sticker Designer</title>
    <link rel="stylesheet" href="/activities/shared.css">
    <link rel="stylesheet" href="./sticker-designer.css">
  </head>
  <body>
    <main class="shell editor-shell">
      <p class="muted smallprint connection" id="connection" role="status">Waiting for Tinyrooms…</p>
      <div class="editor-tabs" id="mode-tabs" role="tablist" aria-label="Sticker designer mode">
        <button type="button" class="tab" data-mode="presets" role="tab" aria-selected="true">Preset stickers</button>
        <button type="button" class="tab" data-mode="custom" role="tab" aria-selected="false">Design your own</button>
      </div>

      <section class="editor-pane presets-pane" id="presets-pane" role="tabpanel" aria-label="Preset stickers">
        <div class="grid" id="grid" role="group" aria-label="Choose a sticker"></div>
      </section>

      <section class="editor-pane custom-pane" id="custom-pane" role="tabpanel" aria-label="Design your own sticker" hidden>
        <div class="preview-col">
          <div class="preview-frame">
            <canvas id="preview" width="360" height="396" aria-label="Sticker preview"></canvas>
          </div>
          <div class="preview-actions">
            <button type="button" class="quiet small" id="randomize">Surprise me</button>
            <button type="button" class="quiet small" id="reset-design">Start over</button>
          </div>
          <div class="starter-row" id="starters" aria-label="Starter designs"></div>
        </div>
        <div class="controls-col">
          <div class="cat-tabs" id="cat-tabs" role="tablist" aria-label="Sticker parts"></div>
          <div class="part-grid" id="part-grid" role="group" aria-label="Choose a part"></div>
          <div class="palettes" id="palettes" aria-label="Colors"></div>
        </div>
      </section>

      <div class="summary">
        <p id="summary" role="status">Pick a sticker to continue.</p>
        <div class="actions">
          <button type="button" class="primary" id="confirm">Confirm sticker</button>
        </div>
      </div>
    </main>
    <script src="/activities/shared.js"></script>
    <script type="module" src="./sticker-designer.js"></script>
  </body>
</html>
