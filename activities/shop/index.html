<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Tinyrooms Card Shop</title>
    <link rel="stylesheet" href="/activities/shared.css">
    <link rel="stylesheet" href="/activities/shop/shop.css">
  </head>
  <body>
    <main class="shell">
      <header class="heading">
        <div>
          <div class="badge">Tinyrooms activity</div>
          <h1 id="title">Card Shop</h1>
        </div>
        <div class="balance" id="balance" aria-live="polite">— Bops</div>
      </header>
      <p class="connection" id="connection" role="status">Waiting for Tinyrooms…</p>
      <section class="paper">
        <p class="lede">Choose a pack. Each pack opens three independent cards, and duplicates are possible.</p>
        <div class="pack-grid" id="packs"></div>
      </section>
    </main>
    <div class="reveal" id="reveal" hidden>
      <div class="reveal-panel" role="dialog" aria-modal="true" aria-label="Pack reveal">
        <h2 id="reveal-title">Your cards</h2>
        <div class="reveal-cards" id="reveal-cards"></div>
        <button type="button" class="primary" id="reveal-close">Continue</button>
      </div>
    </div>
    <div class="reveal" id="confirm" hidden>
      <div class="reveal-panel" role="dialog" aria-modal="true" aria-label="Confirm purchase">
        <h2>Confirm purchase</h2>
        <p id="confirm-text"></p>
        <div class="confirm-actions">
          <button type="button" class="quiet" id="confirm-cancel">Cancel</button>
          <button type="button" class="primary" id="confirm-ok">Buy</button>
        </div>
      </div>
    </div>
    <script src="/activities/shared.js"></script>
    <script src="/activities/shop/shop.js"></script>
  </body>
</html>
