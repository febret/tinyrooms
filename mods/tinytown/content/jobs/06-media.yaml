director:
  title: Micro-Budget Director
  profession: Film Director
  tier: 2
  accent: "#8a5fb0"
  blurb: A three-day shoot, one borrowed camera, and a lead actor who has experienced the script only as a rumour.
  setting: a storybook film set built from painted cardboard, with a wobbly tripod, a clapperboard, and a frayed red carpet
  endings:
    disaster: The footage is unusable. The festival accepts it anyway, in the experimental category.
    scraped: The film is finished, ninety seconds long, and technically moving.
    okay: The short screens to polite applause and one genuine laugh.
    great: The audience leans in, and someone in the back writes a review on a napkin.
    legendary: The film wins a small trophy, and the trophy is taller than the budget.
  steps:
    - title: The Borrowed Camera
      setup: The camera arrives in a cardboard box with no lens cap and a note claiming it worked fine last time.
      scene: a tiny film set with a battered camera on a tripod, a cardboard skyline, and a tangle of cables
      pool: machines
      game: sweep-stop
      sprite: a vintage film camera on a tripod
      choices:
        - label: Check every cable before the first shot
          approach: nouse
          success: You find the missing adaptor and the camera purrs to life.
          failure: You find three loose cables and one that is simply a ribbon.
        - label: Cast the crew from whoever is standing nearby
          approach: charm
          success: A neighbour becomes your boom operator and takes the job extremely seriously.
          failure: A neighbour becomes your boom operator and starts rewriting the script.
        - label: Film the first take immediately, before anyone can object
          approach: chaos
          success: The raw take has a strange energy that no amount of planning could produce.
          failure: The raw take is nine minutes of your own thumb.
    - title: The Lead Actor Leaves
      setup: The lead has left a note, a costume on the chair, and a forwarding address for their agent.
      scene: a dressing area with an empty chair, a folded costume, and a mirror ringed in warm bulbs
      pool: people
      game: ring-match
      sprite: a canvas director's chair
      choices:
        - label: Track them down with flattery
          approach: charm
          success: You find them at the bus stop and compliment them back into costume.
          failure: You find them at the bus stop and they ask for a producer credit.
        - label: Rewrite the part for a stand-in
          approach: nouse
          success: The new part is smaller, sharper, and secretly better.
          failure: The new part is three pages of a stranger explaining the old part.
        - label: Convince the crew the absence is the film
          approach: chaos
          success: The empty chair becomes the most compelling character in the scene.
          failure: The empty chair becomes the only thing in focus.
    - title: The Drilling Next Door
      setup: The council is drilling the square outside, and the camera is rolling on dialogue that now competes with a jackhammer.
      scene: a cramped editing nook with headphones, a laptop, and a window full of roadworks
      pool: outdoors
      game: rhythm-lane
      sprite: a pair of over-ear headphones
      choices:
        - label: Record wild sound in the stairwell
          approach: care
          success: The stairwell gives you a clean room tone and a passing cat.
          failure: The stairwell gives you the echo of someone explaining their diet.
        - label: Use the drilling as the score
          approach: chaos
          success: The drill lands in perfect rhythm with the opening shot.
          failure: The drill lands in rhythm, then stops exactly when it should have continued.
        - label: Charm the foreman into ten minutes of silence
          approach: charm
          success: He holds the crew for ten minutes and takes a bow for the recording.
          failure: He holds the crew for ten minutes, then drills twice as loudly as a compromise.
    - title: The One-Take Finale
      setup: The light is going, the camera has one charge left, and the entire ending is a single moving shot.
      scene: a golden-hour film set with a dolly track, a canvas chair, and a nervous cluster of props
      pool: stage
      game: pop-whack
      sprite: a clapperboard
      choices:
        - label: Rehearse the movement twice, then shoot
          approach: care
          success: The take is clean, and the camera lands exactly where it should.
          failure: The take is clean until the camera lands on your hand holding cake.
        - label: Shoot it live with the whole street watching
          approach: charm
          success: The crowd follows the shot like a parade and the take is electric.
          failure: The crowd follows the shot and a dog follows the crowd into frame.
        - label: Improvise the ending on the last charge
          approach: chaos
          success: The improvised ending is stranger and better than the script.
          failure: The improvised ending is the camera shutting down mid-sentence.

influencer:
  title: Reluctant Influencer
  profession: Influencer
  tier: 1
  accent: "#d9739b"
  blurb: A sponsored post, a free hat, and a follower count that is mostly one very committed aunt.
  setting: a pastel storybook bedroom studio with a ring light, a wall of unopened parcels, and one patient tripod
  endings:
    disaster: The sponsor sees the post, replies with a single full stop, and the hat is repossessed.
    scraped: The post goes up, the hat survives, and the comments are mostly kind.
    okay: The sponsor is satisfied and a few strangers ask where the hat is from.
    great: The post performs, the hat sells out, and your aunt tells everyone at the shop.
    legendary: The campaign goes modestly viral and the brand sends a second hat in a padded box.
  steps:
    - title: The Unboxing
      setup: A parcel arrives with a hat inside, a brief, and instructions to be visibly excited about both.
      scene: a pastel bedroom studio with a ring light, an open parcel, and a very plain hat on a stand
      pool: creative
      game: ring-match
      sprite: a plain knitted bobble hat
      choices:
        - label: Read the brief properly before filming
          approach: nouse
          success: You find the three required phrases and say them like a person would.
          failure: You find the brief is two pages of emotions with no nouns.
        - label: Film the reaction in one honest take
          approach: charm
          success: The take is charming, unpolished, and exactly what the brief meant.
          failure: The take is honest about the hat in a way the sponsor may not love.
        - label: Film on the roof for better light
          approach: chaos
          success: The wind turns the hat into a co-star and the light is unreasonably good.
          failure: The wind takes the hat and gives the street a new landmark.
    - title: The Comment Section
      setup: The post is up. One comment asks if the hat is a test, and forty people have replied to it.
      scene: a bedside desk with a glowing laptop and a wall of comment notifications
      pool: night
      game: rhythm-lane
      sprite: a pink heart notification bubble
      choices:
        - label: Reply to the questions with facts
          approach: care
          success: The thread calms down and the questions turn into recommendations.
          failure: The thread calms down into a detailed discussion of your childhood.
        - label: Pin the funniest comment and move on
          approach: charm
          success: The comment is quoted twice and the mood lifts instantly.
          failure: The comment is quoted back at you by the sponsor.
        - label: Delete the whole thread and start over
          approach: chaos
          success: The silence is interpreted as confidence, and the algorithm approves.
          failure: The silence is interpreted as a scandal, and a smaller account writes a summary.
    - title: The Candlelit Livestream
      setup: The sponsor wants a live unboxing of a second parcel, and the town has chosen this evening for a power cut.
      scene: a candlelit bedroom with a ring light on a portable battery and a second parcel on the bed
      pool: danger
      game: pop-whack
      sprite: a lit scented candle in a glass jar
      choices:
        - label: Run the stream on the spare battery and a script
          approach: nouse
          success: The battery holds, the script fits, and the chat stays awake.
          failure: The battery holds but the script does not fit the parcel that arrived.
        - label: Turn the power cut into the bit
          approach: chaos
          success: The candles make the hat look expensive and the chat loses its mind.
          failure: The candles make the room look haunted and the chat asks who is behind you.
        - label: Bring your aunt on as a guest
          approach: charm
          success: Your aunt reviews the hat with devastating honesty and becomes the highlight.
          failure: Your aunt reviews the hat with devastating honesty and gets a sponsorship offer.
    - title: The Campaign Numbers
      setup: The sponsor wants numbers, the aunt wants a refund, and the hat has to look good in daylight.
      scene: a bright kitchen table covered in a printed report, a hat, and a very serious cup of tea
      pool: paperwork
      game: hold-meter
      sprite: a steaming cup of tea
      choices:
        - label: Show the real numbers with context
          approach: nouse
          success: The sponsor respects the honesty and renews for one more month.
          failure: The sponsor respects the honesty and requests the hat back.
        - label: Present the aunt as a focus group
          approach: charm
          success: The aunt's notes become the campaign's new direction.
          failure: The aunt's notes become several paragraphs about your posture.
        - label: Manifest the numbers as a dance
          approach: chaos
          success: The dance goes modestly viral, and the numbers move for reasons unrelated to hats.
          failure: The dance goes modestly viral in a different country with different metrics.

radio-host:
  title: Insomniac Radio Host
  profession: Radio Host
  tier: 2
  accent: "#4a6fa5"
  blurb: A four-hour overnight show, one caller who will not hang up, and a station cat with strong opinions.
  setting: a small storybook radio booth with a foam-padded microphone, a blinking on-air sign, and a mug ringed with old coffee
  endings:
    disaster: Dead air for six minutes. The station plays a recording of waves and hopes nobody noticed.
    scraped: The show limps to the end, and the caller becomes a recurring feature.
    okay: The show ends on time, the log is legible, and the cat is asleep.
    great: The last hour is genuinely good radio, and two insomniacs write in.
    legendary: The overnight show trends by breakfast. The station manager pretends not to be pleased.
  steps:
    - title: Dead Air at Midnight
      setup: The station hands you a playlist, a weather note, and a studio clock that is nine minutes fast.
      scene: a tiny radio booth with a foam microphone, a wall of blinking switches, and a cold cup of coffee
      pool: night
      game: rhythm-lane
      sprite: a black vinyl record
      choices:
        - label: Check the playlist and the clock before going live
          approach: nouse
          success: You catch the clock error and start on the right minute.
          failure: You catch the clock error and start nine minutes late to compensate.
        - label: Open with a voice and a story
          approach: charm
          success: The story about the bus lands, and the phone starts blinking.
          failure: The story about the bus lands wrong and the phone stays dark.
        - label: Go live with no plan at all
          approach: chaos
          success: The first three minutes are the best radio you have ever made.
          failure: The first three minutes are you reading the fire exit sign aloud.
    - title: The Caller Who Will Not Leave
      setup: The switchboard lights up. Bernard has called about the moon and is prepared to be thorough.
      scene: a radio desk with a blinking phone, a producer checklist, and a dark window onto the street
      pool: people
      game: pop-whack
      sprite: a retro rotary telephone
      choices:
        - label: Gently move Bernard toward his point
          approach: care
          success: Bernard reaches a genuinely lovely conclusion about the moon.
          failure: Bernard reaches the conclusion that you should be his assistant.
        - label: Let Bernard run the segment
          approach: charm
          success: Bernard becomes the accidental co-host and the switchboard fills up.
          failure: Bernard becomes the accidental co-host and starts reading the adverts.
        - label: Play a record over him
          approach: chaos
          success: The record lands perfectly and Bernard takes it as a cue to sing.
          failure: The record lands and the CD player eats it with authority.
    - title: The Fog in the Studio
      setup: The forecast note says the fog will clear. The fog has not cleared, and it has begun to enter the building.
      scene: a radio booth filled with low fog, a live microphone, and a window showing nothing at all
      pool: outdoors
      game: hold-meter
      sprite: a glowing red on-air lamp in a box
      choices:
        - label: Read the forecast with professional calm
          approach: care
          success: Your calm voice makes the fog sound survivable.
          failure: Your calm voice makes the fog sound permanent.
        - label: Describe the fog as a local event
          approach: charm
          success: Listeners call in from every street to describe their fog, and the show becomes a map.
          failure: Listeners call in to argue about whose fog is real.
        - label: Open the door and let the fog be the co-host
          approach: chaos
          success: The fog moves through the booth and the microphone picks up something remarkable.
          failure: The fog moves through the booth and sets off the smoke detector on air.
    - title: The Five O'Clock Handover
      setup: The morning host arrives at five, which gives you eleven minutes to explain the night.
      scene: a radio studio at dawn with two microphones, a stack of handover notes, and an orange sky
      pool: stage
      game: drop-catch
      sprite: a sealed envelope with a heart sticker
      choices:
        - label: Write a clean handover note
          approach: nouse
          success: The morning host reads it once and nods.
          failure: The morning host reads it twice and asks what the second page means.
        - label: Hand over live with a warm goodbye
          approach: charm
          success: The handover is seamless and both shows sound better for the overlap.
          failure: The handover is so warm that the morning host forgets to start.
        - label: Read one last listener letter on air
          approach: chaos
          success: The letter is from Bernard and it is beautifully unhinged.
          failure: The letter is from Bernard and it is three pages of lunar coordinates.

weatherperson:
  title: Dramatic Weatherperson
  profession: Weatherperson
  tier: 2
  accent: "#2f8f8a"
  blurb: A green screen, a loose clicker, and a forecast that has begun disagreeing with the sky.
  setting: a storybook television weather studio with a green screen, a cardboard sun, and a trolley of felt clouds
  endings:
    disaster: The forecast is read over the wrong map. The town cancels everything and blames the moon.
    scraped: The forecast is a minute long and approximately true.
    okay: The weather segment airs, the region is warned, and only one anchor laughs.
    great: The forecast is clear, dramatic, and correct. People quote it at bus stops.
    legendary: The weather report becomes local folklore. A school teaches it as an example of atmosphere.
  steps:
    - title: The Green Wall
      setup: The weather wall boots up with a map of the wrong county and a bright green field where the sea should be.
      scene: a television weather set with a green screen, a clicker, and a map glowing in the wrong colours
      pool: machines
      game: pop-whack
      sprite: a smiling cartoon sun with triangular orange rays
      choices:
        - label: Reset the map and check the region code
          approach: nouse
          success: The correct county appears, with the sea where the sea lives.
          failure: The correct county appears but the islands are now inland.
        - label: Present the wrong map with total confidence
          approach: charm
          success: The producer decides the wrong map is a bold editorial choice.
          failure: The producer decides you need a meeting after the broadcast.
        - label: Wave your arms until the system catches up
          approach: chaos
          success: The wall responds to the gesture and reveals a hidden overlay.
          failure: The wall responds by displaying a test screen to the whole county.
    - title: The Rival Forecast
      setup: The rival channel has predicted sunshine. Your instruments, your window, and your knees say otherwise.
      scene: a weather studio corner with a barometer, a rain gauge, and a window of grey sky
      pool: outdoors
      game: hold-meter
      sprite: a brass barometer dial
      choices:
        - label: Check the instruments against the window
          approach: care
          success: The window and the barometer agree, and you trust both.
          failure: The window and the barometer agree on different weather.
        - label: Call the rival forecaster live
          approach: charm
          success: They admit the sunshine was aspirational and the segment gets a spike.
          failure: They double down and offer to debate you in the car park.
        - label: Side with the sun and see what happens
          approach: chaos
          success: The sun wins for six minutes and the segment is unforgettable.
          failure: The sun loses, publicly, and takes it out on the weekend.
    - title: The Storm on the Hour
      setup: A real storm arrives during the sponsor read, and the anchor keeps asking if it is part of the graphics.
      scene: a weather studio with a dark window, a wobbling map, and a lit on-air sign
      pool: danger
      game: drop-catch
      sprite: a zigzag lightning bolt
      choices:
        - label: Cut to the live feed and report properly
          approach: care
          success: The real storm is more dramatic than any graphic, and the county listens.
          failure: The live feed shows a bin, a pigeon, and no storm.
        - label: Keep the anchor calm and the show moving
          approach: charm
          success: The anchor's shoulders drop and the report becomes steady.
          failure: The anchor's shoulders drop and so does the teleprompter.
        - label: Ride the storm map like a bull
          approach: chaos
          success: The dramatic gesture explains the storm better than the numbers.
          failure: The dramatic gesture knocks over the map and the cardboard sun.
    - title: The Weekend Promise
      setup: The weekend forecast is a coin toss. The town has a fair and a very fragile bouncy castle.
      scene: a weather set with a weekend map, a small bouncy castle model, and a window of uncertain sky
      pool: outdoors
      game: sweep-stop
      sprite: a fluffy white felt cloud
      choices:
        - label: Give the honest, boring forecast
          approach: nouse
          success: The fair moves the bouncy castle under cover and thanks you.
          failure: The honest forecast is right and a little joy leaves the room.
        - label: Promise sunshine and deliver a hug
          approach: charm
          success: The town brings umbrellas anyway, and the fair is lovely.
          failure: The town believes you and the bouncy castle becomes a kite.
        - label: Read the clouds like a fortune teller
          approach: chaos
          success: The reading is poetic and, by luck, accurate to the hour.
          failure: The reading is poetic and the clouds file a complaint.

wedding-planner:
  title: Discount Wedding Planner
  profession: Wedding Planner
  tier: 3
  accent: "#c98a3f"
  blurb: Two families, one marquee, and a budget that was enthusiastically spent on a very beautiful cake.
  setting: a storybook village hall with a sagging marquee, trestle tables, and a cake shaped like a small castle
  endings:
    disaster: The couple elope. The reception is attended by the cake and forty confused guests.
    scraped: The wedding happens. The photographs are cropped creatively.
    okay: The ceremony is on time and the families only argue during dessert.
    great: The wedding is warm, loud, and exactly what the couple wanted.
    legendary: It becomes the wedding other weddings talk about, mostly with respect.
  steps:
    - title: The Cake Ate the Budget
      setup: The couple hands you a folder, a budget, and a receipt for a cake shaped like their first flat.
      scene: a village hall kitchen with a castle-shaped cake, a budget folder, and mismatched rented chairs
      pool: food
      game: hold-meter
      sprite: a castle-shaped cake
      choices:
        - label: Itemise what is left and what matters
          approach: nouse
          success: You find the money for chairs by moving a very loud band to a smaller amp.
          failure: You find the money for chairs by moving the flowers to a friend's garden.
        - label: Sit with both families and hear them out
          approach: care
          success: Both families offer help, and one offers a working van.
          failure: Both families offer help, and three versions of the seating plan.
        - label: Rebrand the cake as the centrepiece
          approach: chaos
          success: The cake becomes the theme and the guests arrive dressed for a castle.
          failure: The cake becomes the theme and a child asks to live inside it.
    - title: The Guest List Grows
      setup: The seating chart now has a bench that leads to a hedge. Nobody will admit to adding the bench.
      scene: a hall with trestle tables, a seating plan covered in tape, and a hedge visible through open doors
      pool: paperwork
      game: drop-catch
      sprite: a clipboard with a checklist
      choices:
        - label: Recount every place with a clipboard
          approach: care
          success: The count holds and the bench becomes a charming overflow table.
          failure: The count holds until someone's plus-one brings a plus-one.
        - label: Seat the feuding relatives at opposite ends
          approach: nouse
          success: The two ends never meet, and the middle has a lovely time.
          failure: The two ends meet at the buffet and make history.
        - label: Let people sit wherever and call it rustic
          approach: chaos
          success: The chaos becomes a lucky-dip seating plan and nobody complains.
          failure: The chaos becomes a lucky-dip seating plan and a stranger becomes the best man.
    - title: The Weather Turns
      setup: The marquee is up. The wind has decided to test it, and the band has not arrived.
      scene: a village hall garden with a leaning marquee, loose ribbons, and a stack of folded chairs
      pool: outdoors
      game: sweep-stop
      sprite: a white wedding marquee tent
      choices:
        - label: Anchor the marquee properly before the wind wins
          approach: grit
          success: The marquee holds through the first dance and the second storm.
          failure: The marquee holds but the party now happens at a diagonal.
        - label: Move everything inside with the guests as crew
          approach: charm
          success: The guests carry chairs, the hall fills, and the wedding becomes a barn raising.
          failure: The guests carry chairs in six directions and one goes home.
        - label: Cut the marquee roof away and embrace the sky
          approach: chaos
          success: The open-air wedding is dramatic and the sunset cooperates.
          failure: The open-air wedding is dramatic and the cake cooperates with the wasps.
    - title: The Last Dance
      setup: The band is a no-show. The couple is looking at the empty corner where a first dance should be.
      scene: a hall with a cleared floor, a small speaker, a leaning cake, and a fairy-light backdrop
      pool: stage
      game: ring-match
      sprite: a pair of gold wedding rings
      choices:
        - label: Queue the perfect song and clear the floor
          approach: care
          success: The first dance is simple, private, and badly lit in the best way.
          failure: The first dance is simple until the speaker shuffles to a podcast.
        - label: Ask the guests to sing it themselves
          approach: charm
          success: Forty-ish voices perform the first dance and the couple laughs through it.
          failure: Forty-ish voices perform different songs and one uncle commits to a solo.
        - label: Start the conga and hope it becomes a memory
          approach: chaos
          success: The conga becomes the wedding's defining image and the cake survives.
          failure: The conga becomes the wedding's defining image and the cake does not.
