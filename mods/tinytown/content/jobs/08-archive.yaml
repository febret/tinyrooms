archivist:
  title: Cryptic Archivist
  profession: Archivist
  tier: 2
  accent: "#6f7fa6"
  blurb: A sealed municipal crate arrives with a manifest written in three hands and no agreement about what is inside.
  setting: a storybook miniature diorama of a dusty archive basement with towering shelves, a strapped wooden crate, and a green reading lamp, no people, no text
  endings:
    disaster: The ribbon is cut, the display case collapses, and the archive is renamed in a memo nobody can find.
    scraped: The opening happens. Most of the labels are correct and the mayor is only slightly misquoted.
    okay: The reading room opens on time and the dust settles exactly where intended.
    great: The display lands, the researcher gets her document, and a small queue forms by Monday.
    legendary: The archive becomes the town's favourite room. Someone requests the tiny hat for a school project.
  steps:
    - title: The Crate With No Inventory
      setup: A council van has left a sealed crate on the archive steps. The delivery note says it is either tax records or a piano.
      scene: a storybook miniature diorama of an archive entrance hall with a strapped wooden crate, a delivery note, and tall shadowy shelves, no people, no text
      pool: paperwork
      game: hold-meter
      sprite: strapped wooden crate with brass corners
      choices:
        - label: Cross-check the delivery note against the ledger
          approach: nouse
          success: The ledger lists the crate under a code that translates to miscellaneous weather. You now know which shelf to clear.
          failure: The ledger lists the crate four times, in four different years, under four different names.
        - label: Charm the driver into remembering the pickup
          approach: charm
          success: The driver recalls a basement, a piano, and a very insistent curator. Useful.
          failure: The driver recalls a sandwich and drives away before you finish asking.
        - label: Open it with the ceremonial letter opener
          approach: chaos
          success: The lid gives way and releases three decades of dust and one extremely small hat.
          failure: The lid gives way and the crate turns out to contain a smaller, angrier crate.
    - title: The Catalogue That Argues
      setup: The crate is open and the contents are numbered in a system nobody has used since the flood. The card catalogue disagrees with all of it.
      scene: a storybook miniature diorama of an archive reading room with a wall of card drawers, scattered index cards, and one stubborn catalogue cabinet, no people, no text
      pool: paperwork
      game: pop-whack
      sprite: small wooden card catalogue drawer with a brass handle
      choices:
        - label: Reconcile the numbers against the old index
          approach: care
          success: You find the translation key taped inside a drawer marked do not open.
          failure: You reconcile the first box and accidentally renumber the entire east wing.
        - label: Ask the retired cataloguer for a ruling
          approach: charm
          success: She arrives with a thermos and a memory like a bear trap.
          failure: She arrives with a thermos and a grudge against the number seven.
        - label: Reorganise the whole shelf by vibes
          approach: chaos
          success: The shelf ends up in an order that is technically wrong and somehow searchable.
          failure: The shelf ends up in an order only you understand, and you are already forgetting it.
    - title: The Researcher in the Reading Room
      setup: A researcher in a very large coat wants one specific document before noon, and will not say why.
      scene: a storybook miniature diorama of an empty reading room with a long oak table, a green lamp, and one file tied with red string, no people, no text
      pool: people
      game: rhythm-lane
      sprite: manila folder tied with red string
      choices:
        - label: Ask what the document is for
          approach: charm
          success: She admits it is for a family history, and her whole posture softens.
          failure: She says research in a tone that ends the conversation.
        - label: Verify her reader's ticket first
          approach: nouse
          success: The ticket is valid, the request is legitimate, and the twelfth box is exactly where you left it.
          failure: The ticket is valid but expired in a year that has not happened yet.
        - label: Hand her the whole box and watch
          approach: chaos
          success: She finds the document in four minutes and cries a little. The archive survives.
          failure: She finds a document about a different family and is now writing a much longer book.
    - title: The Opening Night
      setup: The mayor is cutting a ribbon at six. The display case is empty and the explanatory cards are still wet.
      scene: a storybook miniature diorama of an archive reading room dressed for an opening with a ribbon, a glass display case, and brass lamps, no people, no text
      pool: stage
      game: ring-match
      sprite: pair of golden ceremonial scissors
      choices:
        - label: Set the display with the safest, dullest documents
          approach: care
          success: The case looks respectable, the mayor nods, and nothing crumbles.
          failure: The case looks respectable until the ribbon falls on it.
        - label: Give the mayor a tour and let him improvise
          approach: charm
          success: He invents a founding myth on the spot and the town loves it.
          failure: He invents a founding myth that contradicts three plaques in the same room.
        - label: Open the crate's last mystery live
          approach: chaos
          success: The final document is a map, the crowd gasps, and the archive is famous by nine.
          failure: The final document is a grocery list. The crowd is polite and the mayor reads it aloud anyway.

museum-curator:
  title: Rogue Museum Curator
  profession: Museum Curator
  tier: 3
  accent: "#8a6f9e"
  blurb: The museum's star exhibit is missing and the board is arriving in an hour with a ribbon and a photographer.
  setting: a storybook miniature diorama of a museum gallery with an empty spotlighted plinth, a velvet rope, and a small blank label, no people, no text
  endings:
    disaster: The board unveils a banana bowl. The museum's reputation goes into storage with the vase.
    scraped: The vase is back, mostly, and the label has been quietly reprinted.
    okay: The board leaves satisfied and the vase stays where it belongs.
    great: The exhibit opens to a real crowd and the night guard finally gets a chair.
    legendary: The vase, the story, and the honest label become a town legend. The board claims credit.
  steps:
    - title: The Empty Plinth
      setup: The main gallery has a plinth, a velvet rope, and a label describing a vase that is no longer there. The board arrives at four.
      scene: a storybook miniature diorama of a museum gallery with an empty plinth under a spotlight, a velvet rope, and a blank label, no people, no text
      pool: people
      game: drop-catch
      sprite: blue and white porcelain vase
      choices:
        - label: Interview the night guard before touching anything
          approach: nouse
          success: The guard remembers a trolley, a squeaky wheel, and a door that should have been locked.
          failure: The guard remembers a dream about the vase and would like to describe it fully.
        - label: Calm the board with a confident story
          approach: charm
          success: You call it a temporary reinterpretation and they write it down approvingly.
          failure: You call it a temporary reinterpretation and the board asks for the form for that.
        - label: Search the whole museum at a dead run
          approach: grit
          success: You find the vase in the staff kitchen, holding bananas.
          failure: You find three unrelated mysteries and no vase.
    - title: The Wrong Vase
      setup: Storage produces a near-identical vase with a chip, a different history, and a very similar shadow.
      scene: a storybook miniature diorama of a museum storage room with numbered shelves, two similar vases, and a dusty accession ledger, no people, no text
      pool: paperwork
      game: sweep-stop
      sprite: magnifying glass with a brass rim
      choices:
        - label: Compare the accession marks under a lamp
          approach: care
          success: The real vase has marks that match the ledger exactly, and the other has a sticker.
          failure: Both vases have marks. Neither mark is in the ledger.
        - label: Ask the donor which one she remembers
          approach: charm
          success: She remembers the crack in the base because she caused it at a wedding.
          failure: She remembers two weddings and no vases.
        - label: Swap them and see which one the alarm likes
          approach: chaos
          success: The alarm ignores one vase entirely, which is a lead.
          failure: The alarm likes both vases very much and the gallery fills with guards.
    - title: The Board Member's Donation
      setup: A board member arrives with a crate, a certificate, and a strong interest in where it gets displayed.
      scene: a storybook miniature diorama of a museum office with a mahogany desk, a wooden crate, and a framed certificate, no people, no text
      pool: office
      game: ring-match
      sprite: gold seal medallion with a ribbon
      choices:
        - label: Check the certificate against the registry
          approach: nouse
          success: The certificate is real, but it belongs to a different object entirely.
          failure: The certificate is real, and the registry is missing the page that matters.
        - label: Offer him a whole case of his own
          approach: charm
          success: He is delighted, and the case is in the corridor where nothing can go wrong.
          failure: He is delighted, and now wants the main gallery, the spotlight, and a speech.
        - label: Display it with a very honest label
          approach: chaos
          success: The label says claimed to be, and visitors find it refreshingly honest.
          failure: The label says claimed to be, and the board member reads it aloud, slowly.
    - title: The Four O'Clock Opening
      setup: The board is in the lobby. The plinth is lit. The spotlight is making a noise like a kettle.
      scene: a storybook miniature diorama of a museum gallery at opening time with a lit plinth, a red ribbon, and rows of waiting chairs, no people, no text
      pool: stage
      game: rhythm-lane
      sprite: a red velvet rope strung between two brass posts
      choices:
        - label: Run a final condition check on the display
          approach: care
          success: The vase is stable, lit, and labelled correctly. The board files in.
          failure: The vase is stable until the spotlight warms up and the label starts to curl.
        - label: Give the board the guided tour of their lives
          approach: charm
          success: You praise each board member's taste individually and the evening becomes a triumph.
          failure: You praise the wrong board member's taste and the evening becomes a lesson.
        - label: Let the school group in early
          approach: chaos
          success: Thirty children gasp at exactly the right moment and the board forgets to be cross.
          failure: Thirty children find the one interactive thing in the building and it is not meant to be interactive.

art-restorer:
  title: Aggressive Art Restorer
  profession: Art Restorer
  tier: 2
  accent: "#c07a5a"
  blurb: A town portrait has been overpainted by six well-meaning mayors, and the gala is tomorrow.
  setting: a storybook miniature diorama of a restoration studio with a large easel, a cracked portrait, and rows of tiny brushes, no people, no text
  endings:
    disaster: The portrait is unveiled with two noses. The gala becomes a debate about ancestry.
    scraped: The portrait survives the evening, though one eyebrow is now a rumour.
    okay: The painting hangs, the gala proceeds, and the mayor praises the varnish.
    great: The original face returns and the town recognises someone's great-aunt.
    legendary: The restored portrait is so fine that the council commissions a second one, and then argues about it for years.
  steps:
    - title: The Portrait Under the Portrait
      setup: The council portrait has a face that does not match the plaque. Under the varnish, something else is waiting.
      scene: a storybook miniature diorama of a restoration studio with a large easel, a cracked portrait, and rows of tiny brushes, no people, no text
      pool: creative
      game: sweep-stop
      sprite: fine paintbrush with a wooden handle
      choices:
        - label: Test the varnish in one corner first
          approach: care
          success: The top layer lifts cleanly and reveals a much better hat.
          failure: The top layer lifts cleanly and takes the original nose with it.
        - label: Ask the town historian who sat for it
          approach: charm
          success: She produces a photograph of the original and a strong opinion about the hat.
          failure: She produces three photographs and a family feud.
        - label: Go at it with the good solvent
          approach: chaos
          success: Six mayors dissolve in an afternoon and the original face is magnificent.
          failure: Six mayors dissolve into a single confused mayor with too many eyebrows.
    - title: The Flaking Sky
      setup: The background has begun to flake in a way that suggests the canvas is tired of holding it.
      scene: a storybook miniature diorama of a studio table with a flaking painting, pots of pigment, and a very small vacuum, no people, no text
      pool: mess
      game: ring-match
      sprite: a glass jar of blue paint with a brush resting across the top
      choices:
        - label: Consolidate the flaking paint edge by edge
          approach: care
          success: The flakes settle down under a careful brush.
          failure: The flakes settle down and then leave at a run.
        - label: Call the framer for a quick backing
          approach: charm
          success: He brings a backing board and a story about a duke.
          failure: He brings a backing board and a bill for the duke.
        - label: Vacuum the loose flakes with the tiny vacuum
          approach: nouse
          success: The tiny vacuum saves the sky and loses only a cloud.
          failure: The tiny vacuum eats a cloud and makes a noise like a judgement.
    - title: The Mayor's Improvement
      setup: The current mayor arrives with a brush and a vision involving a new town logo.
      scene: a storybook miniature diorama of a studio with a mixing table, a portrait on an easel, and a fresh pot of paint, no people, no text
      pool: people
      game: rhythm-lane
      sprite: wooden paint palette with colour blobs
      choices:
        - label: Explain the chemistry of overpainting
          approach: nouse
          success: He understands the word irreversible and puts the brush down.
          failure: He understands the word irreversible as a challenge.
        - label: Offer him a corner of his own to paint
          approach: charm
          success: He paints a small, terrible sun in the corner and leaves happy.
          failure: He paints a large, terrible sun across the face and leaves happy.
        - label: Hide the paint and blame the cat
          approach: chaos
          success: The cat is blamed, the paint is safe, and the mayor buys the cat a medal.
          failure: The cat is blamed, and the cat has an alibi with witnesses.
    - title: The Gala Unveiling
      setup: The gala starts at seven. The portrait is dry, mostly, and the lighting is doing something unhelpful.
      scene: a storybook miniature diorama of a hall with a covered painting on an easel, brass wall lights, and a small stage, no people, no text
      pool: stage
      game: pop-whack
      sprite: ornate gold picture frame
      choices:
        - label: Check the surface and hang it carefully
          approach: care
          success: The portrait hangs straight and the old face looks quietly pleased.
          failure: The portrait hangs straight and then leans, slowly, like a rumour.
        - label: Unveil it with a speech about restoration
          approach: charm
          success: The speech is good enough that people forget to look closely.
          failure: The speech is so good that everyone looks closely.
        - label: Unveil it mid-speech for maximum drama
          approach: chaos
          success: The cloth drops, the room gasps, and the original face gets an ovation.
          failure: The cloth drops early and takes the painting's eyebrow with it.

matchmaker:
  title: Chaotic Matchmaker
  profession: Matchmaker
  tier: 2
  accent: "#d4738f"
  blurb: The town's loneliness registry has a waiting list, a new council form, and the annual dance is tonight.
  setting: a storybook miniature diorama of a matchmaker's office with a card index, two velvet chairs, and a cooling pot of tea, no people, no text
  endings:
    disaster: The dance ends with three feuds, one engagement, and a strongly worded letter to the council.
    scraped: Two couples leave together. One of them is holding hands, and the other is holding a form.
    okay: The dance goes well enough that nobody asks for their money back.
    great: Three matches hold past midnight and the band plays an extra song.
    legendary: The registry empties, the cloakroom romance becomes a town opera, and the clerk sends a thank-you card.
  steps:
    - title: The Impossible File
      setup: A client has a list of requirements that cannot all be true at once, and a dance to attend tonight.
      scene: a storybook miniature diorama of a matchmaker's office with a card index, two velvet chairs, and a cooling pot of tea, no people, no text
      pool: people
      game: ring-match
      sprite: two interlocking golden rings
      choices:
        - label: Ask which requirement matters most
          approach: charm
          success: She admits she mostly wants someone who laughs at her jokes.
          failure: She admits all eleven requirements matter equally and orders more tea.
        - label: Search the registry for a near match
          approach: nouse
          success: You find one name that fits everything except the height, which is negotiable.
          failure: You find four names that fit nothing but share a birthday.
        - label: Promise her a perfect match and improvise
          approach: chaos
          success: The promise buys you time and, somehow, confidence.
          failure: The promise is repeated back to you at the dance, loudly.
    - title: The Two Weddings
      setup: The appointment book has two names in the same slot, and they are each other's exes.
      scene: a storybook miniature diorama of an office with an open appointment book, two cups, and a clock at five, no people, no text
      pool: paperwork
      game: rhythm-lane
      sprite: pink heart-shaped love letter
      choices:
        - label: Rebook one client honestly
          approach: care
          success: One client takes the later slot and a biscuit.
          failure: One client takes the later slot and the biscuit, and tells everyone.
        - label: Split the hour and call it a coincidence
          approach: charm
          success: They meet in the doorway, laugh, and book a table.
          failure: They meet in the doorway and resume a nine-year argument.
        - label: Book them both and hide behind the curtain
          approach: chaos
          success: They argue, then dance, and you take the credit from a safe distance.
          failure: They argue, then notice the curtain has been listening.
    - title: The Four Hundred Questions
      setup: The council has issued a new compatibility form, four hundred questions long, required before the dance.
      scene: a storybook miniature diorama of an office desk with a very thick questionnaire, a stamp, and a wilting plant, no people, no text
      pool: office
      game: pop-whack
      sprite: wooden rubber stamp with a round head
      choices:
        - label: Read it properly and find the loopholes
          approach: nouse
          success: Question 388 only requires a signature, and the rest follows.
          failure: Question 388 requires a signature from a person who no longer exists.
        - label: Get the clerk to waive it
          approach: charm
          success: The clerk waives it in exchange for being seated next to someone interesting.
          failure: The clerk waives it and then sits down to complete it herself.
        - label: Fill it in with a confident fiction
          approach: chaos
          success: The answers are mostly true in spirit and the form accepts them.
          failure: The answers make your client sound like a lighthouse and the form is delighted.
    - title: The Annual Dance
      setup: The dance starts in an hour. The hall is decorated. One client is hiding in the cloakroom.
      scene: a storybook miniature diorama of a hall with paper streamers, a hired bandstand, and a rack of coats, no people, no text
      pool: stage
      game: hold-meter
      sprite: sparkly silver disco ball
      choices:
        - label: Walk her through the hall and introduce her
          approach: care
          success: She meets a bad dancer with good timing and forgets the questionnaire.
          failure: She meets a bad dancer with good timing, then meets four more.
        - label: Give her a pep talk and a lucky pin
          approach: charm
          success: The pin works. She asks someone to dance before the band is ready.
          failure: The pin works and she asks the band to dance.
        - label: Start the music early to force the issue
          approach: chaos
          success: The floor fills before nerves can win and the night takes off.
          failure: The floor is empty and the band plays an entire song to the coat rack.

ghost-tour-guide:
  title: Skeptical Ghost Tour Guide
  profession: Ghost Tour Guide
  tier: 1
  accent: "#5b6f8c"
  blurb: The town's ghost tour has a paying group, a script full of typos, and one very real tapping.
  setting: a storybook miniature diorama of an old cobbled lane at dusk with a lantern, a crooked signpost, and a small waiting bench, no people, no text
  endings:
    disaster: The tour ends early, the group demands refunds, and the tapping follows everyone home.
    scraped: The group leaves unsure whether they got their money's worth, which is technically atmosphere.
    okay: The tour finishes on time and only one fact is wrong.
    great: The group leaves delighted and repeats your worst joke at the pub.
    legendary: The tour sells out for a month and the council puts up a plaque for a ghost you invented.
  steps:
    - title: The Missing Page Four
      setup: Eight tourists, one lantern, and a script with page four replaced by a shopping list.
      scene: a storybook miniature diorama of a cobbled lane at dusk with a lantern, a signpost, and a small waiting bench, no people, no text
      pool: night
      game: rhythm-lane
      sprite: flickering iron lantern
      choices:
        - label: Read the shopping list as if it were a tragedy
          approach: charm
          success: The group is captivated by milk, two apples, and a lie.
          failure: The group asks why the ghost needed apples.
        - label: Stick to the facts you know
          approach: nouse
          success: The verified history is short, grim, and oddly effective.
          failure: The verified history is three sentences long and one of them is wrong.
        - label: Improvise a ghost on the spot
          approach: chaos
          success: Your invented widow is a hit and someone takes a photo of the empty window.
          failure: Your invented widow is a hit and someone asks a question about her alibi.
    - title: The Tapping Window
      setup: Halfway down the lane, a window begins tapping in a rhythm that matches your heartbeat.
      scene: a storybook miniature diorama of an alley at night with a lit upper window and a heavy pipe running down the wall, no people, no text
      pool: night
      game: pop-whack
      sprite: wooden window shutter with a crescent moon cutout
      choices:
        - label: Investigate the window with the lantern
          approach: nouse
          success: It is a loose shutter and the group is almost disappointed.
          failure: It is a loose shutter and behind it is a very full pigeon loft.
        - label: Turn the tapping into part of the story
          approach: charm
          success: You name the ghost Mr Taps and the group applauds the window.
          failure: You name the ghost Mr Taps and the window taps back on cue. Twice.
        - label: Bang on the pipe to answer it
          approach: chaos
          success: The whole terrace answers in a pleasing, terrible chorus.
          failure: The whole terrace answers and a man leans out with a bucket.
    - title: The Rival Tour
      setup: On the next corner, a rival guide has set up with a bigger lantern and a louder ghost.
      scene: a storybook miniature diorama of a square at night with two lanterns, a stone well, and a row of empty benches, no people, no text
      pool: stage
      game: hold-meter
      sprite: brass megaphone
      choices:
        - label: Compare notes with the rival guide
          approach: charm
          success: You agree to split the lane and he gives you a genuinely good ghost.
          failure: You agree to split the lane and he takes the lane with the pub.
        - label: Out-research him on the spot
          approach: nouse
          success: You produce the plaque he has been misquoting for years.
          failure: You produce the plaque and he reads it better than you.
        - label: Stage a haunting contest
          approach: chaos
          success: Both groups get a show and the crowd doubles.
          failure: Both groups get a show and the council gets a noise complaint.
    - title: The Last Stop
      setup: The final stop is the old gaol door. The tour is nearly over and the handle is cold, then warm.
      scene: a storybook miniature diorama of a gaol door at night with iron studs, a lantern hook, and a hanging brass key, no people, no text
      pool: night
      game: drop-catch
      sprite: hanging brass jail key
      choices:
        - label: Finish with the verified story
          approach: care
          success: The group leaves quietly, which is the best review.
          failure: The group leaves quietly and someone asks for a refund in a whisper.
        - label: Ask the group what they saw
          approach: charm
          success: Two of them saw different ghosts and both are excellent.
          failure: Two of them saw the same ghost and it was you.
        - label: Open the door and go in first
          approach: grit
          success: The cell is empty and the echo is perfect. The group will never forget it.
          failure: The cell is empty and the echo says your name before you do.
