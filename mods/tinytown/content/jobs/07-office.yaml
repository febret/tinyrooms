accountant:
  title: Extreme Accountant
  profession: Accountant
  tier: 2
  accent: "#3f7d54"
  blurb: A shoebox of receipts, a deadline at midnight, and a client who insists the yacht was a business expense.
  setting: a storybook accounting office with a mountain of receipts, a brass desk lamp, and a shoebox marked with a question mark
  endings:
    disaster: The file is rejected. The client blames the shoebox, and the shoebox is escorted from the building.
    scraped: The return is filed with three exceptions and one emotional note.
    okay: The books balance and the client pays the invoice, mostly.
    great: The refund is clean, the client is thrilled, and the shoebox is retired with honours.
    legendary: You find a legitimate deduction nobody expected, and the client frames the receipt.
  steps:
    - title: The Shoebox
      setup: The client drops a shoebox on the desk and says the yacht is in there somewhere.
      scene: a wood-panelled office with a shoebox of receipts, a brass lamp, and a calculator the size of a brick
      pool: paperwork
      game: drop-catch
      sprite: a stack of paper receipts tied with a rubber band
      choices:
        - label: Sort the receipts by date and category
          approach: care
          success: The shoebox becomes a system and the yacht turns out to be a dinghy.
          failure: The shoebox becomes a system and the yacht turns out to be nine dinghies.
        - label: Interview the client about the big items
          approach: charm
          success: The client admits the yacht was a timeshare and the numbers improve.
          failure: The client admits the yacht was a timeshare and starts crying about the timeshare.
        - label: Tip it all out and trust the mountain
          approach: chaos
          success: The mountain reveals the one receipt that matters, face up.
          failure: The mountain reveals a parking ticket the client has framed.
    - title: The Cursed Spreadsheet
      setup: The spreadsheet has more tabs than the building has windows, and one tab is named after a person.
      scene: a dim office with a monitor showing a vast spreadsheet and a sticky note on the screen
      pool: office
      game: hold-meter
      sprite: chunky beige desk calculator
      choices:
        - label: Rebuild the sheet from first principles
          approach: nouse
          success: The new sheet is boring, correct, and loads instantly.
          failure: The new sheet is beautiful and refuses to add up row nine.
        - label: Ask the intern which tab is sacred
          approach: charm
          success: The intern points to the cursed tab and explains year one.
          failure: The intern points to the cursed tab and leaves for lunch.
        - label: Delete the cursed tab and see what happens
          approach: chaos
          success: The sheet relaxes, and a hidden refund appears in column J.
          failure: The sheet relaxes, and every number becomes a date from 1974.
    - title: The Midnight Audit
      setup: An auditor arrives at eleven, and the building's heating has gone home for the night.
      scene: an office at night with a long table of folders, a laptop, and an empty coat on a hook
      pool: night
      game: pop-whack
      sprite: tiny toy yacht with a white sail
      choices:
        - label: Walk the auditor through the file
          approach: nouse
          success: The auditor follows the trail and signs page after page.
          failure: The auditor follows the trail and finds a receipt for a horse.
        - label: Offer coffee and common ground
          approach: charm
          success: The auditor warms up, and the questions become fair.
          failure: The auditor warms up and starts telling you about their own accountant.
        - label: Argue the yacht with total conviction
          approach: chaos
          success: The argument is so specific that the auditor begins to believe in the yacht.
          failure: The argument is so specific that the auditor asks for the yacht's registration.
    - title: The Filing
      setup: The deadline is midnight. The return is one signature and one very small discrepancy away.
      scene: a tidy desk at night with a single form, a pen, and a clock reading eleven fifty-two
      pool: office
      game: rhythm-lane
      sprite: fountain pen with a swirly gold nib
      choices:
        - label: Reconcile the discrepancy one last time
          approach: care
          success: The numbers close with a clean click and the form goes through.
          failure: The numbers close, but the clock does not.
        - label: Get the client on the phone for approval
          approach: charm
          success: The client approves in one sentence and says something almost warm.
          failure: The client approves, then adds a new expense for the phone call.
        - label: File it with a flourish at 11:59
          approach: chaos
          success: The submission lands at 11:59 and the system accepts it with a beep.
          failure: The submission lands at 12:01 and the system accepts it with a pause.

lawyer:
  title: Small Claims Firebrand
  profession: Lawyer
  tier: 3
  accent: "#7a3f4f"
  blurb: A missing garden gnome, a furious neighbour, and a court that has already heard about the gnome.
  setting: a storybook small-claims courtroom with a wooden bench, a stack of evidence bags, and a plaster bust of justice wearing a scarf
  endings:
    disaster: The case is dismissed. The gnome is declared a public monument.
    scraped: The settlement is small, awkward, and signed by everyone except the gnome.
    okay: The judge rules in your favour and asks everyone to go home.
    great: You win the case with one devastating sentence and a photograph.
    legendary: The ruling becomes a local precedent, and law students visit the gnome.
  steps:
    - title: The Gnome in Question
      setup: The client's garden gnome is in an evidence bag, and the neighbour has filed a counterclaim about the lawn.
      scene: a small courtroom with a wooden bench, an evidence bag holding a garden gnome, and a potted fern
      pool: people
      game: sweep-stop
      sprite: red pointy garden gnome hat
      choices:
        - label: Read the counterclaim before the hearing
          approach: nouse
          success: You find a typo that undermines the whole lawn argument.
          failure: You find the counterclaim is about a different lawn entirely.
        - label: Calm the client and hear the full story
          approach: care
          success: The client gives you the date, the photograph, and the neighbour's first name.
          failure: The client gives you a forty-minute history of the street.
        - label: Greet the neighbour warmly in front of the clerk
          approach: charm
          success: The neighbour is disarmed and says one useful, unguarded thing.
          failure: The neighbour is disarmed, hugs you, and cites it as harassment.
    - title: The Missing Photograph
      setup: The photograph that proves everything lived on a phone that has since become a small brick.
      scene: a courtroom corridor with a vending machine, a dead phone, and a noticeboard of old rulings
      pool: machines
      game: drop-catch
      sprite: cracked smartphone with a spiderweb screen
      choices:
        - label: Retrieve the photo from the cloud
          approach: nouse
          success: The photo loads at full size and the gnome is clearly in the wrong garden.
          failure: The photo loads at thumbnail size and the gnome is clearly a birdbath.
        - label: Ask the neighbour for their copy
          approach: charm
          success: They hand it over, smug, not realising it helps you.
          failure: They hand it over, smug, and it helps them.
        - label: Recreate the scene with a stand-in gnome
          approach: chaos
          success: The stand-in is so convincing that the clerk accepts it into evidence.
          failure: The stand-in is so convincing that someone tries to arrest it.
    - title: The Judge Has Heard Enough
      setup: The judge arrives with a coffee and the air of someone who has already read everything.
      scene: a courtroom bench with a judge's gavel, a coffee cup, and the evidence gnome facing forward
      pool: stage
      game: hold-meter
      sprite: wooden judge's gavel
      choices:
        - label: Present the timeline in three clean points
          approach: nouse
          success: The judge writes all three down and asks the neighbour for a response.
          failure: The judge writes all three down and asks you to number them again.
        - label: Let the client speak from the heart
          approach: charm
          success: The client's short speech is genuinely moving and lands perfectly.
          failure: The client's short speech becomes a longer speech about bins.
        - label: Cross-examine the neighbour with flair
          approach: chaos
          success: The neighbour contradicts themselves twice and the room enjoys it.
          failure: The neighbour contradicts themselves twice with better evidence.
    - title: The Ruling
      setup: The judge is ready to rule and asks if anyone has a final, brief statement.
      scene: a courtroom with a raised bench, two waiting parties, and the gnome on the exhibit table
      pool: people
      game: pop-whack
      sprite: brass scales of justice
      choices:
        - label: Sum up in one careful sentence
          approach: care
          success: The sentence lands and the judge nods once, slowly.
          failure: The sentence lands and the judge asks you to repeat it, slower.
        - label: Make the closing about the street, not the gnome
          approach: charm
          success: The room goes quiet and the ruling comes down on your side.
          failure: The room goes quiet and the judge suggests mediation instead.
        - label: Bring the gnome to the bench for emphasis
          approach: chaos
          success: The gnome is placed on the bench and the ruling is unforgettable.
          failure: The gnome is placed on the bench and the judge rules on the gnome's behalf.

tech-support:
  title: Tech Support Whisperer
  profession: Tech Support
  tier: 1
  accent: "#4b8fa8"
  blurb: A printer that has stopped believing in itself, a caller with a very long cable, and a script that assumes everyone is calm.
  setting: a storybook call-centre desk with a headset, a forest of sticky notes, and a monitor showing a friendly error
  endings:
    disaster: The ticket is escalated to a department that no longer exists.
    scraped: The printer works if you ask it nicely and stand very still.
    okay: The issue is fixed, the ticket is closed, and the caller says thank you.
    great: The caller writes a thank-you note and mentions your name to the manager.
    legendary: The fix becomes the team's official answer. Someone prints it and frames it.
  steps:
    - title: Have You Tried Nothing
      setup: A caller says the printer is making a sound. The sound, described at length, is the sound of a printer.
      scene: a call-centre cubicle with a headset, a forest of sticky notes, and a printer manual
      pool: machines
      game: ring-match
      sprite: tangled beige ethernet cable coil
      choices:
        - label: Follow the script to the letter
          approach: nouse
          success: Step four works, and the printer settles into a normal hum.
          failure: Step four works, and the printer starts humming in a different key.
        - label: Listen to the caller without interrupting
          approach: care
          success: The caller relaxes, and the actual problem turns out to be the cable.
          failure: The caller relaxes, and the story gains a second printer.
        - label: Tell them to hit it with a shoe
          approach: chaos
          success: The printer respects the shoe and returns to work.
          failure: The printer respects the shoe and files a complaint.
    - title: The Ticket That Escaped
      setup: The ticket has jumped queues and now sits with a team that closed in 2019.
      scene: a dim office with three monitors, a ticket queue glowing red, and a mug shaped like a floppy disk
      pool: office
      game: sweep-stop
      sprite: blue floppy disk
      choices:
        - label: Trace the ticket history line by line
          approach: nouse
          success: You find the routing rule and send it back to a living team.
          failure: You find the routing rule and it points to the stationery cupboard.
        - label: Ask the old-timer what the queue used to mean
          approach: charm
          success: The old-timer remembers the workaround and mimes it beautifully.
          failure: The old-timer remembers a different system entirely and is very confident.
        - label: Take the ticket and close it yourself
          approach: chaos
          success: The ticket closes, the customer is happy, and nobody official notices.
          failure: The ticket closes, and a supervisor notices within the hour.
    - title: The Angry Manager
      setup: The caller's manager is on the line now, asking why a printer needs a support ticket at all.
      scene: a call-centre desk with two headsets, a rising sticky-note avalanche, and a monitor showing a queue
      pool: people
      game: drop-catch
      sprite: a computer mouse with a curly wire tail
      choices:
        - label: Explain the fix in plain language
          approach: care
          success: The manager understands and asks you to train their team.
          failure: The manager understands and asks for it in writing, twice.
        - label: Give the manager the same steps calmly
          approach: charm
          success: They try it, it works, and the call ends in an unlikely thank you.
          failure: They try it, it works, and they claim they thought of it.
        - label: Put the manager on hold for dramatic effect
          approach: chaos
          success: The silence does something wonderful to their tone.
          failure: The silence does something wonderful to the hold music.
    - title: The Ticket Closed
      setup: The printer is working. The manager is calm. The call is one signature away from done.
      scene: a call-centre cubicle with a headset, a completed ticket on screen, and a printer purring nearby
      pool: office
      game: hold-meter
      sprite: retro desktop printer with a paper sheet
      choices:
        - label: Write a clear closing note
          approach: care
          success: The note is clear, kind, and future-proof.
          failure: The note is clear and then covered by a sticky note.
        - label: Call the customer back to confirm
          approach: charm
          success: The customer confirms enthusiastically and asks for your extension.
          failure: The customer confirms and asks for the printer's extension.
        - label: Close the ticket with a flourish
          approach: chaos
          success: The ticket closes and the queue visibly shortens.
          failure: The ticket closes and reopens itself, as if it missed you.

startup-founder:
  title: Startup Founder
  profession: Startup Founder
  tier: 3
  accent: "#c25f3c"
  blurb: A pitch deck, a borrowed office, and a product that works only when the founder is in the room.
  setting: a storybook converted garage with a whiteboard of arrows, a coffee machine, and one famous beanbag
  endings:
    disaster: The demo fails, the investor leaves, and the beanbag deflates.
    scraped: The pitch earns a second meeting and a small, cautious cheque.
    okay: The investor is interested. The product remains a rumour with a logo.
    great: The demo works, the round closes, and somebody brings a plant.
    legendary: The pitch becomes a case study, and the beanbag is mentioned in the write-up.
  steps:
    - title: The Demo That Only Works Once
      setup: The demo works. It worked twice in the garage, and now it has been asked to work on a stage.
      scene: a borrowed meeting room with a laptop, a projector, and a beanbag dragged in for moral support
      pool: machines
      game: rhythm-lane
      sprite: glowing yellow lightbulb
      choices:
        - label: Run the demo twice before the meeting
          approach: nouse
          success: The second run finds the bug and fixes the story.
          failure: The second run finds twelve bugs and one new feature.
        - label: Rehearse the pitch until it feels effortless
          approach: care
          success: The words become easy and the timing clicks.
          failure: The words become easy, and then you say them in your sleep.
        - label: Demo something unreleased as an act of faith
          approach: chaos
          success: The unreleased feature works and the room leans forward.
          failure: The unreleased feature works and then announces itself to the room.
    - title: The Runway
      setup: The bank has sent a letter, the coffee machine has broken, and the team wants to know about next month.
      scene: a garage office with a whiteboard of arrows, a bank letter, and a dead coffee machine
      pool: paperwork
      game: ring-match
      sprite: a golden piggy bank with a coin slot
      choices:
        - label: Rebuild the budget for the month
          approach: nouse
          success: The maths holds and the team stops asking about next month.
          failure: The maths holds until someone asks about the month after.
        - label: Tell the team the truth plainly
          approach: care
          success: The truth lands, and two people offer to go part-time.
          failure: The truth lands, and one person updates their profile quietly.
        - label: Sell the beanbag on the internet
          approach: chaos
          success: The beanbag sells for an unreasonable sum to a collector.
          failure: The beanbag sells, and the buyer asks to collect it in person, today.
    - title: The Investor's Question
      setup: The investor arrives at nine and asks the one question the deck does not answer.
      scene: a garage boardroom with a whiteboard of charts, a laptop, and a very small round table
      pool: people
      game: sweep-stop
      sprite: tiny rocket ship
      choices:
        - label: Answer with the honest number
          approach: nouse
          success: The honesty surprises them, and the conversation gets real.
          failure: The honesty surprises them, and they check it three ways.
        - label: Reframe the weakness as a moat
          approach: charm
          success: The reframe is convincing enough to earn a second meeting.
          failure: The reframe is so convincing that they ask for it in writing.
        - label: Turn the question back on the investor
          approach: chaos
          success: They answer at length, and it becomes the best part of the pitch.
          failure: They answer at length, and the meeting becomes theirs.
    - title: The Term Sheet
      setup: The term sheet is on the table, and every clause looks like it was written by a different lawyer.
      scene: a cafe table with a term sheet, two coffee cups, and a pen with a chipped lid
      pool: office
      game: drop-catch
      sprite: rolled contract with a red wax seal
      choices:
        - label: Read every clause and mark concerns
          approach: care
          success: The negotiation stays warm and the terms soften in two places.
          failure: The negotiation stays warm and lasts until the cafe closes.
        - label: Ask for one small, brave change
          approach: charm
          success: The change is accepted, and the coffee never even goes cold.
          failure: The change is accepted before you finish explaining it, which is worse.
        - label: Sign it now and celebrate properly
          approach: chaos
          success: The signature lands, the coffee becomes champagne, and the team gets a plant.
          failure: The signature lands, and page four turns out to have been a menu.

librarian:
  title: Forbidden Shelf Librarian
  profession: Librarian
  tier: 2
  accent: "#6b5b95"
  blurb: A returned book that should not exist, a borrower who will not meet your eyes, and a reading room that is far too quiet.
  setting: a storybook library with towering shelves, a brass ladder, and a string-tied cabinet marked private
  endings:
    disaster: The book is returned to the shelf. The shelf is then closed for renovation.
    scraped: The book is catalogued, quarantined, and politely ignored.
    okay: The book is secured and the borrower agrees to pay the fine.
    great: You save the book, the borrower, and the library's silence.
    legendary: The library adds a new wing for one shelf, and the silence is upgraded.
  steps:
    - title: The Returned Book
      setup: The book comes back through the returns slot at 4:58, still warm, with no borrower in sight.
      scene: a library returns desk with a brass slot, a strange warm book, and a lamp under a green shade
      pool: paperwork
      game: pop-whack
      sprite: warm glowing book with a ribbon bookmark
      choices:
        - label: Check the catalogue number against the spine
          approach: nouse
          success: The number matches a book that was never printed.
          failure: The number matches three different books, all missing.
        - label: Ask the borrower hovering by the shelves
          approach: charm
          success: They admit they found it in a wall and leave quickly.
          failure: They admit they found it in a wall and ask for a receipt.
        - label: Open it right there and read a line
          approach: chaos
          success: The line describes your own reading room, slightly wrong.
          failure: The line describes your own reading room, exactly right.
    - title: The Quiet Room
      setup: The reading room has gone quiet in a way the staff have started to notice.
      scene: a reading room with empty tables, green lamps, and dust hanging in the light
      pool: night
      game: rhythm-lane
      sprite: green glass reading lamp
      choices:
        - label: Check every table and every window
          approach: care
          success: You find a stopped clock and a window that was not there yesterday.
          failure: You find four stopped clocks and one that is running backwards.
        - label: Ask the senior librarian about the cabinet
          approach: charm
          success: She gives you a key and one sentence of warning.
          failure: She gives you a look and a form to fill in.
        - label: Read the book aloud to see what happens
          approach: chaos
          success: The lamps brighten and the room rearranges itself politely.
          failure: The lamps brighten and the room rearranges itself around you.
    - title: The Borrower Returns
      setup: The borrower is back, and this time they have brought a library card from a library that closed in 1962.
      scene: a library desk with an old card, a strange book, and a brass bell within reach
      pool: people
      game: ring-match
      sprite: brass service bell
      choices:
        - label: Verify the card in the old ledger
          approach: nouse
          success: The ledger confirms the card and names a shelf that no longer exists.
          failure: The ledger confirms the card and names you as the guarantor.
        - label: Offer them a chair and a cup of tea
          approach: care
          success: Over tea they explain the book, the wall, and the room.
          failure: Over tea they explain the book for an hour and forget the wall.
        - label: Ring the bell for assistance
          approach: chaos
          success: The bell brings the whole night staff, and they have been expecting this.
          failure: The bell brings nobody, and the silence rings back.
    - title: The Forbidden Shelf
      setup: The cabinet is open. The shelf inside has room for exactly one more book.
      scene: a hidden library shelf behind a cabinet door, lit by a brass lamp, with one empty space
      pool: creative
      game: sweep-stop
      sprite: old brass skeleton key
      choices:
        - label: Catalogue it, quarantine it, and note the date
          approach: care
          success: The book goes into the cabinet with a proper card and a proper warning.
          failure: The book goes in, and the card goes missing by morning.
        - label: Return it to the borrower with conditions
          approach: charm
          success: They accept the conditions and promise to bring it back on time.
          failure: They accept the conditions and immediately ask to borrow two more.
        - label: Put it back on the ordinary shelf
          approach: chaos
          success: The shelf accepts it, and the library feels normal for the first time in a week.
          failure: The shelf accepts it, and the library feels normal in a way nobody trusts.
