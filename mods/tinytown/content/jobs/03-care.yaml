teacher:
  title: Substitute Teacher, Class 4B
  profession: Teacher
  tier: 2
  accent: "#5f8f6a"
  blurb: The lesson plan is one drawing and the word survive. The class has already read it.
  setting: a storybook miniature diorama of a primary school classroom with tiny desks, a chalkboard, a hamster cage, and a wall of improbably good drawings
  endings:
    disaster: Class 4B teaches you a lesson instead. The lesson is about fire drills.
    scraped: The class survives, you survive, and the worksheet becomes a group art project.
    okay: The lesson happens, roughly on time, and the hamster is back in the cage.
    great: The class learns something and the head teacher asks who wrote the lesson plan.
    legendary: Class 4B builds a working volcano, wins the assembly, and names the hamster after you.
  steps:
    - title: The Lesson Plan Is a Riddle
      setup: The regular teacher has left a plan consisting of one drawing, the word survive, and a coffee ring that might be a map.
      scene: a miniature storybook diorama of a classroom desk with a single sheet of paper, a coffee ring, and a row of tiny chairs waiting
      pool: paperwork
      game: pop-whack
      sprite: a gold star sticker
      choices:
        - label: Decode the drawing and build a lesson from it
          approach: nouse
          success: The drawing is a food chain and the class is quietly fascinated.
          failure: The drawing is a floor plan and the class knows the building better than you.
        - label: Ask the class what they usually do on Wednesdays
          approach: charm
          success: They explain the routine with great seriousness and one small lie.
          failure: They explain the routine, and the lie is the fire alarm.
        - label: Teach whatever is on the drawing with total confidence
          approach: chaos
          success: Your improvised lesson on volcanoes is a hit and nobody checks the curriculum.
          failure: Your improvised lesson is a hit, and now there are three volcanoes.
    - title: The Class Hamster Is Loose
      setup: The lesson is rolling, the class is almost quiet, and the hamster has left the cage with the confidence of a tenured professor.
      scene: a miniature storybook diorama of a classroom with an open hamster cage, a trail of sawdust between desks, and a bookcase to hide behind
      pool: animals
      game: rhythm-lane
      sprite: a sunflower seed
      choices:
        - label: Close the doors and set a gentle trap
          approach: care
          success: The hamster walks into the trap and accepts a cucumber slice as an apology.
          failure: The hamster walks into the trap, eats the bait, and walks out again.
        - label: Turn the hunt into a lesson
          approach: charm
          success: The class forms a search grid and the hamster is found in record time.
          failure: The class forms a search grid and finds four other things that were also lost.
        - label: Follow it into the bookcase
          approach: chaos
          success: You find the hamster and a forgotten stash of confiscated toys.
          failure: You find the hamster, and it finds the fire alarm pull cord.
    - title: The Fire Drill
      setup: The hamster is secure, the class is calm, and the fire alarm goes off during the volcano demonstration, which is either terrible timing or excellent timing.
      scene: a miniature storybook diorama of a school corridor with a smoking science-fair volcano, coats on hooks, and an alarm bell on the wall
      pool: danger
      game: ring-match
      sprite: a red school handbell
      choices:
        - label: Lead the class out in a calm line
          approach: care
          success: Class 4B exits in perfect order and the volcano is declared a controlled burn.
          failure: Class 4B exits in perfect order, and one child takes the volcano with them.
        - label: Use the drill as a teaching moment
          approach: nouse
          success: The class recites the safety rules while walking and the inspector is impressed.
          failure: The class recites the safety rules louder than the alarm and starts a chant.
        - label: Put the volcano out with the nearest extinguisher
          approach: chaos
          success: The volcano is out, the corridor is white, and the class applauds.
          failure: The volcano is out, the corridor is white, and so is the head teacher.
    - title: The Parents' Evening
      setup: The drill is over, the corridor is clean, and the parents are arriving for a ten-minute meeting that the regular teacher forgot to mention.
      scene: a miniature storybook diorama of a classroom at evening with parents' chairs in a row, a stack of worksheets, and the hamster cage centre stage
      pool: people
      game: sweep-stop
      sprite: a shiny red apple
      choices:
        - label: Present the class's real work honestly
          approach: care
          success: The parents read the worksheets and one of them tears up, in a good way.
          failure: The parents read the worksheets and ask why the answers are mostly drawings of the hamster.
        - label: Tell the story of the day with flair
          approach: charm
          success: The parents laugh, relax, and leave believing Class 4B is in safe hands.
          failure: The parents laugh, relax, and ask for the version with fewer volcanoes.
        - label: Let the class present themselves
          approach: chaos
          success: The children deliver a flawless presentation with a hamster-based diagram.
          failure: The children deliver a flawless presentation and then demand a vote of confidence.

nurse:
  title: Night Shift Nurse
  profession: Nurse
  tier: 3
  accent: "#4f6f9e"
  blurb: The ward is quiet, the coffee is a rumour, and Room 6 has asked for a window with a sea view.
  setting: a storybook miniature diorama of a hospital ward at night with curtained beds, a humming vending machine, and a window showing only rooftops
  endings:
    disaster: The ward runs itself for one hour and does a surprisingly good job, which is worse.
    scraped: Everyone is alive, the paperwork is creative, and the coffee machine has been forgiven.
    okay: The night ends with all patients in their own beds and the notes mostly accurate.
    great: Dawn arrives with the ward calm and one patient calling you the best part of the building.
    legendary: Every patient sleeps, every chart balances, and the vending machine gives you a free chocolate.
  steps:
    - title: The Patient in Room 6
      setup: It is two in the morning, the ward is quiet, and Room 6 has requested a window with a sea view. There is no sea.
      scene: a miniature storybook diorama of a hospital room at night with a curtained bed, a bedside table, a glass of water, and a window over rooftops
      pool: night
      game: hold-meter
      sprite: a little lighthouse figurine
      choices:
        - label: Check the chart before the conversation
          approach: nouse
          success: The chart mentions confusion and a fondness for lighthouses.
          failure: The chart is two pages of somebody else's dinner order.
        - label: Sit down and listen to the request
          approach: care
          success: The patient describes a holiday and settles back with a smile.
          failure: The patient describes a holiday and now wants a boat as well.
        - label: Open the window and describe the sea
          approach: charm
          success: The patient closes their eyes and the rooftops sound almost like waves.
          failure: The patient opens their eyes and asks why the sea has chimneys.
    - title: The Missing Chart
      setup: The ward is quiet again, but the medication trolley is missing a chart and the vending machine has started dispensing nothing but crisps.
      scene: a miniature storybook diorama of a nurses' station at night with a medication trolley, a stack of folders, and a glowing vending machine
      pool: paperwork
      game: pop-whack
      sprite: a chocolate bar half unwrapped from silver foil
      choices:
        - label: Retrace the rounds and rebuild the chart
          approach: nouse
          success: The chart is reconstructed and the doses line up like a small, boring miracle.
          failure: The chart is reconstructed, and one entry is just the word later.
        - label: Ask the night sister where it went
          approach: charm
          success: The night sister produces it from a folder marked do not lose and gives you a biscuit.
          failure: The night sister produces a lecture and a second folder.
        - label: Shake the vending machine for clues
          approach: chaos
          success: The chart falls out along with three bags of crisps and a rubber duck.
          failure: The vending machine falls on your foot and dispenses an apology.
    - title: The Power Cut
      setup: The chart situation is settled, the ward is calm, and then the lights go out, which is the hospital's way of asking for a favour.
      scene: a miniature storybook diorama of a dark hospital corridor with emergency lights, a stalled lift, and a red call button glowing
      pool: danger
      game: rhythm-lane
      sprite: a glowing yellow torch
      choices:
        - label: Check every bed with a torch
          approach: care
          success: Every patient is accounted for and one of them is asleep through the whole thing.
          failure: Every patient is accounted for, and one has decided to help.
        - label: Find the backup generator
          approach: grit
          success: The generator starts and the ward glows back to life with a satisfying hum.
          failure: The generator starts, then stops, then starts again to keep you humble.
        - label: Run the ward by candlelight and calm
          approach: charm
          success: The patients sing, softly, and the power returns to a very contented ward.
          failure: The patients sing, loudly, and the power returns to a noise complaint.
    - title: Dawn Rounds
      setup: The lights are back, the coffee machine is brewing something brown, and the day shift arrives in twenty minutes.
      scene: a miniature storybook diorama of a hospital ward at dawn with pale light through the windows, a tidy trolley, and a pot of coffee
      pool: people
      game: ring-match
      sprite: a steaming coffee mug
      choices:
        - label: Hand over every detail in order
          approach: nouse
          success: The handover is so clear the day nurse writes your name in the log with a smiley face.
          failure: The handover is so thorough the day nurse misses the start of their shift.
        - label: Check on Room 6 one last time
          approach: care
          success: Room 6 is asleep, the window is open, and the rooftops are doing their best sea.
          failure: Room 6 is awake and has written you a poem about lighthouses.
        - label: Celebrate the shift with one loud biscuit
          approach: chaos
          success: The ward wakes up laughing and the day shift arrives to a party.
          failure: The ward wakes up laughing and the day shift arrives to a biscuit-based incident report.

dentist:
  title: Tooth Fairy Enforcer
  profession: Dentist
  tier: 2
  accent: "#7b9ec4"
  blurb: A loose tooth, a family argument, and a ledger that says this tooth was already collected in 1962.
  setting: a storybook miniature diorama of a dental surgery with a reclining chair, a tray of tiny mirrors, and a shelf of oddly labelled tooth jars
  endings:
    disaster: The tooth stays in, the ledger stays unbalanced, and the tooth fairy leaves a note about your filing.
    scraped: The tooth comes out, the coin is disputed, and everyone agrees to never mention the ledger again.
    okay: The extraction is clean and the family leaves with a coin and a story.
    great: The tooth comes out perfectly and the ledger finally balances.
    legendary: You resolve a sixty-year tooth debt and the fairy leaves a receipt in solid silver.
  steps:
    - title: The Tooth That Won't Leave
      setup: A patient arrives with a tooth that has been loose since Easter and is now refusing to participate in the concept of departure.
      scene: a miniature storybook diorama of a dental surgery with a reclining chair, an x-ray screen, and a tooth chart on the wall
      pool: machines
      game: drop-catch
      sprite: a shiny white molar tooth
      choices:
        - label: Take an x-ray before deciding
          approach: nouse
          success: The x-ray shows the tooth is attached to a surprising amount of optimism.
          failure: The x-ray shows the tooth, the jaw, and a small object nobody can name.
        - label: Explain the procedure in calm detail
          approach: care
          success: The patient relaxes and the tooth releases on the first gentle pull.
          failure: The patient relaxes so much they fall asleep mid-sentence.
        - label: Offer a countdown and a promise
          approach: charm
          success: The countdown works and the tooth comes free with a tiny, dignified click.
          failure: The countdown reaches one and the tooth calls your bluff.
    - title: The Family Heirloom
      setup: The chair is empty, the instruments are cleaned, and then the grandmother arrives to explain that the tooth in question has been in the family for four generations.
      scene: a miniature storybook diorama of a dental reception with a small glass jar, a family photo, and a reception desk with a bell
      pool: people
      game: sweep-stop
      sprite: a glass jar of teeth
      choices:
        - label: Ask for the family's version of the story
          approach: charm
          success: The grandmother admits the tooth was collected, returned, and re-collected twice.
          failure: The grandmother admits the tooth was never theirs and would like it back anyway.
        - label: Check the tooth's records against the ledger
          approach: nouse
          success: The ledger shows a 1962 collection and a missing signature.
          failure: The ledger shows three collections and a doodle of a fairy with a grudge.
        - label: Offer the family a ceremonial handover
          approach: care
          success: The handover is dignified and the grandmother cries in a good way.
          failure: The handover is dignified and the grandmother demands a second ceremony for the other tooth.
    - title: The Ledger of Lost Teeth
      setup: The family has been sent home with promises, the jar is back on the shelf, and the ledger has started to disagree with itself in red ink.
      scene: a miniature storybook diorama of a back office with a heavy leather ledger, shelves of labelled jars, and a single desk lamp
      pool: paperwork
      game: ring-match
      sprite: a leather-bound ledger book
      choices:
        - label: Audit the ledger page by page
          approach: care
          success: You find the missing entry and the ledger settles into a satisfied silence.
          failure: You find the missing entry and four new ones written in the same hand.
        - label: Call the regional tooth office
          approach: nouse
          success: The office confirms the debt and authorises a ceremonial coin.
          failure: The office puts you on hold for a fairy opera.
        - label: Balance the ledger with a bold correction
          approach: chaos
          success: The ledger accepts the correction and stops creaking.
          failure: The ledger accepts the correction, then adds a footnote in your name.
    - title: The Extraction
      setup: The ledger has stopped arguing for now, the chair is ready, and the patient has brought the whole family to watch the coin arrive.
      scene: a miniature storybook diorama of a dental surgery with a chair, a row of folding chairs, and a coin balanced on a velvet cushion
      pool: stage
      game: rhythm-lane
      sprite: a blue toothbrush with white and blue bristles
      choices:
        - label: Perform the handover step by step
          approach: care
          success: The coin is placed, the tooth is returned, and the room exhales together.
          failure: The coin is placed and the tooth is still in the jar, which nobody mentions until later.
        - label: Make a small speech about dental history
          approach: charm
          success: The speech is short enough to be charming and the coin lands with a flourish.
          failure: The speech is long enough to lose the room and the coin rolls under the chair.
        - label: Let the youngest child do the honours
          approach: chaos
          success: The child places the coin with tremendous seriousness and the family applauds.
          failure: The child places the coin in their pocket and the family applauds anyway.

veterinarian:
  title: Emergency Vet
  profession: Veterinarian
  tier: 2
  accent: "#6fa08b"
  blurb: A goat has eaten a wedding ring, the waiting room is full, and the X-ray machine has one good picture left in it.
  setting: a storybook miniature diorama of a veterinary clinic at night with a tiled exam room, an x-ray viewer, and a row of carriers in the waiting area
  endings:
    disaster: The goat is fine, the ring is not, and the wedding is rescheduled to a venue with fewer animals.
    scraped: The ring is recovered, slightly chewed, and the bride says it adds character.
    okay: The goat recovers, the ring is returned, and the clinic closes an hour late.
    great: The ring is recovered intact and the wedding party sends the clinic a cake.
    legendary: You save the goat, the ring, and the wedding, and the goat is invited as a guest of honour.
  steps:
    - title: The Goat and the Wedding Ring
      setup: The first emergency of the night is a goat named Barnaby who has swallowed a wedding ring and is now chewing the clipboard with a clear conscience.
      scene: a miniature storybook diorama of a vet exam room with a goat on a mat, an open clipboard, and a small bowl of water
      pool: animals
      game: sweep-stop
      sprite: a gold wedding ring
      choices:
        - label: Check the goat's vitals before anything else
          approach: care
          success: Barnaby is stable and mildly pleased with himself.
          failure: Barnaby is stable and has eaten the pen as well.
        - label: Ask the owners exactly what happened
          approach: charm
          success: They admit the ring was in a slice of cake, which explains the crumbs.
          failure: They admit the ring was in a slice of cake and the cake was for the reception.
        - label: Feel for the ring through the flank
          approach: grit
          success: You find a hard lump exactly where the ring should be.
          failure: You find a hard lump and Barnaby finds your sleeve.
    - title: The Waiting Room
      setup: Barnaby is in a stable pen, and the waiting room now holds a parrot, a tortoise, and a dog who has eaten an entire remote control.
      scene: a miniature storybook diorama of a vet waiting room with carriers, a parrot perch, a tortoise on a blanket, and a stack of intake forms
      pool: mess
      game: ring-match
      sprite: a yellow squeaky rubber duck
      choices:
        - label: Triage by urgency and keep a list
          approach: nouse
          success: Everyone is seen in the right order and the remote control is located on the x-ray.
          failure: Everyone is seen in the right order except the tortoise, who has waited since Tuesday.
        - label: Reassure the owners one at a time
          approach: care
          success: The room calms and the parrot stops reciting the fire exit instructions.
          failure: The room calms and the parrot starts reciting your lunch order.
        - label: Let the parrot take the history
          approach: chaos
          success: The parrot repeats the exact symptoms and the owners are astonished.
          failure: The parrot repeats something the owners did not want the room to know.
    - title: The X-Ray Machine
      setup: The waiting room is under control, and the X-ray machine has one exposure left before it needs a part that arrives on Thursday.
      scene: a miniature storybook diorama of an x-ray room with a humming machine, a protective apron, and a goat staring at the ceiling
      pool: machines
      game: rhythm-lane
      sprite: a chewy dog bone
      choices:
        - label: Position Barnaby carefully and use the last exposure
          approach: care
          success: The image is perfect and the ring is exactly where you hoped.
          failure: The image is perfect and the ring is exactly where you feared.
        - label: Borrow the dentist's portable unit
          approach: nouse
          success: The dentist lends the unit and the ring shows up in glorious grey.
          failure: The dentist lends the unit and its battery, which is empty.
        - label: Give the machine a persuasive thump
          approach: chaos
          success: The machine coughs out one last excellent image and a small spark.
          failure: The machine coughs out one last image of the ceiling.
    - title: The Midnight Surgery
      setup: The theatre is ready, Barnaby is asleep with the serene confidence of an animal who has never filled in a form, and the ring is running out of places to hide.
      scene: a miniature storybook diorama of an operating theatre at night with a steel table, monitors, and a tray of instruments
      pool: night
      game: pop-whack
      sprite: a curly stethoscope
      choices:
        - label: Follow the x-ray and work slowly
          approach: care
          success: The ring comes free intact and Barnaby wakes up asking for breakfast.
          failure: The ring comes free, slightly chewed, and Barnaby wakes up asking for a second breakfast.
        - label: Talk the owners through the procedure first
          approach: charm
          success: The owners wait calmly and the surgery goes without a hitch.
          failure: The owners wait calmly until the parrot starts narrating from the corridor.
        - label: Retrieve it with one confident motion
          approach: grit
          success: The ring is out in seconds and the nurse gives you a look of pure respect.
          failure: The ring is out in seconds and so is a small portion of Barnaby's dignity.

pet-groomer:
  title: Extreme Pet Groomer
  profession: Pet Groomer
  tier: 1
  accent: "#c07a9a"
  blurb: A matted dog, a client with a vision, and a grooming competition with a strict no-glitter rule.
  setting: a storybook miniature diorama of a pet salon with raised tubs, a wall of brushes, and a wall of rosettes from competitions nobody remembers
  endings:
    disaster: The dog leaves looking like a lamp. The client leaves looking like a critic.
    scraped: The dog is clean, the trim is angular, and the rosette goes to someone else.
    okay: The dog looks great and only one ear is a different shape.
    great: The dog wins the ribbon and the client books again for next month.
    legendary: The dog wins best in show and the judges ask which salon taught you that.
  steps:
    - title: The Dog With No Plan
      setup: The first appointment is a very large, very matted dog whose owner says the groom should be a surprise. The dog has opinions.
      scene: a miniature storybook diorama of a grooming salon with a big fluffy dog on a raised table, a wall of brushes, and a tangled comb
      pool: animals
      game: ring-match
      sprite: a pink pet brush
      choices:
        - label: Assess the coat and plan the trim
          approach: nouse
          success: You find the matting is surface-level and the dog relaxes under the comb.
          failure: You find the matting has its own plan and a stronger will.
        - label: Let the dog choose a brush
          approach: care
          success: The dog picks the soft brush and holds still for twenty whole minutes.
          failure: The dog picks the soft brush and eats it.
        - label: Start with the loudest clippers
          approach: chaos
          success: The mats fall away and the dog seems delighted by the drama.
          failure: The mats fall away, and so does the dog's patience.
    - title: The Owner's Vision
      setup: The first pass is done, the dog has been persuaded back onto the table, and the owner has returned with a mood board, three reference photos, and a strong feeling about eyebrows.
      scene: a miniature storybook diorama of a grooming salon counter with a mood board, a stack of dog magazines, and a very patient dog
      pool: creative
      game: rhythm-lane
      sprite: a polka-dot hair bow
      choices:
        - label: Translate the mood board into a trim plan
          approach: nouse
          success: The plan matches the photos and the dog's actual fur.
          failure: The plan matches the photos and not the dog, who is mostly ears.
        - label: Agree enthusiastically and adapt later
          approach: charm
          success: The owner is delighted and the dog leaves looking almost like the photo.
          failure: The owner is delighted and returns with a second mood board.
        - label: Explain that the dog has its own style
          approach: care
          success: The owner sees it your way and the dog looks magnificent.
          failure: The owner sees it your way and books a photographer to document the disagreement.
    - title: The Blow Dryer
      setup: The trim is nearly finished, and the salon's ancient blow dryer has decided today is the day it becomes a wind machine.
      scene: a miniature storybook diorama of a grooming salon with a large blow dryer, flying fur, and a dog holding on to the table
      pool: machines
      game: pop-whack
      sprite: a fluffy blow dryer
      choices:
        - label: Reduce the power and work in sections
          approach: care
          success: The coat dries evenly and the dog looks professionally fluffy.
          failure: The coat dries evenly except for one ear, which points at the ceiling.
        - label: Fix the dryer's loose hose first
          approach: nouse
          success: The hose clicks back on and the dryer behaves like a normal appliance.
          failure: The hose clicks back on and the dryer now blows in two directions.
        - label: Embrace the wind and style on the fly
          approach: chaos
          success: The fur settles into a shape that looks deliberate and slightly heroic.
          failure: The fur settles into a shape that looks like a small cloud with legs.
    - title: The Dog Show
      setup: The dog is clean, the dryer is off, and the local dog show starts in fifteen minutes with a strict no-glitter rule and a judge who has already frowned once.
      scene: a miniature storybook diorama of a village hall with a small show ring, rosettes on a table, and a very fluffy dog on a lead
      pool: stage
      game: hold-meter
      sprite: a blue show rosette ribbon
      choices:
        - label: Final brush and a quiet walk around the ring
          approach: care
          success: The dog trots beautifully and the judge's frown softens by one degree.
          failure: The dog trots beautifully and then sits down in the middle of the ring.
        - label: Coach the owner on the presentation
          approach: charm
          success: The owner presents the dog like a professional and the crowd loves it.
          failure: The owner presents the dog like a weather presenter and the crowd loves that too.
        - label: Add one tiny, forbidden sparkle
          approach: chaos
          success: The judge never sees the glitter and the dog wins the ribbon.
          failure: The judge sees the glitter and the dog wins a rule-change discussion.
