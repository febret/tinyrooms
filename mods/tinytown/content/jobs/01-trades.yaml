plumber:
  title: The Pipe Whisperer
  profession: Plumber
  tier: 1
  accent: "#4c9aa8"
  blurb: A burst pipe, a sceptical client, and one wrench with a personal grudge.
  setting: a cramped storybook bakery basement with copper pipes, mop buckets, and warm hanging bulbs
  endings:
    disaster: The basement wins. The bakery closes for the day, and the owner writes plumber? on a napkin.
    scraped: The leak is mostly fixed, the floor is mostly dry, and the invoice is mostly legible.
    okay: The sink works, the inspector signs, and only one pastry is lost to history.
    great: The bakery reopens on time. Someone names a bun after you.
    legendary: The pipes sing. The inspector takes notes for a textbook. The bakery sells out by noon.
  steps:
    - title: The S-Bend of Doom
      setup: A bakery sink has developed a pulse. The owner wants it fixed before the lunch rush.
      scene: a bakery basement with a swollen pipe, a mop bucket, and a dripping overhead bulb
      pool: machines
      game: drop-catch
      sprite: copper pipe elbow joint
      choices:
        - label: Shut the valve and trace the line
          approach: nouse
          success: You find the blocked joint in under a minute.
          failure: You shut the wrong valve and the bakery espresso machine screams.
        - label: Reassure the owner while you work
          approach: charm
          success: The owner calms down and remembers where the spare gasket lives.
          failure: The owner calms down enough to start supervising.
        - label: Hit it with the wrench and listen
          approach: chaos
          success: The pipe clears with a sound like a small dragon being polite.
          failure: The pipe answers with a fountain.
    - title: The Wrong Pipe
      setup: The pressure drops somewhere else. The basement has more pipes than the blueprint admits.
      scene: a maze of copper pipes with mismatched handwritten labels
      pool: paperwork
      game: sweep-stop
      sprite: brass valve wheel handle
      choices:
        - label: Read the old maintenance log
          approach: nouse
          success: The log reveals a hidden shut-off valve behind a poster.
          failure: The log is mostly soup.
        - label: Ask the owner for the building's history
          approach: charm
          success: She remembers the extension and the exact wall it went behind.
          failure: She remembers a feud, not a pipe.
        - label: Open the wall and trust your gut
          approach: grit
          success: Your gut finds the junction behind the plaster.
          failure: Your gut finds a wasp nest.
    - title: The Lunch Rush
      setup: The bakery opens in ten minutes. The sink is fixed. The water has other plans.
      scene: a flooded bakery kitchen with pastries balanced on high shelves
      pool: mess
      game: ring-match
      sprite: red and white life ring buoy
      choices:
        - label: Build a sandbag wall from flour sacks
          approach: grit
          success: The flour holds the water and the croissants stay dry.
          failure: The flour becomes a very expensive paste.
        - label: Reroute the drain with careful measurements
          approach: care
          success: The water takes the new path without complaint.
          failure: The new path goes through the display case.
        - label: Stage a dramatic mop solo
          approach: chaos
          success: The staff join in. The floor is dry and the audience is delighted.
          failure: You slip. The pastries do not.
    - title: The Inspector's Visit
      setup: A council inspector arrives early, clipboard first, and asks if the water is supposed to be doing that.
      scene: a bakery basement with a clipboard hanging on a hook, a triumphant copper pipe, and a puddle of clean water
      pool: people
      game: rhythm-lane
      sprite: steaming paper coffee cup
      choices:
        - label: Walk the inspector through every repair
          approach: nouse
          success: The inspector leaves with a signature and a pastry.
          failure: The inspector finds the one fitting you skipped.
        - label: Charm the inspector with fresh coffee
          approach: charm
          success: The inspection becomes a pleasant chat with a passing grade.
          failure: The inspector is lactose intolerant and immune to charm.
        - label: Turn the valve with a flourish
          approach: grit
          success: The system holds. The inspector applauds once, professionally.
          failure: The system holds for exactly as long as the flourish.

electrician:
  title: Human Fuse
  profession: Electrician
  tier: 2
  accent: "#e5b84b"
  blurb: The town hall's lights have started blinking in Morse code, and the code is rude.
  setting: a tall storybook town hall service corridor with brass light fittings, fuse boxes, and tangled cable
  endings:
    disaster: The town hall goes dark. The mayor makes a speech about it, which is worse.
    scraped: Most of the lights work. The remaining flicker has been given a name.
    okay: The lights stay on and the fuse box stops making that noise.
    great: The building glows evenly for the first time since the war. Someone cheers from a window.
    legendary: You find the one crossed wire and the whole town hall lights up like a birthday cake.
  steps:
    - title: The Blinking Fuse
      setup: Every third light in the town hall blinks at once. The caretaker says it started after the clocks changed.
      scene: a town hall corridor with brass sconces blinking in a pattern
      pool: machines
      game: sweep-stop
      sprite: small glass cartridge fuse with metal caps
      choices:
        - label: Map every circuit before touching anything
          approach: nouse
          success: You isolate the faulty ring without disturbing the chandelier.
          failure: You isolate the chandelier and half the mayor's office.
        - label: Ask the caretaker what changed
          approach: charm
          success: The caretaker remembers the storm and the exact socket.
          failure: The caretaker remembers the mayor, and would like to discuss him.
        - label: Swap the fuses one by one and watch
          approach: chaos
          success: The pattern changes into something almost like a pattern.
          failure: The corridor now blinks in two competing rhythms.
    - title: The Wall of Wires
      setup: Behind the panel is a staircase of unlabelled cables, each one warmer than the last.
      scene: a service panel with dozens of unlabelled cables and a small emergency lantern
      pool: paperwork
      game: ring-match
      sprite: coiled orange extension cable
      choices:
        - label: Trace each cable to its room
          approach: care
          success: You label the last cable just before the rating plate goes blank.
          failure: You label two cables and then realise the labels are on the wrong sides.
        - label: Call the retired electrician who built it
          approach: charm
          success: He arrives, points at one cable, and tells you a story about 1967.
          failure: He arrives, points at the wrong cable, and stays to tell the story.
        - label: Feed the panel a little power and read the sparks
          approach: chaos
          success: The sparks spell out the circuit in a way you can only describe as useful.
          failure: The panel gives you a very bright no.
    - title: The Mayor's Speech
      setup: The mayor is due to switch on the holiday lights in five minutes. The electrics have other plans.
      scene: a town hall balcony with a podium, tangled fairy lights, and one glowing fuse box
      pool: danger
      game: rhythm-lane
      sprite: yellow lightning bolt
      choices:
        - label: Bypass the broken breaker safely
          approach: care
          success: The lights come on in a warm, completely unremarkable success.
          failure: The lights come on with a small bang and a large smell.
        - label: Give the mayor a believable countdown
          approach: charm
          success: He believes you, the lights hold, and the crowd never knows.
          failure: He mishears the countdown and switches the lights on early.
        - label: Ask the crowd to help power the finale
          approach: chaos
          success: The applause does the impossible. The lights blaze.
          failure: The crowd claps in the dark, politely.
    - title: The Last Bulb
      setup: One bulb remains out. It is the only one the mayor is looking at.
      scene: a town hall balcony with a single dark bulb and rows of empty folding chairs
      pool: people
      game: pop-whack
      sprite: glowing round light bulb
      choices:
        - label: Find the break with a meter and patience
          approach: nouse
          success: The bulb lights. The crowd makes a satisfying noise.
          failure: The meter finds the break just as the mayor stops watching.
        - label: Swap in the spare and sell it
          approach: charm
          success: You swap it smoothly and tell the crowd it was a special effect.
          failure: The spare is also dead, but the story is excellent.
        - label: Hip-check the socket
          approach: grit
          success: The room floods with light and one very short knock.
          failure: The room floods with darkness and one very long silence.

mechanic:
  title: Car Whisperer
  profession: Mechanic
  tier: 2
  accent: "#c96b4b"
  blurb: A very old car has developed feelings, and the owner wants a full inspection before the parade.
  setting: a storybook garage with a tired vintage car, hanging tools, and a parade banner in the background
  endings:
    disaster: The car refuses to start. The parade goes on without it, which the car notices.
    scraped: The car starts, on the third try, and only when nobody important is watching.
    okay: The car runs well enough for the parade and only makes one dramatic noise.
    great: The car purrs around the square while the owner dabs their eyes.
    legendary: The old car leads the parade, the owner waves, and the engine sounds like a memory.
  steps:
    - title: The Grumpy Engine
      setup: The car starts, screams, and stops. The owner says it is just being dramatic.
      scene: a garage with the hood open and a vintage car that looks faintly offended
      pool: machines
      game: ring-match
      sprite: chrome spark plug
      choices:
        - label: Listen to the engine with a screwdriver
          approach: nouse
          success: You hear the loose belt and find it before it finds you.
          failure: You hear the engine and the engine hears you.
        - label: Ask the owner about the car's history
          approach: charm
          success: The owner admits the car has always hated cold mornings.
          failure: The owner tells you about a divorce, a dog, and a wedding in the back seat.
        - label: Rev it until it confesses
          approach: chaos
          success: The engine revs, backfires, and reveals the loose manifold.
          failure: The engine revs, backfires, and releases a small cloud of shrapnel.
    - title: The Missing Part
      setup: The inspection sheet lists a part nobody can find in the garage.
      scene: a garage parts counter covered in dusty boxes and one empty space
      pool: paperwork
      game: rhythm-lane
      sprite: steel gear cog
      choices:
        - label: Cross-check the parts catalogue
          approach: care
          success: You find the alternative part number hidden in the index.
          failure: The catalogue has three editions and no agreement.
        - label: Phone the old parts dealer
          approach: charm
          success: He has one in the back and will trade it for a favour.
          failure: He has one in the back and will trade it for a very long conversation.
        - label: Adapt the part from the tractor
          approach: grit
          success: The tractor part fits with a convincing clunk.
          failure: The tractor part fits, and then the tractor notices it is missing.
    - title: The Parade Route
      setup: The car is nearly ready. The parade route has one steep hill and no plan B.
      scene: a garage forecourt with the car idling and the parade route visible beyond
      pool: danger
      game: pop-whack
      sprite: orange traffic cone
      choices:
        - label: Test the brakes on the hill
          approach: nouse
          success: The brakes hold and you know exactly how hard to press.
          failure: The brakes hold, but only after a long, honest conversation.
        - label: Ask the parade marshal to flatten the route
          approach: charm
          success: The marshal moves the route around the hill with a sigh.
          failure: The marshal moves you to the back of the parade instead.
        - label: Give the engine a fighting chance and a pep talk
          approach: chaos
          success: The engine responds to encouragement in a way nobody expected.
          failure: The engine responds to encouragement by stalling.
    - title: The Big Reveal
      setup: The owner's grandchildren are waiting with a ribbon. The car has one last chance to be normal.
      scene: a sunny square with a vintage car under a ribbon, empty bunting, and a brass bandstand
      pool: stage
      game: hold-meter
      sprite: gold car key with a red ribbon bow
      choices:
        - label: Run the final inspection and tighten everything
          approach: care
          success: The car rolls forward without a single unexpected noise.
          failure: The final bolt goes in, but the horn comes on.
        - label: Hand the owner the keys with a speech
          approach: charm
          success: The speech lands. The car starts on the first turn.
          failure: The speech lands. The car starts on the third.
        - label: Jump in and drive it out yourself
          approach: grit
          success: You coast out in a perfect curve and the crowd loses its mind.
          failure: You coast out in a perfect curve and forget the handbrake.

locksmith:
  title: Ethical Locksmith
  profession: Locksmith
  tier: 1
  accent: "#8a7f5c"
  blurb: A locked cabinet, a missing key, and a client who would prefer you did not ask questions.
  setting: a narrow storybook shop cluttered with key blanks, brass tumblers, and a stubborn old cabinet
  endings:
    disaster: The cabinet stays locked. So does the conversation. So does the client.
    scraped: The lock opens, eventually, and the client takes the contents without a word.
    okay: The cabinet opens cleanly and the key is replaced before lunch.
    great: The lock clicks open on the first try, and the client admits it was a family heirloom.
    legendary: You open the cabinet, fix the lock, cut a new key, and the shop smells like success.
  steps:
    - title: The Cabinet With No Key
      setup: A client brings in a cabinet locked for twenty years. They say the key is lost. Their eyes say otherwise.
      scene: a locksmith shop counter with an old locked cabinet and a ring of blank keys
      pool: people
      game: rhythm-lane
      sprite: wax-sealed letter envelope
      choices:
        - label: Ask what the cabinet normally holds
          approach: charm
          success: The client admits it holds letters, and relaxes.
          failure: The client remembers a lawyer and stops talking.
        - label: Study the lock before touching it
          approach: nouse
          success: You identify the maker and the likely pin depth.
          failure: You identify the maker and realise the lock is a copy.
        - label: Pick it by feel in front of the client
          approach: chaos
          success: The lock opens with a satisfying click and a small bow.
          failure: The pick slips and you announce the wrong kind of success.
    - title: The Pin That Won't Sit
      setup: Three pins move beautifully. The fourth refuses to acknowledge the concept of movement.
      scene: a workbench close-up with brass lock pins and a single stubborn tumbler
      pool: machines
      game: pop-whack
      sprite: brass padlock
      choices:
        - label: Test each pin with the tension wrench
          approach: care
          success: You find the sticky pin and free it with a careful touch.
          failure: You find the sticky pin and lose the tension.
        - label: Take the lock apart and clean it
          approach: grit
          success: The lock comes apart, gives up its secrets, and goes back together.
          failure: The lock comes apart and introduces you to a new spring.
        - label: Apply a confident amount of persuasion
          approach: chaos
          success: The pin yields with a tiny, impressed click.
          failure: The pin yields by launching itself across the room.
    - title: The Client's Story
      setup: The client says the cabinet belonged to their grandmother. A second client arrives with a very similar story.
      scene: a shop front with a locked cabinet, a ring of keys on the counter, and a queue rope
      pool: people
      game: hold-meter
      sprite: antique brass cabinet handle
      choices:
        - label: Ask both clients for proof of ownership
          approach: nouse
          success: One produces a photograph, and the other leaves quickly.
          failure: Both produce photographs, and neither is convincing.
        - label: Mediate until everyone feels heard
          approach: charm
          success: They agree to open the cabinet together and split the letters.
          failure: They agree to argue in your shop for another hour.
        - label: Open the cabinet and let the contents decide
          approach: chaos
          success: The contents are clearly addressed to one client. Case closed.
          failure: The contents are addressed to neither client and mention a third.
    - title: The New Key
      setup: The cabinet is open. The client wants a key cut before the shop closes.
      scene: a key-cutting bench with brass blanks, a grinder, and the open cabinet
      pool: office
      game: drop-catch
      sprite: shiny silver key with jagged teeth
      choices:
        - label: Measure the original and cut a precise blank
          approach: care
          success: The new key turns smoothly on the first try.
          failure: The new key turns, but only in the wrong direction.
        - label: Cut two keys and let the client choose
          approach: charm
          success: Both work. The client buys the spare and tells a friend.
          failure: Neither works, but the client admires your optimism.
        - label: Cut the key with a dramatic spark shower
          approach: chaos
          success: The key is perfect and the spark shower is a local legend.
          failure: The key is perfect but the smoke alarm is not.

blacksmith:
  title: Artisanal Blacksmith
  profession: Blacksmith
  tier: 3
  accent: "#b65a3a"
  blurb: The town's ceremonial horseshoe has to be reforged before the harvest fair.
  setting: a warm storybook forge with a glowing furnace, hanging tongs, and a half-finished horse charm
  endings:
    disaster: The horseshoe snaps. The harvest fair uses a drawing instead.
    scraped: The horseshoe is crooked, but it holds, and nobody looks too closely.
    okay: The horseshoe is solid and the fair opens on time.
    great: The horseshoe shines, the mayor makes a speech, and the forge stays warm all night.
    legendary: You forge a horseshoe so fine that a farmer asks to marry it. The fair is a triumph.
  steps:
    - title: Cold Iron, Warm Welcome
      setup: The old ceremonial horseshoe is cracked. The fair starts at sunset and the forge is cold.
      scene: a storybook forge with a cold furnace and a cracked iron horseshoe on the anvil
      pool: machines
      game: pop-whack
      sprite: iron horseshoe
      choices:
        - label: Clean and inspect the old iron first
          approach: care
          success: You find the crack runs along a seam that can be saved.
          failure: You find three cracks and a suspicious hole.
        - label: Ask the fair organiser about the original
          approach: charm
          success: They produce a sketch of the original shape and a spare bar of iron.
          failure: They produce a speech about tradition and no iron.
        - label: Throw the old shoe in the furnace and improvise
          approach: chaos
          success: The old iron softens into something workable and faintly grateful.
          failure: The old iron softens into a puddle with opinions.
    - title: The Coal Problem
      setup: The furnace is hungry and the coal bin is full of stones, damp sawdust, and one actual lump of coal.
      scene: a dim forge with a coal bin, a roaring furnace, and a very small lump of coal
      pool: mess
      game: hold-meter
      sprite: lump of black coal
      choices:
        - label: Sort the bin by hand
          approach: grit
          success: You find enough coal to bring the furnace up to temperature.
          failure: You find a fossil, a spoon, and not much coal.
        - label: Barter with the carpenter for dry offcuts
          approach: charm
          success: The carpenter trades a crate of offcuts for a promise and a hinge.
          failure: The carpenter wants the hinge first, and the hinge is not made yet.
        - label: Feed the furnace a little of everything
          approach: chaos
          success: The furnace roars, changes colour, and settles into a useful heat.
          failure: The furnace produces a smell that follows you home.
    - title: The Shape of the Town
      setup: The iron is hot. The traditional horseshoe shape has one very fiddly curve.
      scene: a forge anvil with glowing iron, hammer marks, and a sketch of an ornate horseshoe
      pool: creative
      game: drop-catch
      sprite: blacksmith hammer with wooden handle
      choices:
        - label: Work the curve in small, exact heats
          approach: care
          success: The curve comes out clean and symmetrical.
          failure: The curve comes out clean, then folds somewhere it should not.
        - label: Let the apprentice call the hammer rhythm
          approach: charm
          success: The rhythm steadies your hand and the shape lands perfectly.
          failure: The rhythm is excellent, but the shape is a decorative spiral.
        - label: Give it one big theatrical strike
          approach: grit
          success: The iron rings like a bell and takes the perfect shape.
          failure: The iron rings like a bell and takes the shape of a question mark.
    - title: The Sunset Fair
      setup: The fair is at the gate. The horseshoe needs a final quench and a nail hole.
      scene: a forge doorway opening onto a sunset fair with lanterns and a ceremonial post
      pool: stage
      game: sweep-stop
      sprite: bent iron nail
      choices:
        - label: Quench, file, and fit it properly
          approach: care
          success: The horseshoe slides onto the post with a satisfying clink.
          failure: The horseshoe fits, but the nail hole is a little too honest.
        - label: Present it to the crowd with a story
          approach: charm
          success: The crowd cheers before the horseshoe is even up.
          failure: The crowd cheers and then notices the horseshoe is still in your hand.
        - label: Nail it up in one confident motion
          approach: grit
          success: The nail goes in clean and the horseshoe catches the last light.
          failure: The nail bends, the crowd gasps, and the blacksmith gods take notes.
