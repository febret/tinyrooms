chef:
  title: Rogue Food Truck Chef
  profession: Chef
  tier: 2
  accent: "#d9822b"
  blurb: The truck's famous stew has vanished, the permit is expired, and the queue outside is enormous.
  setting: a storybook miniature diorama of a food truck at a night market with a hot grill, stacked bowls, and string lights, no people, no text
  endings:
    disaster: The truck is towed at nine. The queue follows it for two blocks out of loyalty.
    scraped: The service ends with a full tip jar, an empty pot, and one very confused inspector.
    okay: The queue is fed, the paperwork is filed, and the sauce is mostly on the pavement.
    great: The truck sells out, the inspector buys a second portion, and the queue starts a chant.
    legendary: The night becomes a food festival by accident and the council asks for the recipe in triplicate.
  steps:
    - title: The Missing Signature Dish
      setup: The lunch queue starts in ten minutes. The pot that holds the famous stew is empty and still warm.
      scene: a storybook miniature diorama of a food truck interior with a cold pot, stacked bowls, and a chalkboard menu, no people, no text
      pool: food
      game: pop-whack
      sprite: a golden bowl of steaming stew
      choices:
        - label: Search the truck for the missing pot
          approach: nouse
          success: The pot is under the sink, wedged behind a crate of spoons.
          failure: The pot is under the sink, and so is the reason it is empty.
        - label: Ask the prep cook where it went
          approach: charm
          success: He remembers a courier, a signature, and a very smug van.
          failure: He remembers a courier and begins a story about his cousin.
        - label: Invent a new stew and never mention it
          approach: chaos
          success: The new stew is better and the queue never knows.
          failure: The new stew is better and the queue asks for the old one by name.
    - title: The Permit Problem
      setup: A council inspector is at the counter, holding a clipboard and a very old photograph of the truck.
      scene: a storybook miniature diorama of a food truck counter with a clipboard on the sill, a stack of forms, and a queue rope, no people, no text
      pool: paperwork
      game: hold-meter
      sprite: a rubber stamp with a wooden handle
      choices:
        - label: Find the current permit in the folder
          approach: care
          success: The permit is current, laminated, and hidden exactly where it should be.
          failure: The permit is current, laminated, and for a different truck.
        - label: Offer the inspector lunch
          approach: charm
          success: He accepts a small portion and becomes noticeably more flexible.
          failure: He accepts a small portion and asks where the missing pot went.
        - label: Argue that the queue is the permit
          approach: chaos
          success: The inspector is briefly moved by municipal poetry and signs.
          failure: The inspector calls the queue a public event and requests a second form.
    - title: The Great Sauce Spill
      setup: Someone has left the sauce vat on a slope. The slope has opinions.
      scene: a storybook miniature diorama of a market lane with an overturned vat, a bucket, and a spreading red river, no people, no text
      pool: mess
      game: drop-catch
      sprite: a ripe red tomato
      choices:
        - label: Sandbag the drain before it reaches the square
          approach: grit
          success: The sauce stops at the drain and the market keeps its shoes.
          failure: The sauce finds the drain and the drain finds the bakery.
        - label: Recruit the queue to form a bucket line
          approach: charm
          success: The queue becomes a team and someone starts a chant.
          failure: The queue becomes a team and two of them start a food truck.
        - label: Reroute the sauce into a decorative puddle
          approach: chaos
          success: The puddle looks intentional and a photographer takes a picture.
          failure: The puddle looks intentional and the photographer slips into it.
    - title: The Dinner Rush Finale
      setup: It is eight o'clock and every table in the square is full. The truck has one burner and no clean pans.
      scene: a storybook miniature diorama of a night market with a serving window, full picnic tables, and string lights, no people, no text
      pool: food
      game: sweep-stop
      sprite: a sizzling frying pan with a fried egg
      choices:
        - label: Cook one dish perfectly, slowly
          approach: care
          success: Every plate is right and the last customer waits happily.
          failure: Every plate is right until the burner decides it is a candle.
        - label: Announce a special and cook it all at once
          approach: charm
          success: The special sells out in nine minutes and the story gets bigger with every retelling.
          failure: The special sells out and nobody can agree on what it was.
        - label: Open the back door and let the crowd cook
          approach: chaos
          success: A stranger makes the best dish of the night and asks for a job.
          failure: A stranger makes the best dish of the night and asks for the truck.

farmer:
  title: Pumpkin Farmer
  profession: Farmer
  tier: 1
  accent: "#d08a2e"
  blurb: The harvest fair needs the biggest pumpkin in the county, and something has been eating the contender.
  setting: a storybook miniature diorama of a pumpkin patch with winding vines, a crooked scarecrow, and a wheelbarrow, no people, no text
  endings:
    disaster: The pumpkin collapses on the scales. The fair crowns a marrow out of pity.
    scraped: The pumpkin arrives in three pieces and one very confident wheelbarrow.
    okay: The pumpkin makes it to the fair and the badger makes it to the fence.
    great: The pumpkin wins its class and the neighbour admits the fence was a good idea.
    legendary: The pumpkin takes the county record and the badger is invited to the ceremony.
  steps:
    - title: The Contender
      setup: The seed packet said enormous. The pumpkin is enormous and also hollow on one side.
      scene: a storybook miniature diorama of a pumpkin patch with one huge pumpkin, a wheelbarrow, and a crooked scarecrow, no people, no text
      pool: outdoors
      game: hold-meter
      sprite: a small plump orange pumpkin
      choices:
        - label: Check the whole patch for damage
          approach: nouse
          success: You find the hollow and a set of small footprints leading to the hedge.
          failure: You find the hollow and a second hollow you did not expect.
        - label: Ask the neighbour what she saw
          approach: charm
          success: She saw a shape, a sack, and a very determined badger.
          failure: She saw nothing but would like to discuss the weather for an hour.
        - label: Patch it with wax and hope
          approach: chaos
          success: The wax holds and the pumpkin looks merely eccentric.
          failure: The wax holds until the pumpkin warms up and then holds nothing.
    - title: The Badger Problem
      setup: The footprints lead to a sett under the hedge, and the sett has a well-organised pantry.
      scene: a storybook miniature diorama of a hedge line at dusk with a burrow entrance, scattered seeds, and a small lantern, no people, no text
      pool: animals
      game: drop-catch
      sprite: a golden corn cob
      choices:
        - label: Build a proper fence around the patch
          approach: grit
          success: The fence goes up in an afternoon and the badger respects engineering.
          failure: The fence goes up in an afternoon and the badger respects nothing.
        - label: Negotiate with the badger
          approach: charm
          success: You leave a decoy pumpkin and the badger leaves a truce in the form of a mushroom.
          failure: You leave a decoy pumpkin and the badger leaves with the decoy and your boot.
        - label: Set up a noisy alarm
          approach: chaos
          success: The alarm scares the badger and the entire parish in one go.
          failure: The alarm scares the parish and the badger sleeps through it.
    - title: The Weigh-In
      setup: The fair's scales are older than the fair, and the rival farm has brought a pumpkin with a support frame.
      scene: a storybook miniature diorama of a fairground tent with a big brass scale, two labelled crates, and bunting, no people, no text
      pool: people
      game: sweep-stop
      sprite: a brass weighing scale
      choices:
        - label: Weigh your pumpkin fairly and accept the number
          approach: care
          success: The scales agree with your own estimate and the judge nods.
          failure: The scales disagree with themselves and the judge shrugs.
        - label: Compliment the rival's frame and ask about it
          approach: charm
          success: He admits the frame is load-bearing and the judge overhears everything.
          failure: He admits the frame is load-bearing and offers to build you one.
        - label: Weigh it twice and pick the better number
          approach: chaos
          success: The second number is bigger and the judge is too tired to argue.
          failure: The second number is smaller and the judge is suddenly very awake.
    - title: The Grand Parade
      setup: The parade starts at noon. The pumpkin needs to be loaded, secured, and possibly apologised to.
      scene: a storybook miniature diorama of a village street with a decorated cart, a giant pumpkin, and a rope barrier, no people, no text
      pool: stage
      game: ring-match
      sprite: a blue prize rosette ribbon
      choices:
        - label: Load it with ropes and a proper ramp
          approach: care
          success: The pumpkin rides like royalty and arrives intact.
          failure: The pumpkin rides like royalty until the ramp disagrees.
        - label: Let the school band lead it in
          approach: charm
          success: The band covers the wobble and the crowd loves the drama.
          failure: The band covers the wobble and the pumpkin covers the tuba.
        - label: Ride on top of it yourself
          approach: grit
          success: You ride the pumpkin into the square like a very damp monarch.
          failure: You ride the pumpkin into the square and the pumpkin rides you back.

fisher:
  title: Competitive Fisher
  profession: Fisher
  tier: 2
  accent: "#4b8fa8"
  blurb: The annual fishing contest is on, the lake is empty of fish, and everyone blames the new fountain.
  setting: a storybook miniature diorama of a wooden pier in morning mist with rods, buckets, and a still green lake, no people, no text
  endings:
    disaster: The contest is won by a duck. The trophy is awarded and the duck is unavailable for comment.
    scraped: You place third, behind a child and a very confident bucket.
    okay: You weigh in with something legal and the crowd claps politely.
    great: You take second and the rival takes the long way home.
    legendary: You land the biggest fish in county history and the fountain is renamed after you.
  steps:
    - title: The Empty Lake
      setup: The contest starts in an hour and the lake has produced one boot and a strong rumour.
      scene: a storybook miniature diorama of a wooden pier in morning mist with rods, buckets, and a still green lake, no people, no text
      pool: outdoors
      game: drop-catch
      sprite: a cartoon blue fish with a fan tail seen from the side
      choices:
        - label: Test the depth and temperature
          approach: nouse
          success: The shallows are warm and empty, and the deep channel is cold and promising.
          failure: The shallows are warm, the deep channel is warmer, and something is down there.
        - label: Ask the ferryman where the fish went
          approach: charm
          success: He points at the new fountain and says a word you will not repeat.
          failure: He points at the fountain and tells you about his knees.
        - label: Fish the fountain out of spite
          approach: chaos
          success: The fountain's basin is full of confused, excellent fish.
          failure: The fountain's basin is full of coins and one very smug duck.
    - title: The Fountain Fiasco
      setup: The fountain has been running all night and the lake has dropped a hand's width.
      scene: a storybook miniature diorama of a town fountain with a clogged nozzle, wet cobbles, and a bucket of tools, no people, no text
      pool: machines
      game: hold-meter
      sprite: a brass water tap with a droplet
      choices:
        - label: Trace the intake and clear the blockage
          approach: care
          success: A wad of leaves comes out and the lake stops draining.
          failure: A wad of leaves comes out and so does the fountain's entire personality.
        - label: Ask the council to switch it off
          approach: charm
          success: The council agrees, then holds a vote, then agrees again.
          failure: The council agrees and switches off the lake by mistake.
        - label: Redirect the fountain with a plank
          approach: grit
          success: The water arcs back into the lake and the plaza gets a rainbow.
          failure: The water arcs into the mayor's open car window.
    - title: The Rival Angler
      setup: A rival angler has a boat, a sonar device, and a very loud opinion about your bait.
      scene: a storybook miniature diorama of a jetty with two fishing spots, a small boat, and a scoreboard by the shore, no people, no text
      pool: people
      game: pop-whack
      sprite: a red and white fishing float
      choices:
        - label: Ignore him and fish your own water
          approach: grit
          success: Patience pays and the float dips just before he notices.
          failure: Patience pays off for him, loudly, from forty feet away.
        - label: Trade bait and information
          approach: charm
          success: You swap a secret and he swaps a better secret.
          failure: You swap a secret for a story about his sonar.
        - label: Cut his line with a well-aimed cast
          approach: chaos
          success: Your cast lands perfectly and his sonar reports a very confused fish.
          failure: Your cast lands perfectly, on his hat, and the judges are watching.
    - title: The Weigh-In on the Pier
      setup: The final bell is close. Your bucket is heavy, the scales are wet, and the crowd has opinions.
      scene: a storybook miniature diorama of a pier with a brass scale, a chalkboard leaderboard, and a rope crowd barrier, no people, no text
      pool: stage
      game: rhythm-lane
      sprite: a wooden fishing lure with a feather
      choices:
        - label: Weigh in calmly and accept the result
          approach: care
          success: The scale settles and your name goes to the top by a whisker.
          failure: The scale settles and your name goes to the top of the wrong column.
        - label: Give a short speech while the scale settles
          approach: charm
          success: The crowd cheers and the scale settles in your favour.
          failure: The crowd cheers and the scale settles on the rival's bucket.
        - label: Tip the bucket out and let the biggest one decide
          approach: chaos
          success: The biggest fish lands on the scale and the pier loses its mind.
          failure: The biggest fish lands in the lake and the pier loses its lunch.

beekeeper:
  title: Urban Beekeeper
  profession: Beekeeper
  tier: 2
  accent: "#c9a227"
  blurb: The rooftop hives have outgrown the roof, the neighbours have started a petition, and the queen has plans.
  setting: a storybook miniature diorama of a rooftop apiary with painted hives, a water butt, and a low brick parapet, no people, no text
  endings:
    disaster: The bees take the petition personally. The roof is closed and the honey is confiscated.
    scraped: The harvest is small, the neighbours are lukewarm, and the swarm is someone else's problem now.
    okay: The hives stay, the petition is withdrawn, and the honey is perfectly average.
    great: The rooftop honey wins a ribbon and the neighbours ask for jars.
    legendary: The building becomes famous for its honey and the queen gets a tiny ceremonial key.
  steps:
    - title: The Roof Full of Bees
      setup: The council roof has four hives, one broken railing, and a wasp problem with ambition.
      scene: a storybook miniature diorama of a rooftop apiary with painted hives, a water butt, and a low brick parapet, no people, no text
      pool: animals
      game: sweep-stop
      sprite: a woven straw beehive skep
      choices:
        - label: Inspect each hive calmly and slowly
          approach: nouse
          success: Two hives are healthy and one is merely dramatic.
          failure: Two hives are healthy and the third follows you to the stairs.
        - label: Ask the caretaker about the new neighbour
          approach: charm
          success: He mentions a beekeeper on the fourth floor with a grudge.
          failure: He mentions a beekeeper on the fourth floor and a very long feud.
        - label: Smoke the lot and sort it later
          approach: chaos
          success: The smoke calms everything, including the caretaker.
          failure: The smoke calms nothing and the stairwell fills with confused bees.
    - title: The Neighbours' Petition
      setup: A folded petition arrives under the door with forty-two signatures and one drawing of a bee in a hat.
      scene: a storybook miniature diorama of a rooftop doorway with a clipboard, a folded petition, and a row of flower pots, no people, no text
      pool: paperwork
      game: drop-catch
      sprite: a small paper scroll tied with ribbon
      choices:
        - label: Read every signature and note the concerns
          approach: care
          success: The main complaint is the flight path, which can be moved.
          failure: The main complaint is you, personally, in a hat.
        - label: Visit the neighbours with honey
          approach: charm
          success: Two signatories withdraw and one offers a spare balcony.
          failure: Two signatories withdraw and the third asks for the honey recipe.
        - label: Post a very confident notice about bees
          approach: chaos
          success: The notice is charming and half the building now wants a hive.
          failure: The notice is charming and the council wants a permit for the notice.
    - title: The Queen's Departure
      setup: Half the colony leaves in a cheerful cloud and settles on a lamp post above the school gate.
      scene: a storybook miniature diorama of a school gate with a lamp post, a dense cluster of bees, and an empty playground, no people, no text
      pool: danger
      game: hold-meter
      sprite: a metal bee smoker with a bellows
      choices:
        - label: Wait for the swarm to settle and box it
          approach: care
          success: The cluster calms and slides into the box like a well-drilled choir.
          failure: The cluster calms and then changes its mind about the box.
        - label: Ask the school to keep everyone inside
          approach: charm
          success: The head teacher clears the yard in four minutes flat.
          failure: The head teacher clears the yard and then rings the council.
        - label: Shake the lamp post and catch the swarm
          approach: grit
          success: The swarm drops into the box with a sound like applause.
          failure: The swarm drops onto your shoulders and becomes a scarf.
    - title: The Honey Harvest
      setup: The fair wants rooftop honey by Saturday and the extractor has one broken handle.
      scene: a storybook miniature diorama of a rooftop kitchen with frames of honeycomb, a hand extractor, and rows of clean jars, no people, no text
      pool: food
      game: pop-whack
      sprite: a glass honey jar with a golden lid
      choices:
        - label: Check each frame for capped honey first
          approach: nouse
          success: The capped frames go in first and the extractor runs sweet and clean.
          failure: The uncapped frames go in too and the kitchen becomes a sticky confession.
        - label: Let the neighbours help with the jars
          approach: charm
          success: The building turns out in aprons and the harvest becomes a party.
          failure: The building turns out in aprons and the labelling becomes a committee.
        - label: Spin the extractor by hand at full speed
          approach: grit
          success: The handle holds, the honey flies, and every jar is full.
          failure: The handle holds until it does not, and the kitchen becomes amber.

zookeeper:
  title: Questionable Zookeeper
  profession: Zookeeper
  tier: 3
  accent: "#7a9e6b"
  blurb: The zoo's only lion has been replaced by a very calm dog wearing a mane, and the inspectors are due.
  setting: a storybook miniature diorama of a small-town zoo with a wooden gate, painted enclosures, and a hand-drawn map board, no people, no text
  endings:
    disaster: The inspection fails, the lion is declared missing, and the dog is appointed interim director.
    scraped: The inspector leaves with notes, the dog keeps the job, and the goats keep the gate key.
    okay: The zoo passes on a technicality and the dog is officially a companion animal.
    great: The inspector recommends the zoo for a grant and the dog gets a plaque.
    legendary: The dog becomes the town mascot, the lion is never mentioned again, and attendance triples.
  steps:
    - title: The Lion Who Is Not
      setup: The morning rounds find the lion enclosure occupied by a large, calm dog in a very convincing mane.
      scene: a storybook miniature diorama of a zoo enclosure with a wooden gate, a straw bed, and a mane resting on a post, no people, no text
      pool: animals
      game: ring-match
      sprite: a plush toy dog wearing a fluffy mane
      choices:
        - label: Check the dog's collar and microchip
          approach: nouse
          success: The chip names a local family who lost a very large dog.
          failure: The chip names nobody and the collar has a tiny crown on it.
        - label: Ask the keeper where the lion went
          approach: charm
          success: He admits the lion left on Tuesday with a man and a van.
          failure: He admits the lion left on Tuesday and asks if that is a problem.
        - label: Put the dog on the payroll
          approach: chaos
          success: The dog is now staff, and the visitors love him more than the lion.
          failure: The dog is now staff and has unionised the goats.
    - title: The Paperwork of a Lion
      setup: The zoo's licence lists one lion. The enclosure lists one dog. The inspector lists an arrival time.
      scene: a storybook miniature diorama of a zoo office with a typewriter, a framed licence, and a hand-drawn enclosure map, no people, no text
      pool: paperwork
      game: sweep-stop
      sprite: a brass magnifying glass
      choices:
        - label: Amend the licence honestly
          approach: care
          success: The amendment is accepted and the dog becomes a legal resident.
          failure: The amendment is accepted and the lion is officially listed as unaccounted for.
        - label: Call the inspector and explain first
          approach: charm
          success: The inspector laughs, then stops laughing, then agrees to visit later.
          failure: The inspector laughs for a long time and puts the phone down.
        - label: Redraw the map to say canine in small letters
          approach: chaos
          success: The small letters pass and the big letters are never discussed.
          failure: The small letters are noticed and a magnifying glass is produced.
    - title: The Escape
      setup: The goats have opened the gate, the peacock is on the roof, and the dog is directing traffic.
      scene: a storybook miniature diorama of a zoo path with an open gate, scattered feed buckets, and a peacock on a roof ridge, no people, no text
      pool: danger
      game: drop-catch
      sprite: a ripe yellow banana
      choices:
        - label: Close the gate and count every animal
          approach: grit
          success: Everyone is accounted for except the peacock, who is accounted for on the roof.
          failure: Everyone is accounted for except two goats and the concept of order.
        - label: Recruit the visitors into a search line
          approach: charm
          success: The visitors love it and find the goats behind the ticket hut.
          failure: The visitors love it and three of them join the goats.
        - label: Bribe the animals with the good feed
          approach: chaos
          success: The good feed works and the stampede becomes a queue.
          failure: The good feed works and the stampede becomes a bigger stampede.
    - title: The Inspector's Tour
      setup: The inspector is at the gate with a clipboard, and the dog is wearing the mane again.
      scene: a storybook miniature diorama of a zoo entrance with a turnstile, a blank painted sign, and a dog-sized shadow, no people, no text
      pool: stage
      game: hold-meter
      sprite: a big iron zoo gate key
      choices:
        - label: Walk the route and answer every question
          approach: nouse
          success: The answers hold and the inspector runs out of questions at the reptile house.
          failure: The answers hold until the inspector asks what the lion eats.
        - label: Present the dog as a rescue success story
          approach: charm
          success: The inspector writes innovative and means it.
          failure: The inspector writes innovative and asks for the dog's vaccination record.
        - label: Let the dog do the tour himself
          approach: chaos
          success: The dog leads the inspector past every enclosure and gets a biscuit.
          failure: The dog leads the inspector to the staff fridge and sits down.
