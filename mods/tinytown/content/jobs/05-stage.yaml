wedding-singer:
  title: Wedding Singer, No Rehearsal
  profession: Wedding Singer
  tier: 2
  accent: "#c9748f"
  blurb: The band cancelled, the couple is hopeful, and the setlist is written on a napkin.
  setting: a storybook wedding marquee with fairy lights, folding chairs, and a small wooden stage
  endings:
    disaster: The first dance happens in silence. The couple is gracious about it, which is somehow worse.
    scraped: You get through the set, most of the songs, and at least one of the encores.
    okay: The wedding is lovely, the songs are recognisable, and nobody mentions the power cut.
    great: The last chorus fills the marquee and the photographer gets one perfect frame of everybody singing.
    legendary: The couple's first dance becomes a local legend, and the band that cancelled asks who played.
  steps:
    - title: The Soundcheck
      setup: The marquee is up. The microphone clicks, the speakers hum, and the groom's uncle is already requesting a song.
      scene: a storybook wedding stage with a microphone stand, coiled cables, and paper lanterns
      pool: stage
      game: ring-match
      sprite: a vintage silver microphone
      choices:
        - label: Test every cable and channel
          approach: nouse
          success: You find the dead channel before anyone is seated.
          failure: You find the dead channel and it is the one the microphone needs.
        - label: Win over the uncle early
          approach: charm
          success: He becomes your unofficial promoter and forgets the request.
          failure: He becomes your unofficial manager and remembers the request.
        - label: Skip the check and trust the room
          approach: chaos
          success: The room is kind, the feedback is brief, and the first note lands.
          failure: The first note lands and the speakers file a complaint.
    - title: The Bride's Request
      setup: The soundcheck is done, one way or another. The bride wants a song that nobody on stage has ever played.
      scene: a storybook marquee side table with a folded napkin, a glass of lemonade, and a small speaker
      pool: people
      game: sweep-stop
      sprite: a tall glass of lemonade with a straw
      choices:
        - label: Learn the chorus from her phone
          approach: nouse
          success: You get the chorus and fake the verses with confidence.
          failure: You get the chorus and the verses remain a mystery.
        - label: Ask her to sing it with you
          approach: charm
          success: She sings, the room melts, and the song becomes hers.
          failure: She sings, the room melts, and she will not stop singing.
        - label: Announce it as a surprise and improvise
          approach: chaos
          success: The improvisation is close enough that love carries it.
          failure: The improvisation is close enough that her mother notices.
    - title: The Power Cut
      setup: The first set goes well. Then the marquee lights die, the speakers sigh, and the cake table goes dark.
      scene: a storybook marquee in darkness with a single emergency light and a shadowed cake table
      pool: danger
      game: drop-catch
      sprite: a lit white candle in a brass holder
      choices:
        - label: Find the generator and reset it
          approach: nouse
          success: The power returns and the cake is still standing.
          failure: The power returns and so does the smoke machine, uninvited.
        - label: Keep singing without a microphone
          approach: grit
          success: Your voice carries, the room joins in, and the dark becomes a feature.
          failure: Your voice carries, the room joins in, and nobody notices the power coming back.
        - label: Lead everyone outside for a candlelit song
          approach: charm
          success: The lawn becomes a lantern-lit choir and the photographs are incredible.
          failure: The lawn becomes a lantern-lit choir and the caterer loses the buffet.
    - title: The First Dance
      setup: The lights are back. The couple is waiting in the middle of the floor, and the band is looking at you.
      scene: a storybook wedding dance floor with a hanging mirror ball and a small stage beyond
      pool: stage
      game: hold-meter
      sprite: a sparkling mirror ball
      choices:
        - label: Play it straight and let them dance
          approach: care
          success: The song is simple, the couple is crying, and the room is silent in the right way.
          failure: The song is simple and the couple's toddler requests a different one.
        - label: Dedicate it with a short speech
          approach: charm
          success: The speech is ninety seconds and the room is yours.
          failure: The speech is six minutes and the room is checking the buffet.
        - label: Turn it into a full floor-filler
          approach: chaos
          success: By the final chorus the entire wedding is dancing, including the caterer.
          failure: By the final chorus the entire wedding is dancing and the cake has been bumped.

actor:
  title: Community Theater Villain
  profession: Community Theater Actor
  tier: 2
  accent: "#7b3f5e"
  blurb: The panto needs a villain, the budget needs a miracle, and the mayor is playing the hero.
  setting: a storybook community theatre with red curtains, painted flats, and a costume rail
  endings:
    disaster: You are booed off stage during the curtain call. The mayor takes the bow and the blame.
    scraped: The villain is memorable, mostly for the wrong reasons, and the reviews are mercifully short.
    okay: The panto runs, the children boo on cue, and the mayor remembers most of act three.
    great: You get the biggest hiss of the night and a bouquet from a stranger in row six.
    legendary: The villain becomes the town's unofficial mascot, and the mayor asks for your autograph.
  steps:
    - title: The Read-Through
      setup: The cast has assembled in the rehearsal room. The director wants the villain read with more menace and less apology.
      scene: a storybook rehearsal room with folding chairs, a painted backdrop, and a stack of closed scripts
      pool: creative
      game: rhythm-lane
      sprite: a rolled script tied with a ribbon
      choices:
        - label: Study the script for the real motive
          approach: nouse
          success: You find the one line that makes the villain sympathetic and the room goes quiet.
          failure: You find the motive and it is a parking dispute.
        - label: Ask the director what frightens them
          approach: charm
          success: They admit it is taxes, and you build a villain around that.
          failure: They admit it is you, and the read-through gets awkward.
        - label: Go fully theatrical on the first read
          approach: chaos
          success: The room gasps, the director grins, and a prop sword falls over.
          failure: The room gasps and the director asks you to use your inside voice.
    - title: The Missing Prop
      setup: The read-through is done. On opening night, the villain's ceremonial staff is missing from the prop table.
      scene: a storybook backstage corridor with a prop table, a costume rail, and one empty stand
      pool: office
      game: ring-match
      sprite: a golden ceremonial staff with a red jewel
      choices:
        - label: Search the prop store methodically
          approach: nouse
          success: You find the staff behind a box marked for the summer show.
          failure: You find three staffs and none of them are yours.
        - label: Ask the stage manager very nicely
          approach: charm
          success: They produce it from a cupboard with the weariness of a saint.
          failure: They produce a broom and a look that says make it work.
        - label: Use the broom as a creative choice
          approach: chaos
          success: The broom becomes the most menacing staff in community theatre history.
          failure: The broom becomes the most menacing staff and then sweeps the hero.
    - title: The Heckler in Row Three
      setup: The staff problem is solved, or adjacent to solved. In act two, a heckler in row three starts correcting your villainy.
      scene: a storybook theatre auditorium with rows of red seats and a lit stage
      pool: people
      game: sweep-stop
      sprite: a ripe red tomato
      choices:
        - label: Stay in character and use the line
          approach: nouse
          success: You fold their comment into a threat and the audience loves it.
          failure: You fold it in and the heckler takes it as a cue to continue.
        - label: Break character for one charming beat
          approach: charm
          success: The house laughs with you and the heckler runs out of material.
          failure: The house laughs with you and the director does not.
        - label: Escalate the villainy until they surrender
          approach: chaos
          success: You out-heckle them so completely that they applaud.
          failure: You out-heckle them and the hero forgets their next line.
    - title: Opening Night
      setup: Act three. The mayor is waiting in the wings in a hero costume that does not fit, and the curtain is rising on the final confrontation.
      scene: a storybook theatre stage with red curtains, a painted castle flat, and a single spotlight
      pool: stage
      game: drop-catch
      sprite: a red rose tied with a ribbon
      choices:
        - label: Give the scene exactly what it needs
          approach: care
          success: The confrontation lands, the mayor remembers his lines, and the curtain call is warm.
          failure: The confrontation lands and the mayor's cape lands on the audience.
        - label: Play to the back row
          approach: charm
          success: The back row gasps, the front row laughs, and the review is kind.
          failure: The back row gasps and the front row checks their programme.
        - label: Steal the scene completely
          approach: chaos
          success: The villain gets the biggest cheer of the night, which is not how panto works.
          failure: The villain gets the biggest cheer and the mayor refuses to die on cue.

comedian:
  title: Open Mic Comedian
  profession: Comedian
  tier: 2
  accent: "#e0a13a"
  blurb: Five minutes, a brick wall, and an audience of twelve people who all know each other.
  setting: a storybook basement comedy club with a brick wall, a microphone stand, and folding chairs
  endings:
    disaster: You die on stage. Not metaphorically. The host has to do a bit about it.
    scraped: Two jokes land, three do not, and the bar staff clap out of habit.
    okay: The set is fine. The host says fine like it is a compliment and means it as a warning.
    great: You get a real laugh, then another, and the host asks you back next month.
    legendary: The closer becomes a catchphrase in town, and the scout writes your name down twice.
  steps:
    - title: The Sign-Up Sheet
      setup: The list goes up at seven. You are fourth, behind a magician, a poet, and a man with a guitar and a grievance.
      scene: a storybook club doorway with a clipboard on a stool, a paper list, and a low lamp
      pool: paperwork
      game: pop-whack
      sprite: a golden star
      choices:
        - label: Read the room and rewrite your set
          approach: nouse
          success: You cut the long bit and keep the two that fit this crowd.
          failure: You cut the good bit and keep the one about the airport.
        - label: Befriend the host before the show
          approach: charm
          success: The host bumps you later and warms the room for you.
          failure: The host bumps you later and warms the room against you.
        - label: Sign up last for the best slot
          approach: chaos
          success: You close the show and the room is yours.
          failure: You close the show and the room has already left.
    - title: The Warm-Up Room
      setup: You are on in twenty minutes. The green room is a corridor, and the magician is practising a trick that keeps failing.
      scene: a storybook backstage corridor with a mirror, a kettle, and an open magician's case
      pool: people
      game: rhythm-lane
      sprite: a snare drum with crossed sticks
      choices:
        - label: Run your set quietly in the corner
          approach: care
          success: You tighten the rhythm and find a better opening line.
          failure: You tighten the rhythm and forget the ending entirely.
        - label: Help the magician with the trick
          approach: charm
          success: You fix the trick, and he promises to warm up the crowd for you.
          failure: You fix the trick and he uses your material as his patter.
        - label: Pace the corridor and mutter
          approach: chaos
          success: The muttering becomes a bit, and the corridor audience loves it.
          failure: The muttering becomes a bit and the host thinks you are unwell.
    - title: The Heckler
      setup: The set is going well. Then a man in the second row decides he is also a comedian, and he has brought a friend.
      scene: a storybook comedy club with a brick wall, a microphone, and one empty chair pulled close
      pool: danger
      game: ring-match
      sprite: a black microphone on a stand
      choices:
        - label: Take the heckle apart politely
          approach: nouse
          success: The room turns on him and back to you, and the bit lands.
          failure: The heckle turns out to be better than your next line.
        - label: Make him part of the show
          approach: charm
          success: He becomes the best prop you have ever had.
          failure: He becomes the best prop and refuses to leave the stage.
        - label: Go completely off-script
          approach: chaos
          success: The next four minutes are strange, loud, and the funniest of your life.
          failure: The next four minutes are strange and the host is waving a napkin.
    - title: The Closer
      setup: Last bit. The room is warm, the host is watching, and there is a scout from the regional comedy festival in the back.
      scene: a storybook comedy club with a spotlight, a brick wall, and a small table of empty glasses
      pool: stage
      game: sweep-stop
      sprite: a banana peel
      choices:
        - label: Land the closer you rehearsed
          approach: care
          success: The punchline lands clean, and the scout writes something down.
          failure: The punchline lands clean and the scout writes a receipt.
        - label: End on the story about your family
          approach: charm
          success: The room goes soft and loud at once, and the host hugs you.
          failure: The room goes soft and the scout checks their phone.
        - label: Go for the biggest laugh in the building
          approach: chaos
          success: The laugh is enormous, slightly out of control, and worth it.
          failure: The laugh is enormous and comes from the bar, not the audience.

magician:
  title: Budget Magician
  profession: Magician
  tier: 2
  accent: "#5b4bb5"
  blurb: The birthday party booked a magician, the budget booked a kit, and the dove has opinions.
  setting: a storybook community hall with a folding table, a top hat, and silk scarves on a rail
  endings:
    disaster: The dove escapes, the box collapses, and the children remember it fondly for years.
    scraped: The act is short, the tricks are half-working, and the cake arrives early enough to save it.
    okay: The children are amazed, the parents are amused, and the dove is back in the cage.
    great: The finale gets a genuine gasp, and three parents ask for your card.
    legendary: The dove returns on cue, the box vanishes properly, and the birthday child declares you their best friend.
  steps:
    - title: The Kit Check
      setup: The show starts in fifteen minutes. The kit contains two rings, a marked deck, and one dove with a history.
      scene: a storybook community hall table with a top hat, linked rings, and a covered birdcage
      pool: creative
      game: hold-meter
      sprite: a black top hat
      choices:
        - label: Inventory the kit and rehearse the safe tricks
          approach: nouse
          success: You build a tight twenty minutes out of what actually works.
          failure: You build a tight twenty minutes and realise the deck is missing a card.
        - label: Charm the birthday child before the show
          approach: charm
          success: They become your assistant and take the job very seriously.
          failure: They become your assistant and reveal the trick to everyone.
        - label: Attempt the trick nobody has ever landed
          approach: chaos
          success: It lands on the first try, and you have no idea how.
          failure: It lands on the first try, and neither does the dove.
    - title: The Volunteer
      setup: The kit check is done. Now you need a volunteer from an audience of six-year-olds and one extremely keen uncle.
      scene: a storybook community hall with rows of small chairs and a folding table
      pool: people
      game: pop-whack
      sprite: a star-tipped magic wand
      choices:
        - label: Pick the calm child in the front
          approach: care
          success: They follow instructions, hold the prop, and steal the show gently.
          failure: They follow instructions and then ask a very loud question about the dove.
        - label: Pick the uncle for the comedy
          approach: charm
          success: The uncle plays along beautifully and the parents laugh.
          failure: The uncle plays along and tries to take over the whole act.
        - label: Pick nobody and do it solo
          approach: nouse
          success: The solo version is tighter, faster, and strangely impressive.
          failure: The solo version requires a second pair of hands you do not have.
    - title: The Escaping Dove
      setup: The volunteer moment is over. The dove, who has been waiting for this, leaves the cage during the silk trick.
      scene: a storybook community hall with a birdcage, scattered feathers, and a dove-shaped gap in the air
      pool: animals
      game: rhythm-lane
      sprite: a white origami dove
      choices:
        - label: Close the doors and stay calm
          approach: care
          success: The dove lands on the birthday banner and you retrieve it with dignity.
          failure: The dove lands on the birthday banner and refuses to be retrieved.
        - label: Turn it into part of the act
          approach: charm
          success: The dove circles once and returns to your hand like a professional.
          failure: The dove circles once and returns to the cake.
        - label: Chase it with the top hat
          approach: chaos
          success: The dove lands in the hat, which is the trick you will claim you planned.
          failure: The dove lands in the hat, and so does the uncle.
    - title: The Big Illusion
      setup: Finale time. The children are on the floor, the parents are filming, and the big box is held together with tape.
      scene: a storybook community hall with a painted illusion box, paper streamers, and a ring of small chairs
      pool: stage
      game: ring-match
      sprite: a set of three linked silver rings
      choices:
        - label: Do the version that cannot fail
          approach: care
          success: The simple vanish is clean, the children scream, and the dove takes a bow.
          failure: The simple vanish is clean and the dove is visibly still in the box.
        - label: Build the drama before the reveal
          approach: charm
          success: The countdown works, the box opens, and the room loses its mind.
          failure: The countdown works and the box opens a second too early.
        - label: Go for the full illusion
          approach: chaos
          success: The box collapses, the streamers fly, and somehow it is magnificent.
          failure: The box collapses, the streamers fly, and the dove leaves through the window.

clown:
  title: Rogue Clown
  profession: Clown
  tier: 1
  accent: "#e0653f"
  blurb: A birthday party, a bouncy castle, and a clown who has been asked to tone it down.
  setting: a storybook birthday hall with paper bunting, folding tables, and a tiny painted car
  endings:
    disaster: The hall is closed for repairs, the children are outside, and the bouncy castle is in a tree.
    scraped: The party survives, the clown does not quite, and everybody gets a balloon on the way out.
    okay: The birthday child laughs, the parents relax, and the tiny car starts on the second try.
    great: You leave to applause, a sealed envelope, and a request for next year.
    legendary: The grand exit is talked about at three other parties, and the tiny car is now part of local folklore.
  steps:
    - title: The Booking Mix-Up
      setup: You arrive for a six-year-old's party and discover the booking is for a funeral, in the same hall, one hour later.
      scene: a storybook hall with stacked chairs, a bundle of bunting, and a noticeboard of unreadable notes
      pool: paperwork
      game: drop-catch
      sprite: a yellow honking bike horn with a red rubber bulb
      choices:
        - label: Check the booking sheet twice
          approach: nouse
          success: You find a gap between the two events and a cupboard full of neutral decorations.
          failure: You find a gap and it is eleven minutes long.
        - label: Phone the organiser and be charming
          approach: charm
          success: She laughs, rearranges the hall, and tells you to keep the bunting.
          failure: She laughs, rearranges the hall, and books you for both events.
        - label: Decide to be tasteful for both
          approach: care
          success: You build a show that works for a child and a grandmother, and both are delighted.
          failure: You build a show that works for neither and the bunting is doing all the work.
    - title: The Balloon Animal Rebellion
      setup: The first event is underway. The balloon pump has jammed and the children have started making their own animals.
      scene: a storybook party table covered in balloon scraps, a jammed pump, and a pile of lumpy shapes
      pool: mess
      game: sweep-stop
      sprite: a twisted balloon dog
      choices:
        - label: Sort the balloons by size and salvage what you can
          approach: care
          success: You produce a recognisable dog and the children are briefly impressed.
          failure: You produce a recognisable dog and a child produces a better one.
        - label: Judge the children's creations seriously
          approach: charm
          success: The judging becomes the best part of the party and nobody misses the dog.
          failure: The judging becomes a formal inquiry with appeals.
        - label: Inflate the biggest balloon by mouth
          approach: chaos
          success: The balloon is enormous, the children are awed, and it lasts the whole party.
          failure: The balloon is enormous and it lasts exactly one more second.
    - title: The Birthday Party
      setup: The party is at its peak. A parent asks you to tone it down, and the birthday child asks you to tone it up.
      scene: a storybook party hall with a bouncy castle, a cake table, and paper hats
      pool: people
      game: ring-match
      sprite: a slice of birthday cake with a candle
      choices:
        - label: Split the difference with a quieter game
          approach: care
          success: The game is calm, inclusive, and over before anything breaks.
          failure: The game is calm and the birthday child quietly leaves it.
        - label: Make the parent your co-star
          approach: charm
          success: The parent joins in, the child is delighted, and the tone is perfect.
          failure: The parent joins in and immediately becomes the loudest person in the hall.
        - label: Go bigger, but politely
          approach: chaos
          success: The finale is huge, joyful, and somehow within the rules.
          failure: The finale is huge and the bouncy castle is now involved.
    - title: The Grand Exit
      setup: The party is ending. Your tiny car is parked behind the hall, the funeral is arriving, and everyone is watching.
      scene: a storybook hall doorway with a tiny painted car, stacked chairs, and a row of parked bicycles
      pool: stage
      game: rhythm-lane
      sprite: a tiny painted clown car
      choices:
        - label: Pack up quietly and leave the hall spotless
          approach: care
          success: You leave without a sound and the organiser finds a thank-you note.
          failure: You leave without a sound and forget the shoes.
        - label: Do one last gag for the departing children
          approach: charm
          success: The gag is small, sweet, and exactly the right length.
          failure: The gag is small and a child follows you to the car.
        - label: Drive out with a comic flourish
          approach: chaos
          success: The car backfires, the children cheer, and the funeral guests smile despite themselves.
          failure: The car backfires and the funeral guests do not.
