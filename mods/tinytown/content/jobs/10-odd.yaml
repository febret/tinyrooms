florist:
  title: Dramatic Florist
  profession: Florist
  tier: 1
  accent: "#c2607f"
  blurb: The mayor's wedding needs flowers by noon, and the roses have started unionising.
  setting: a storybook miniature diorama of a cramped florist shop packed with buckets of enormous blooms, curling ribbon, and a wilting display
  endings:
    disaster: The wedding goes ahead with a single fern and a very sincere apology. The fern gets more press than you.
    scraped: The flowers arrive on time, slightly sideways, and the photographer works around the buckets.
    okay: The altar looks like the catalogue, the bride is pleased, and the bees keep their distance.
    great: The bride cries in the good way and the wedding planner asks for your card.
    legendary: The bouquet is mentioned in the vows, the bees return for an encore, and the council names a roundabout after you.
  steps:
    - title: The Order of the Day
      setup: A wedding order for two hundred stems has arrived with no colour scheme, no budget, and a note that says make it memorable.
      scene: a florist workbench with heaps of loose stems, ribbon spools, and an enormous curling order docket
      pool: creative
      game: rhythm-lane
      sprite: a long-stemmed pink rose
      choices:
        - label: Sort every stem by freshness first
          approach: care
          success: The good blooms go to the front and the tired ones get a second life in the posies.
          failure: You sort by freshness and discover most of the delivery is technically compost.
        - label: Charm the wedding planner into a colour scheme
          approach: charm
          success: She picks peach and cream, and suddenly the whole shop makes sense.
          failure: She picks a colour that does not exist and expects you to source it.
        - label: Build one bouquet and hope it speaks for itself
          approach: chaos
          success: The bouquet is strange and gorgeous, and the planner gasps.
          failure: The bouquet is strange, and the planner makes a small, wounded sound.
    - title: The Cooler Has Opinions
      setup: At eleven the cooler cuts out, which is the exact hour the roses decide they would rather be potpourri.
      scene: a walk-in flower cooler with fogged glass, drooping roses, and frost creeping up the door
      pool: machines
      game: ring-match
      sprite: a frosty blue snowflake crystal
      choices:
        - label: Find the fault in the cooler's wiring
          approach: nouse
          success: You reset the compressor and the roses perk up like they heard gossip.
          failure: You reset the compressor and the shop lights go out instead.
        - label: Haul ice from the fishmonger
          approach: grit
          success: The cooler drops ten degrees and only smells faintly of the sea.
          failure: The cooler drops ten degrees and now the roses smell like a harbour.
        - label: Fan the blooms with a spare programme
          approach: chaos
          success: The breeze keeps them alive and the planner thinks it is a ritual.
          failure: The breeze distributes petals across three postcodes.
    - title: The Bees Have RSVP'd
      setup: The church lilies are loaded in the van, and a very organised swarm has claimed them as a venue.
      scene: a churchyard with a flower van, lilies in crates, and a dense cloud of bees near the porch
      pool: animals
      game: sweep-stop
      sprite: a chubby cartoon bumblebee
      choices:
        - label: Move the lilies slowly and calmly
          approach: care
          success: The bees let the crates pass, one at a time, with visible suspicion.
          failure: The bees let one crate pass and keep the other eleven.
        - label: Radio the beekeeper for a professional opinion
          approach: charm
          success: The beekeeper arrives in a veil and treats the whole thing as a favour.
          failure: The beekeeper arrives, takes one look, and asks for a written apology from the church.
        - label: Offer the swarm a decoy bouquet and run
          approach: chaos
          success: The swarm follows the decoy and the lilies reach the altar untouched.
          failure: The swarm follows the decoy, and so does the bride.
    - title: The Altar Reveal
      setup: The arch is up, the aisle is dressed, and the groom's aunt has just leaned on the one unsupported corner.
      scene: a candlelit church altar with a leaning flower arch, scattered petals, and a very calm donation box
      pool: stage
      game: drop-catch
      sprite: a white lily bloom
      choices:
        - label: Rebuild the arch with hidden wire
          approach: nouse
          success: The arch stands straight and nobody can see the wire or your hands shaking.
          failure: The arch stands straight until the first hymn.
        - label: Turn the collapse into a design statement
          approach: charm
          success: You call it an intimate cascade, and the guests nod as if they knew.
          failure: You call it an intimate cascade, and the vicar asks you to leave the flowers alone.
        - label: Hold the arch up through the whole ceremony
          approach: grit
          success: You hold it for forty minutes and the photos look effortless.
          failure: You hold it for forty minutes and the photos show a florist in every frame.

astronomer:
  title: Planetarium Hypeman
  profession: Astronomer
  tier: 2
  accent: "#4a63b0"
  blurb: The planetarium's new show opens in an hour, and the projector has stage fright.
  setting: a storybook miniature diorama of a domed planetarium with a brass star projector, velvet seats, and a snack counter glowing in the dark
  endings:
    disaster: The dome stays dark and the schoolchildren learn about clouds instead. The mayor calls it atmospheric.
    scraped: The show runs, the stars are mostly in the right places, and nobody notices the ceiling fan.
    okay: The children leave happy, the projector survives, and one of them asks a genuinely good question.
    great: The mayor calls the sky well organised and the retired astronomer in row three stops correcting you.
    legendary: The show sells out for a month and a child writes you a letter about the rings of Saturn.
  steps:
    - title: The Dome Is Dark
      setup: The projector lamps are cold, the seats are full of schoolchildren, and the mayor has promised them a sky.
      scene: a dark planetarium dome with a silent brass projector and rows of empty velvet seats
      pool: machines
      game: pop-whack
      sprite: a glowing yellow five-pointed star
      choices:
        - label: Recalibrate the brass projector
          approach: nouse
          success: Stars bloom across the dome in perfect, orderly constellations.
          failure: You project the southern sky over the northern seats and a teacher sighs.
        - label: Warm up the crowd with a story
          approach: charm
          success: The children are enchanted before the lights even dim.
          failure: The children decide you are a wizard and demand a demonstration.
        - label: Drag the spare projector up from the basement
          approach: grit
          success: The spare works, and the stairs survive the journey.
          failure: The spare works, and the stairs do not.
    - title: The Live Feed
      setup: The feed is meant to show a meteor shower, but the screen is showing a car park with great confidence.
      scene: a control desk with several flickering monitors showing an empty night car park
      pool: paperwork
      game: rhythm-lane
      sprite: a small brass telescope on a wooden tripod
      choices:
        - label: Read the observatory contract closely
          approach: nouse
          success: You find the clause that lets you use the archive footage and the show is saved.
          failure: You find three clauses, two loopholes, and a fee.
        - label: Phone the observatory director
          approach: charm
          success: She laughs, fixes the feed, and gives you a better camera angle.
          failure: She laughs, fixes the feed, and now the car park has commentary.
        - label: Narrate the car park as a comet
          approach: chaos
          success: The audience believes it, and the car park becomes briefly majestic.
          failure: A child points out that comets do not have parking bays.
    - title: The Pigeon Orbit
      setup: A pigeon has entered the dome and is circling the projector, while the rotation motor grinds like it is reading a complaint.
      scene: a planetarium dome with a pigeon silhouette, a jammed rotation motor, and a gantry ladder
      pool: danger
      game: ring-match
      sprite: a ringed planet like saturn
      choices:
        - label: Climb the gantry and free the motor
          approach: grit
          success: The dome turns again and the pigeon adjusts its orbit politely.
          failure: The dome turns, the gantry does not, and you hold on to both.
        - label: Coax the pigeon out with trail mix
          approach: care
          success: The pigeon walks out under its own steam and takes the trail mix as payment.
          failure: The pigeon brings friends and they all want seats.
        - label: Add the pigeon to the show
          approach: chaos
          success: You name it after a moon and the audience applauds every pass.
          failure: You name it after a moon and it lands on the projector.
    - title: The Finale
      setup: The lights dim for the grand finale, and the projector makes a sound that is either dramatic or terminal.
      scene: a planetarium control booth with a smoking projector and a dome full of empty seats
      pool: stage
      game: sweep-stop
      sprite: a brass telescope
      choices:
        - label: Switch to the hand-cranked backup
          approach: nouse
          success: The crank turns, the stars return, and your arm becomes briefly famous.
          failure: The crank turns, the stars return upside down, and nobody complains.
        - label: Narrate the darkness as the birth of the universe
          approach: charm
          success: The silence becomes part of the show and the applause lasts a full minute.
          failure: The silence becomes part of the show and a child asks when it ends.
        - label: Hold the lamp housing together with both hands
          approach: grit
          success: The stars hold steady until the last note and the dome erupts.
          failure: The stars hold steady, the housing does not, and the finale is very bright.

astronaut:
  title: Mall Space Program Astronaut
  profession: Astronaut
  tier: 3
  accent: "#5b8aa6"
  blurb: The mall's space program has one rocket, one launch window, and a food court full of witnesses.
  setting: a storybook miniature diorama of a shopping mall atrium turned launch site, with a cardboard and chrome rocket, potted palms, and an escalator gantry
  endings:
    disaster: The rocket becomes a very expensive fountain in the food court. The mall puts up a plaque about it.
    scraped: You get six feet off the ground, which the mall counts as space and the insurance form disputes.
    okay: The rocket clears the skylight, comes down in the car park, and the pretzel stand survives.
    great: You orbit the mall twice and land beside the pretzel stand to applause.
    legendary: They name a wing after you and the food court reopens in low orbit, still doing two for one.
  steps:
    - title: Pre-Flight Checks
      setup: The rocket is built from shelving units, a smoothie machine, and confidence. The countdown clock is already at ten minutes.
      scene: a mall atrium with a homemade rocket on a pallet and an escalator wrapped in hazard tape
      pool: machines
      game: hold-meter
      sprite: a chrome rocket with cardboard fins
      choices:
        - label: Run the pre-flight checklist twice
          approach: nouse
          success: Every bolt reports for duty and the checklist comes back almost clean.
          failure: The checklist belongs to a different rocket and the different rocket is not here.
        - label: Climb the gantry and tighten everything
          approach: grit
          success: The rattling stops and the rocket feels briefly trustworthy.
          failure: You tighten a bolt that was load-bearing on purpose.
        - label: Bribe the countdown clock with a smoothie
          approach: chaos
          success: The clock agrees to a ten-minute extension and a flavour upgrade.
          failure: The clock starts counting backwards faster out of spite.
    - title: The Fuel Line
      setup: The fuel line runs straight into the food court smoothie dispenser, which is currently serving mango.
      scene: a food court with a fuel hose running from a smoothie machine to a rocket nozzle
      pool: food
      game: pop-whack
      sprite: a mango smoothie cup with a straw
      choices:
        - label: Reroute the line away from the pretzels
          approach: nouse
          success: Pressure stabilises at a respectable wobble and the pretzels stay plain.
          failure: The line feeds the pretzel stand and the queue gets very enthusiastic.
        - label: Negotiate with the food court manager
          approach: charm
          success: She lends you the machine, a cup holder, and her best straws.
          failure: She charges the space program mall rent and wants it in pretzels.
        - label: Taste the fuel to identify the mix
          approach: chaos
          success: It is mostly mango, entirely flammable, and weirdly refreshing.
          failure: You see the launch window in a new dimension and lose eleven minutes.
    - title: The Escalator Gantry
      setup: The launch pad is the escalator, the countdown is livestreamed, and a group of teenagers has climbed aboard the rocket.
      scene: a stopped escalator crowded with folding chairs, camera stands, and an open rocket hatch
      pool: danger
      game: rhythm-lane
      sprite: a salted soft pretzel
      choices:
        - label: Evacuate the food court calmly
          approach: care
          success: Everyone moves with their trays and the atrium clears in ninety seconds.
          failure: Everyone moves with their trays, straight into the rocket.
        - label: Restart the escalator gantry by hand
          approach: grit
          success: The gantry climbs, groaning, and the rocket clears the palm trees.
          failure: It climbs briefly, then remembers it is an escalator.
        - label: Announce a surprise sale at the far end
          approach: chaos
          success: The crowd stampedes away and the launch pad is suddenly empty.
          failure: The crowd stampedes toward the rocket and finds good seats.
    - title: The Launch Window
      setup: The skylight is open, the camera is live, and the countdown has reached the part where everyone looks at you.
      scene: a mall atrium under an open skylight with a rocket on a smoking pallet and empty rope barriers
      pool: stage
      game: ring-match
      sprite: a round glass space helmet
      choices:
        - label: Compute the exact thrust for the skylight
          approach: nouse
          success: The numbers are beautiful and the rocket slips through with a foot to spare.
          failure: The numbers are beautiful and the skylight is not where the numbers said.
        - label: Give the crowd a speech worth applauding
          approach: charm
          success: The applause vibrates the rocket loose and the launch looks deliberate.
          failure: The applause is so good the manager makes a speech too, and his is longer.
        - label: Light the fuse and hold on
          approach: grit
          success: You clear the skylight and take a small, tasteful piece of it with you.
          failure: You clear the skylight and take the whole skylight with you.

toy-maker:
  title: Toy Maker
  profession: Toy Maker
  tier: 1
  accent: "#d9943f"
  blurb: The toy fair needs one hundred wooden ducks by Saturday, and the paint has opinions.
  setting: a storybook miniature diorama of a cluttered toy workshop with rows of wooden ducks, paint pots, and a clockwork train on a bench
  endings:
    disaster: The fair opens with a pile of unpainted wood and a hand-lettered promise. The ducks arrive on Monday.
    scraped: Ninety ducks quack, ten squeak, and the paint is dry on all the ones that matter.
    okay: The fair sells out of ducks, the paint is dry, and only one child asks about the eyes.
    great: A child carries a duck home like a trophy and the workshop gets a waiting list.
    legendary: The ducks are declared the town mascot, the mayor buys two, and the clockwork train gets its own parade.
  steps:
    - title: One Hundred Ducks
      setup: The order is for one hundred ducks by Saturday. The wood is stacked, the paint is open, and the workshop clock is already lying about the time.
      scene: a toy workshop bench with raw wooden ducks, paint tins, and a mountain of sawdust
      pool: creative
      game: drop-catch
      sprite: a wooden toy duck painted yellow
      choices:
        - label: Sand and prime every duck first
          approach: care
          success: The paint grips properly and the first fifty ducks look almost professional.
          failure: You sand one duck into a smaller, sadder duck and cannot find the original shape.
        - label: Rebuild the drying schedule around the clock
          approach: nouse
          success: The schedule fits, with room for lunch and one small nap.
          failure: The schedule fits only if nobody sleeps and the clock keeps lying.
        - label: Speed-dry the first batch with a hairdryer
          approach: chaos
          success: They dry in minutes and come out warm, glossy, and faintly surprised.
          failure: One duck's beak droops into a moustache and the others look impressed.
    - title: The Clockwork Line
      setup: The little clockwork train that carries ducks between benches has jammed, and it is carrying a great many ducks.
      scene: a toy workshop with a stalled clockwork train, scattered ducks, and exposed brass gears
      pool: machines
      game: sweep-stop
      sprite: a brass cog gear
      choices:
        - label: Open the gearbox and clear the jam
          approach: nouse
          success: The train runs smooth and quiet, and the ducks resume their journey.
          failure: The train runs smooth and backwards, returning yesterday's ducks.
        - label: Push the line by hand until it gives
          approach: grit
          success: You out-pace the motor and feel briefly immortal.
          failure: The line wins and your shoulder files a formal complaint.
        - label: Have the apprentice sing the gears into rhythm
          approach: charm
          success: The gears find the beat and the whole workshop starts humming.
          failure: The gears find a different, much worse beat and keep it all afternoon.
    - title: The Eyes Have It
      setup: The stencil slipped, and one hundred ducks now share the same intense, judgemental stare.
      scene: a paint bench covered in rows of identical wooden ducks with stern painted eyes
      pool: creative
      game: ring-match
      sprite: a paint pot with a brush
      choices:
        - label: Repaint each eye by hand
          approach: care
          success: By duck forty they look kindly, and by duck eighty they look loved.
          failure: By duck forty they look worse, and by duck eighty you look tired.
        - label: Convince the judge it is a design movement
          approach: charm
          success: They call it Artisanal Intensity and ask for a statement.
          failure: They call it a cry for help and take a great many notes.
        - label: Lean in and paint eyebrows on all of them
          approach: chaos
          success: The ducks become a beloved local controversy and sell twice as fast.
          failure: The ducks become a beloved local controversy and the council gets involved.
    - title: The Toy Fair
      setup: The fair opens in an hour, the display is up, and the mayor's daughter has decided she wants the one duck still missing an eye.
      scene: a fairground hall with a tall duck display, bunting, and a table of finished toys
      pool: stage
      game: rhythm-lane
      sprite: a little wooden toy train engine
      choices:
        - label: Rebuild the display with hidden supports
          approach: nouse
          success: It holds through the ribbon cutting and one enthusiastic elbow.
          failure: It holds until the mayor leans on it for a photograph.
        - label: Give the unfinished duck a name and a backstory
          approach: charm
          success: The duck becomes the hit of the fair and the child is delighted.
          failure: The child wants a sadder backstory and a second duck to match.
        - label: Carry the whole display in yourself
          approach: grit
          success: You balance one hundred ducks and the crowd gasps at the sheer nerve.
          failure: You balance ninety-nine ducks and the crowd counts out loud.

referee:
  title: Extremely Biased Referee
  profession: Referee
  tier: 2
  accent: "#b5423c"
  blurb: The town derby needs a referee, and you have been issued a whistle, a rulebook, and a strong personal opinion.
  setting: a storybook miniature diorama of a municipal football pitch with crooked goalposts, chalk lines, a small grandstand, and a scoreboard that disagrees with itself
  endings:
    disaster: The derby ends in a draw, two formal protests, and a new town holiday nobody wanted.
    scraped: The match finishes, the score is disputed, and the whistle turns up in a pie.
    okay: Both teams shake hands, the scoreboard agrees with the score, and the pigeons leave.
    great: The crowd carries you off the pitch, which is technically a foul.
    legendary: Your decision is taught in referee school, the pigeons get a statue, and the derby is renamed after you.
  steps:
    - title: The Kick-Off
      setup: The pitch has been marked by someone with a strong sense of geometry, and both teams are waiting for a whistle that is not in your pocket.
      scene: a chalked football pitch with crooked goalposts and two sets of empty benches in the distance
      pool: people
      game: sweep-stop
      sprite: a red penalty card
      choices:
        - label: Re-measure the pitch with the groundskeeper's tape
          approach: nouse
          success: The lines are straight and the goalposts are almost the same size.
          failure: The lines are straight and the pitch is now a very tidy triangle.
        - label: Give both teams a rousing pre-match speech
          approach: charm
          success: Both teams cheer together, briefly and suspiciously united.
          failure: Both teams cheer, then remember exactly why they are here.
        - label: Start the match early and sort it out later
          approach: chaos
          success: The confusion produces the fastest goal in derby history.
          failure: The confusion produces a goal for a team that is not playing.
    - title: The Team Sheet
      setup: The official sheet lists the same striker twice, once with a middle name and once without, and he is warming up in both shirts.
      scene: a referee's changing room with a bench, boots, and a long match sheet on the table
      pool: paperwork
      game: ring-match
      sprite: a muddy football boot
      choices:
        - label: Cross-check the sheet against the squad
          approach: nouse
          success: You catch the duplicate before kick-off and the striker chooses a name.
          failure: You catch the duplicate after he has scored twice.
        - label: Let the captain explain the situation
          approach: charm
          success: The explanation is charming and legally nonsense, and everyone accepts it.
          failure: The explanation is charming, legally binding, and now there are two strikers.
        - label: Refuse to start until it is fixed
          approach: grit
          success: The fix takes four minutes and the crowd respects the stand.
          failure: The fix takes forty minutes and the crowd starts a chant about your family.
    - title: The Pigeon Defence
      setup: The visiting keeper has company. Six pigeons have settled on the crossbar and one is standing in the goal mouth like it has a contract.
      scene: a football goal with pigeons lined up on the crossbar and a scuffed ball on the line
      pool: animals
      game: rhythm-lane
      sprite: a black and white football
      choices:
        - label: Herd the pigeons gently off the pitch
          approach: care
          success: They leave in an orderly, deeply offended queue.
          failure: They settle on the crossbar and refuse to discuss it further.
        - label: Announce the pigeons as the new mascots
          approach: charm
          success: The crowd loves it and the pigeons play along for once.
          failure: The pigeons become the most popular team on the pitch.
        - label: Serve them an early halftime snack
          approach: chaos
          success: They leave for the food stand and the goal is clear.
          failure: They leave for the food stand and bring back friends.
    - title: The Final Whistle
      setup: Injury time, a penalty, and a crowd that has already decided what happened. You have to be impartial for one entire minute.
      scene: a football penalty spot with a ball, an empty grandstand, and a faded scoreboard
      pool: stage
      game: pop-whack
      sprite: a shiny silver referee whistle
      choices:
        - label: Check the rulebook before the kick
          approach: nouse
          success: The rule is clear, your decision is correct, and the crowd grudgingly agrees.
          failure: The rule is clear and the crowd has genuinely never heard of it.
        - label: Call it and sell it to the stands
          approach: charm
          success: The crowd agrees because you said it with your whole chest.
          failure: The crowd disagrees because you said it with your whole chest.
        - label: Award the penalty and turn your back
          approach: grit
          success: The kick goes in and the town talks about it for years.
          failure: The kick misses and the town blames your back for a decade.
