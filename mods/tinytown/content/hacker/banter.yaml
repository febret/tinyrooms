lines:
  - event: greet
    text: "I brought snacks. Well. I brought one snack."
  - event: greet
    text: "I've seen this movie. We should not split up."
  - event: greet
    text: "Okay. Deep breath. Let's steal some maths."
    traits: [energetic]
  - event: greet
    text: "I read the manual on the way over. There is no manual."
    traits: [bookish]
  - event: correct
    text: "Clean hit. The firewall didn't even flinch."
  - event: correct
    text: "Nice. That one was all you."
  - event: correct
    text: "Ha! Take that, arithmetic."
    traits: [energetic]
  - event: correct
    text: "That lines up. I checked it twice."
    traits: [bookish]
  - event: wrong
    text: "Almost. Back up one digit and look again."
  - event: wrong
    text: "The terminal says no. The terminal is rude."
  - event: wrong
    text: "Wrong path, but the lights are still on."
  - event: streak
    text: "Three in a row! I'm putting that on the fridge."
  - event: streak
    text: "You're making this look easy. Suspiciously easy."
  - event: timeout
    text: "Time's up. Fresh set, same rules."
  - event: timeout
    text: "The timer ate that one. Shake it off."
  - event: lowtime
    text: "Ten minutes left. I can hear the cooling fans."
  - event: lowtime
    text: "Five minutes. Let's aim for the door, not the gold."
  - event: nodewin
    text: "Node's ours. Onward."
  - event: nodewin
    text: "One less light on their map."
  - event: nodewin
    text: "I'm naming this node after you."
    traits: [artsy]
  - event: nodelose
    text: "They kicked us out. We go again."
  - event: nodelose
    text: "That firewall is smug. I hate it."
  - event: central
    text: "That's the core. Whatever you do, don't tell them it was easy."
  - event: central
    text: "We're in. Grab the good stuff."
  - event: drain
    text: "I'm running on fumes. You might have to carry this one."
  - event: drain
    text: "Give me a second. My brain is buffering."
    traits: [grumpy]
  - event: tip
    text: "Big numbers? Split the bottom one into tens and ones."
  - event: tip
    text: "Line the digits up by place value before you add."
  - event: tip
    text: "For subtraction, count up from the smaller number."
  - event: tip
    text: "Doubles are your friends. Build from a fact you know."
  - event: tip
    text: "Round first, multiply second, then check the size."
  - event: tip
    text: "Each area-model cell is one small rectangle."
  - event: tip
    text: "Check a product by adding the partial products back."
  - event: tip
    text: "Say the place value out loud before you type a digit."
