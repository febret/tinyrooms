<!doctype html>
<html lang="en" class="full-height">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>The Art Market</title>
    <link rel="stylesheet" href="/activities/shared.css">
    <link rel="stylesheet" href="./art-store.css">
  </head>
  <body>
    <main class="shell viewport-column art-shell">
      <header class="art-top">
        <div>
          <p class="art-kicker">Floors, frames, and a little nerve</p>
          <h1 class="heading">The Art Market</h1>
          <p class="art-room" id="room-label">Finding your room…</p>
        </div>
        <div class="art-top-actions">
          <div class="art-wallet" aria-live="polite"><span aria-hidden="true">◎</span><strong id="wallet">—</strong><span>Bops</span></div>
          <button type="button" class="quiet small" id="back">Back to TinyTown</button>
        </div>
      </header>

      <p class="connection" id="connection" role="status">Waiting for Tinyrooms…</p>
      <nav class="art-tabs" id="tabs" role="tablist" aria-label="Art Market sections">
        <button type="button" role="tab" data-tab="floors" aria-selected="true">Floor finishes</button>
        <button type="button" role="tab" data-tab="art" aria-selected="false">Wall art</button>
      </nav>

      <section class="art-panel" id="floors-panel" role="tabpanel" aria-label="Floor finishes">
        <p class="art-hint">One finish per room. Buy once, reapply whenever the mood changes.</p>
        <div class="art-grid art-floors" id="floor-grid" role="list"></div>
      </section>

      <section class="art-panel" id="art-panel" role="tabpanel" aria-label="Wall art" hidden>
        <p class="art-hint">Every piece hangs on a real whiteboard in your home, so you can move it, resize it, or draw over it later.</p>
        <p class="art-capacity" id="capacity"></p>
        <div class="art-grid" id="art-grid" role="list"></div>
      </section>
    </main>
    <script src="/activities/shared.js"></script>
    <script type="module" src="./art-store.js"></script>
  </body>
</html>
