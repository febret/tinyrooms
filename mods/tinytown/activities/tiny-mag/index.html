<!doctype html>
<html lang="en" class="full-height">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Tiny Mag · The Pocket Town Review</title>
    <link rel="preload" href="../shared-fonts/fonts/bodoni-moda-latin.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="preload" href="../shared-fonts/fonts/newsreader-latin.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="stylesheet" href="/activities/shared.css">
    <link rel="stylesheet" href="../shared-fonts/fonts.css">
    <link rel="stylesheet" href="./tiny-mag.css">
    <link rel="stylesheet" href="./tiny-mag-editorial.css">
  </head>
  <body class="mag-body">
    <main class="mag-shell" id="mag-shell">
      <p class="connection" id="connection" role="status">Waiting for Tinyrooms...</p>
      <div class="mag-stage">
        <div class="mag-frame" id="book-frame">
          <div class="mag-book" id="book" aria-live="polite">
            <span class="mag-spine" aria-hidden="true"></span>
            <section class="mag-page mag-page-left" id="page-left" aria-label="Left page"></section>
            <section class="mag-page mag-page-right" id="page-right" aria-label="Right page"></section>
            <div class="turn-leaf" id="turn-leaf" aria-hidden="true"></div>
          </div>
        </div>
        <button type="button" class="mag-turn prev" id="prev" aria-label="Previous page">‹</button>
        <button type="button" class="mag-turn next" id="next" aria-label="Next page">›</button>
      </div>
      <nav class="mag-dock" aria-label="Magazine sections">
        <div class="mag-folio" id="folio">01 / 09</div>
        <div class="mag-rail" id="rail"></div>
        <div class="mag-wallet"><span aria-hidden="true">◎</span> <strong id="wallet">—</strong></div>
      </nav>
    </main>
    <dialog class="mag-dialog" id="home-dialog" aria-labelledby="home-dialog-title">
      <div class="mag-dialog-card">
        <p class="eyebrow">The classified desk</p>
        <h2 id="home-dialog-title">Choose a home</h2>
        <p class="dialog-dek" id="home-dialog-copy"></p>
        <p class="eyebrow">Open households</p>
        <div class="home-choices" id="home-choices"></div>
        <div class="dialog-actions">
          <button type="button" class="mag-btn quiet" data-action="close-home">Not this week</button>
        </div>
      </div>
    </dialog>
    <script src="/activities/shared.js"></script>
    <script type="module" src="./tiny-mag.js"></script>
  </body>
</html>
