<!doctype html>
<html lang="en" class="full-height">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>The Job Board</title>
    <link rel="stylesheet" href="/activities/shared.css">
    <link rel="stylesheet" href="./heist-board.css">
  </head>
  <body>
    <main class="shell viewport-column board-shell">
      <p class="connection" id="connection" role="status">Waiting for Tinyrooms…</p>
      <div class="heading">
        <h1>The Job Board</h1>
        <p class="badge" id="heat-badge">Heat 0</p>
      </div>
      <nav class="board-tabs" aria-label="Job board sections">
        <button type="button" data-tab="jobs" aria-selected="true">Jobs</button>
        <button type="button" data-tab="crew" aria-selected="false">Crew</button>
        <button type="button" data-tab="loadout" aria-selected="false">Loadout</button>
        <button type="button" data-tab="bots" aria-selected="false">Bots</button>
      </nav>
      <section class="paper board-panel" id="panel" aria-live="polite"></section>
      <p class="smallprint muted" id="hint">Start a job from the hideout, then enter the bank together.</p>
    </main>
    <script src="/activities/shared.js"></script>
    <script type="module" src="./heist-board.js"></script>
  </body>
</html>
