    heat_tier: 0
    guard_count: 2
    security_budget: 3
    deposit: 3
    rewards: {bops: 25, kudos: 2}
    time_limit_seconds: 420
    target_rooms: [bank-lobby, bank-offices, bank-security, bank-vault, bank-alley, bank-roof]
    entry_room: bank-lobby
    vault_room: bank-vault
    escape_rooms: [bank-alley, bank-roof]
    guard_pool: [guard-ledger, guard-marble]
    reinforcement_pool: []
    camera_count: 2
    laser_count: 0
    loot_count: 3
    objectives:
    - {id: ghost-run, kind: ghost, label: 'Leave without raising the alarm'}
    - {id: speedrun, kind: speed, seconds: 360, label: 'Finish within six minutes'}
    routes:
      guard-ledger:
        room: bank-lobby
        speed: 7.0
        pause_seconds: 2.0
        vision_range: 32.0
        vision_cone: 75.0
        waypoints: [[30, 52], [50, 52], [70, 52], [70, 36], [50, 36], [30, 36]]
