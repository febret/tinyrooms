<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 200" preserveAspectRatio="none" role="img" aria-label="Classroom corridor wall">
  <defs>
    <linearGradient id="wallUpper" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fdf3cd"/>
      <stop offset="0.5" stop-color="#f6e4a8"/>
      <stop offset="1" stop-color="#ecd48c"/>
    </linearGradient>
    <linearGradient id="wallWain" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#35579f"/>
      <stop offset="1" stop-color="#223d7a"/>
    </linearGradient>
    <linearGradient id="wallRail" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.6"/>
      <stop offset="0.5" stop-color="#ead58c"/>
      <stop offset="1" stop-color="#c6a854"/>
    </linearGradient>
    <linearGradient id="wallAO" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#000000" stop-opacity="0.10"/>
      <stop offset="0.14" stop-color="#000000" stop-opacity="0"/>
      <stop offset="0.72" stop-color="#000000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0.20"/>
    </linearGradient>
    <filter id="wallGrain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.75" numOctaves="2" seed="11" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.07" intercept="0"/></feComponentTransfer>
    </filter>
  </defs>
  <rect width="120" height="200" fill="url(#wallUpper)"/>
  <rect y="118" width="120" height="82" fill="url(#wallWain)"/>
  <g stroke="#1b3166" stroke-width="1.5" opacity="0.55">
    <path d="M12 118V200M24 118V200M36 118V200M48 118V200M60 118V200M72 118V200M84 118V200M96 118V200M108 118V200"/>
  </g>
  <g stroke="#4a6cb5" stroke-width="1" opacity="0.5">
    <path d="M13.6 118V200M25.6 118V200M37.6 118V200M49.6 118V200M61.6 118V200M73.6 118V200M85.6 118V200M97.6 118V200M109.6 118V200"/>
  </g>
  <rect y="112" width="120" height="9" fill="url(#wallRail)"/>
  <rect y="120.5" width="120" height="2.5" fill="#00000033"/>
  <rect y="192" width="120" height="8" fill="#f4e6c8"/>
  <rect y="192" width="120" height="8" fill="url(#wallRail)" opacity="0.45"/>
  <rect y="192" width="120" height="1.6" fill="#ffffff88"/>
  <rect y="198.6" width="120" height="1.4" fill="#00000044"/>
  <rect width="120" height="200" fill="url(#wallAO)"/>
  <rect width="120" height="200" filter="url(#wallGrain)"/>
