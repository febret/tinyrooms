<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 160" role="img" aria-label="Two-panel door">
  <defs>
    <g id="twoTop">
      <rect x="1" y="1" width="62" height="50" rx="2" fill="#00000033"/>
      <rect x="-1" y="-1" width="62" height="50" rx="2" fill="#ffffff3d"/>
      <rect x="0" y="0" width="62" height="50" rx="2" fill="#00000016"/>
      <rect x="1" y="1" width="60" height="48" rx="1.5" fill="none" stroke="#ffffff30" stroke-width="1.2"/>
    </g>
    <g id="twoBottom">
      <rect x="1" y="1" width="62" height="62" rx="2" fill="#00000033"/>
      <rect x="-1" y="-1" width="62" height="62" rx="2" fill="#ffffff3d"/>
      <rect x="0" y="0" width="62" height="62" rx="2" fill="#00000016"/>
      <rect x="1" y="1" width="60" height="60" rx="1.5" fill="none" stroke="#ffffff30" stroke-width="1.2"/>
    </g>
  </defs>
  <use href="#twoTop" transform="translate(18,18)"/>
  <use href="#twoBottom" transform="translate(18,78)"/>
</svg>
