<svg xmlns="http://www.w3.org/2000/svg" width="220" height="220" viewBox="0 0 220 220">
  <defs>
    <filter id="journal-grain" x="0" y="0" width="220" height="220" filterUnits="userSpaceOnUse" primitiveUnits="userSpaceOnUse">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="3" seed="17" stitchTiles="stitch"/>
      <feColorMatrix type="matrix" values="0 0 0 0 0.34  0 0 0 0 0.26  0 0 0 0 0.16  0 0 0 0.09 0"/>
    </filter>
    <filter id="journal-fibers" x="0" y="0" width="220" height="220" filterUnits="userSpaceOnUse" primitiveUnits="userSpaceOnUse">
      <feTurbulence type="turbulence" baseFrequency="0.012 0.32" numOctaves="2" seed="4" stitchTiles="stitch"/>
      <feColorMatrix type="matrix" values="0 0 0 0 0.4  0 0 0 0 0.3  0 0 0 0 0.18  0 0 0 0.05 0"/>
    </filter>
  </defs>
  <rect width="220" height="220" filter="url(#journal-fibers)"/>
  <rect width="220" height="220" filter="url(#journal-grain)"/>
</svg>
