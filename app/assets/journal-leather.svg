<svg xmlns="http://www.w3.org/2000/svg" width="160" height="160" viewBox="0 0 160 160">
  <defs>
    <filter id="journal-leather-grain" x="0" y="0" width="160" height="160" filterUnits="userSpaceOnUse" primitiveUnits="userSpaceOnUse">
      <feTurbulence type="fractalNoise" baseFrequency="0.04 0.05" numOctaves="4" seed="9" stitchTiles="stitch"/>
      <feColorMatrix type="matrix" values="0 0 0 0 0.16  0 0 0 0 0.09  0 0 0 0 0.05  0 0 0 0.55 0"/>
    </filter>
    <filter id="journal-leather-pores" x="0" y="0" width="160" height="160" filterUnits="userSpaceOnUse" primitiveUnits="userSpaceOnUse">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="3" stitchTiles="stitch"/>
      <feColorMatrix type="matrix" values="0 0 0 0 0.05  0 0 0 0 0.03  0 0 0 0 0.02  0 0 0 0.25 0"/>
    </filter>
  </defs>
  <rect width="160" height="160" fill="#2a1810"/>
  <rect width="160" height="160" filter="url(#journal-leather-grain)"/>
  <rect width="160" height="160" filter="url(#journal-leather-pores)"/>
</svg>
