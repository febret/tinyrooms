ballet-shoes:
  label: Ballet Shoes
  description: Ribbon-tied shoes with an alarming amount of confidence. Charisma +1 and Fanciness +2 while equipped.
  image: ballet-shoes-art.webp
  type: item
  rarity: Common
  stack_limit: 1
  one_use: false
  passive: true
  bonuses: {charisma: 1, fanciness: 2}
fancy-wallet:
  label: Fancy Wallet
  description: A tiny golden clasp that implies a tiny golden fortune. It contains lint and one expired coupon.
  image: fancy-wallet-art.webp
  decorative: true
hand-light:
  label: Flashlight
  description: Use in a dark room to light it for 1 minute. Reusable; the batteries are powered by spite.
  image: hand-light-art.webp
  type: item
  stack_limit: 10
  one_use: false
  energy_cost: 0
  target: room
  effect: light
  duration: 60
  sounds:
    select: click2.wav
    use: switch.wav
juicy-drink:
  label: Juicy Drink
  description: Restore 25 Energy, even when Tired. Tastes like fruit that has seen things. Free to use on yourself.
  image: juicy-drink-art.webp
  type: item
  stack_limit: 10
  one_use: true
  energy_cost: 0
  target: self
  effect: energy
  amount: 25
  sounds:
    select: bubble1.wav
    use: bubble1.wav
plastic-bag:
  label: Plastic Bag
  description: A plastic bag. Load-bearing, emotionally unavailable, and technically a hat if you are desperate enough.
  image: pastic-bag-art.webp
  stack_limit: 10
poop-in-a-bag:
  label: Poop in a Bag
  description: A neat little parcel of consequences. Equip it, then drag it onto the garden trashcan or Use it on the bin. The bin knows what it did.
  image: poop-in-bag-art.webp
  stack_limit: 10
  one_use: true
  energy_cost: 0
  target: prop
teleporter-instruction-manual:
  label: Teleporter Instruction Manual
  description: A pristine manual rescued from a garden bin. It explains destination alignment, return coordinates, and why you should keep your elbows inside the portal. Save it for a future quest; the future is already judging you.
  image: teleporter-instruction-manual-art.webp
  type: item
  rarity: Uncommon
  stack_limit: 1
  one_use: false
  decorative: true
  quest: true
poop:
  label: Poop
  description: A piece of poop. Holding it is a messy business; putting it in your pocket is a whole personality.
  image: poop-art.webp
  stack_limit: 10
  soils: true
pooper-scooper:
  label: Pooper Scooper
  description: Equip it, then use it on Molly's litter tray. With a plastic bag equipped, the mess gets bagged. Without one, you become part of the problem.
  image: pooper-scooper-art.webp
  one_use: false
  energy_cost: 0
  target: prop
  tags: [scoop]
  consume_card: plastic-bag
  sounds:
    select: click2.wav
    use: swish.wav
seal-plushie:
  label: Seal Plushie
  description: A cute seal plushie. Smells faintly of justice and absolutely nothing else.
  image: seal-plushie-art.webp
  decorative: true
tasty-toast:
  label: Tasty Toast
  description: Restore 10 Health to yourself or another peep. Costs 2 Energy. Toast is just bread that finally got its act together.
  image: tasty-toast-art.webp
  stack_limit: 10
  one_use: true
  energy_cost: 2
  target: peep
  effect: health
  amount: 10
  sounds:
    select: click2.wav
    use: crunch1.wav
tomato-sauce:
  label: Tomato Sauce
  description: Restore 25 Health to yourself or another peep. Costs 2 Energy. Somewhere, a tomato is insufferably proud.
  image: tomato-sauce-art.webp
  stack_limit: 10
  one_use: true
  energy_cost: 2
  target: peep
  effect: health
  amount: 25

house-key:
  label: House Key
  description: A brass sunflower key. Opens the front door in the foyer. It has never once been where you left it.
  image: house-key-art.webp
  type: item
  rarity: Common
  stack_limit: 1
  one_use: false
  quest: true
  target: prop
  sounds:
    select: tick.wav
    use: open-metal.wav
vacuum-cleaner:
  label: Vacuum Cleaner
  description: A cheerful little vacuum with a taste for centipedes. Equip it, then use it on the basement bugs. Reusable, unbothered, faintly smug.
  image: vacuum-cleaner-art.webp
  type: item
  rarity: Common
  stack_limit: 1
  one_use: false
  energy_cost: 0
  quest: true
  target: prop
  tags: [vacuum]
  cutscene: centipede-vacuum
  sounds:
    select: click2.wav
    use: mech2.wav

# Cutscene emote: playing it broadcasts a scripted cutscene to the room.
victory-dance:
  label: Victory Dance
  description: A triumphant full-screen strut. Plays for the whole room. Some call it confidence; the neighbors call it a noise complaint.
  image: victory-dance.png
  type: emote
  cutscene: victory-dance
  rarity: Uncommon
  energy_cost: 5
  sounds:
    select: drum1.wav
    use: applause.wav
