house-tour:
  title: A Tour of the Little House
  description: Meet Pip, find the utility room, and make it out to the garden.
  scope: personal
  revision: 1
  memory_tags:
  - house-tour
  memory: I finished the tour of the little house.
  reward:
    kudos: 2
    cards:
    - seal-plushie
  sounds:
    started: task-notify.wav
    completed: applause.wav
    notification: beep1.wav
  steps:
  - step_id: enter-foyer
    trigger: enter_room
    match:
      room_id: foyer
    title: Step through the dollhouse into the foyer
    memory_tag: tour-start
    memory: I stepped through the dollhouse into the foyer.
  - step_id: meet-pip
    trigger: dialog_action
    match:
      peep_id: caretaker
    title: Ask Pip how to begin
    memory_tag: met-pip
    memory: I asked Pip how to begin.
  - step_id: find-utility
    trigger: enter_room
    match:
      room_id: utility
    title: Find the utility room
    memory: I found the utility room.
  - step_id: reach-garden
    trigger: enter_room
    match:
      room_id: garden
    title: Make it out to the garden
    memory_tag: outside
    memory: I made it out to the garden.
