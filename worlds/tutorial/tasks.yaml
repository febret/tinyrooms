house-tour:
  title: A Tour of the Little House
  description: Meet Pip, find the utility room, and escape to the garden before the
    house decides you live here now.
  scope: personal
  revision: 1
  memory_tags:
  - house-tour
  memory: I finished the tour of the little house. The house finished its opinion
    of me.
  reward:
    kudos: 2
    cards:
    - seal-plushie
  sounds:
    started: task-notify.wav
    completed: applause.wav
    notification: beep1.wav
  steps:
  - step_id: enter-foyer
    trigger: enter_room
    match:
      room_id: foyer
    title: Get swallowed by the dollhouse and land in the foyer
    memory_tag: tour-start
    memory: I stepped through the dollhouse into the foyer. It made a noise I choose
      not to think about.
  - step_id: meet-pip
    trigger: dialog_action
    match:
      peep_id: caretaker
    title: Make Pip explain the house before it explains you
    memory_tag: met-pip
    memory: I asked Pip how to begin. He answered with far too much enthusiasm.
  - step_id: find-utility
    trigger: enter_room
    match:
      room_id: utility
    title: Find the utility room, where the tools are kept prisoner
    memory: I found the utility room. The vacuum looked back.
  - step_id: reach-garden
    trigger: enter_room
    match:
      room_id: garden
    title: Escape to the garden before the house claims squatter's rights
    memory_tag: outside
    memory: I made it out to the garden. Outside smells like freedom and one very
      suspicious trashcan.
