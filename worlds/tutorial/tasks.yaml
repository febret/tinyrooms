house-tour:
  title: A Tour of the House
  description: Find the utility room, settle the chores, and escape to the garden
    before the house decides you live here now.
  scope: personal
  revision: 1
  memory_tags:
  - house-tour
  memory: I finished the house tour. The house finished its assessment of me.
  reward:
    kudos: 2
    cards:
    - seal-plushie
  sounds:
    started: task-notify.wav
    completed: applause.wav
    notification: beep1.wav
  steps:
  - step_id: enter-foyer
    trigger: enter_room
    match:
      room_id: foyer
    title: Get swallowed by the dollhouse and land in the foyer
    memory_tag: tour-start
    memory: I stepped through the dollhouse into the foyer. It made a noise I choose
      not to think about.
  - step_id: find-utility
    trigger: enter_room
    match:
      room_id: utility
    title: Find the utility room, where the tools are kept prisoner
    memory: I found the utility room. The vacuum looked back.
  - step_id: bag-poop
    trigger: signal
    match:
      event: poop_bagged
    title: Bag Molly's mess with the pooper scooper and a plastic bag
    memory_tag: bagged-poop
    memory: I bagged up Molly's mess. It is my responsibility now, and it is in a
      bag.
  - step_id: find-key
    trigger: signal
    match:
      event: key_taken
    title: Steal the house key from the basement cabinet
    memory_tag: got-key
    memory: I pocketed the brass sunflower key. It was warm, which I choose not to
      think about.
  - step_id: reach-garden
    trigger: enter_room
    match:
      room_id: garden
    title: Escape to the garden before the house claims squatter's rights
    memory_tag: outside
    memory: I made it out to the garden. Outside smells like freedom and one very
      suspicious trashcan.
