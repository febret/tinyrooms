hub:
  label: The Hub
  description: A sunlit pocket plaza with a dollhouse that is either adorable or a
    trap. The brochure refuses to clarify.
  board_type: basic
  board_image: hub.jpg
  board_image_style: stretch
  palette:
  - '#ebcfaa'
  - '#b97262'
  - '#6faea4'
  editor:
