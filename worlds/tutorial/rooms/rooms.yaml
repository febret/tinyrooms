playroom:
  label: The Playroom
  description: Molly keeps watch over a dollhouse. Pet, chat, or play a round of Lazor Rush.
  board_type: basic
  board_image: playroom.png
  board_image_style: tile
  palette: ["#e4d5b5", "#de958a", "#88ada9"]
  editor: {environment: [palette, board_image_style]}
  props:
    dollhouse0:
      prop: dollhouse
      pos: [55, 32, 0]
      rot: [0, 0, 0]
      scale: 1.1
      content: [fancy-wallet, ballet-shoes]
      cooldown: 600
      behavior: dispenser
      actions: [["Enter", ".go exit0"], ["Search", ".dispense dollhouse0"]]
    story-shelf: {prop: bookshelf, pos: [14, 22, 0], scale: 1}
    flower-rug: {prop: rug, pos: [58, 72, 0], scale: 1}
    play-arcade: {prop: arcade-cabinet, pos: [86, 30, 0], scale: 1}
    play-beanbag: {prop: neon-beanbag, pos: [82, 60, 0], rot: [0, -20, 0], scale: 1}
    play-egg-chair: {prop: teal-egg-chair, pos: [20, 50, 0], rot: [0, 30, 0], scale: 1}
    play-armchair: {prop: mustard-armchair, pos: [18, 76, 0], rot: [0, -25, 0], scale: 1}
    play-records: {prop: record-cabinet, pos: [36, 20, 0], scale: 1}
    play-toys: {prop: kori-basket, pos: [44, 86, 0], scale: 1}
    play-cactus: {prop: cactus-trio, pos: [36, 50, 0], scale: 1}
    play-lamp: {prop: mushroom-table-lamp, pos: [66, 48, 0], scale: 1}
