hub:
  label: The Hub
  description: A sunlit pocket plaza. Cross the glowing portal to begin.
  board_type: basic
  board_image: hub.jpg
  board_image_style: stretch
  palette: ["#ebcfaa", "#b97262", "#6faea4"]
  props:
    portal0: {prop: portal, pos: [26, 42, 0], rot: [0, 0, 0], scale: 1.1, actions: [["Go across", ".go exit0"]]}
    vending0: {prop: vending, pos: [77, 36, 0], rot: [0, -0.15, 0], scale: 1, behavior: shop, activity: shop, actions: [["Browse packs", ".shop"]]}
    welcome-plant: {prop: plant, pos: [13, 70, 0], scale: 0.8}
  exits:
    exit0: {label: Cross the portal, target: playroom}
playroom:
  label: The Playroom
  description: Molly keeps watch over a dollhouse. Pet, chat, or play a round of Lazor Rush.
  board_type: basic
  board_image: playroom.png
  board_image_style: tile
  palette: ["#e4d5b5", "#de958a", "#88ada9"]
  props:
    dollhouse0:
      prop: dollhouse
      pos: [53, 36, 0]
      rot: [0, 0, 0]
      scale: 1.25
      content: [fancy-wallet, ballet-shoes]
      cooldown: 600
      behavior: dispenser
      actions: [["Enter", ".go exit0"], ["Search", ".dispense dollhouse0"]]
    story-shelf: {prop: bookshelf, pos: [16, 26, 0], scale: 0.85}
    flower-rug: {prop: rug, pos: [60, 73, 0], scale: 1.4}
  cards:
    - {card: fancy-wallet, quantity: 1, pos: [42, 68, 0]}
  exits:
    exit0: {label: Enter the dollhouse, target: foyer}
    hub: {label: Back through the portal, target: hub}
foyer:
  label: Sunflower Foyer
  description: Welcome home. The kitchen is left, the sitting room right; the front door needs a key.
  board_type: basic
  board_image: foyer.png
  board_image_style: stretch
  palette: ["#efdbaf", "#81aa94", "#ce7958"]
  props:
    front-door0: {prop: locked-front-door, pos: [51, 16, 0], scale: 1, behavior: locked-door, actions: [["Unlock front door", ".unlock"]]}
    upstairs0: {prop: stairs, pos: [83, 38, 0], scale: 0.95, actions: [["Up to bedroom", ".go bedroom"]]}
    foyer-picture: {prop: framed-picture, pos: [18, 22, 0], scale: 0.8}
    foyer-rug: {prop: rug, pos: [47, 61, 0], scale: 1.5}
  exits:
    playroom: {label: Out of the dollhouse, target: playroom}
    kitchen: {label: Into the kitchen, target: kitchen}
    living: {label: Into the sitting room, target: living-room}
    bedroom: {label: Upstairs to bedroom, target: bedroom}
    garden: {label: Open the front door, target: garden, locked: true, requires: house-key}
kitchen:
  label: The Buttercup Kitchen
  description: A bright tiled kitchen. Take useful cards from Room View; the utility room is just behind it.
  board_type: basic
  board_image: kitchen.png
  board_image_style: stretch
  palette: ["#eee6c9", "#efb65d", "#789f96"]
  props:
    breakfast0: {prop: kitchen-counter, pos: [45, 22, 0], scale: 1.3}
    kitchen-plant: {prop: plant, pos: [83, 33, 0], scale: 0.75}
    workbench0: {prop: craft-workbench, pos: [25, 69, 0], scale: 1, behavior: crafting, activity: crafting, recipes: [bagged-poop], actions: [["Craft", ".play crafting"], ["Crafting help", ".look workbench0"]]}
  cards:
    - {card: tasty-toast, quantity: 2, pos: [59, 56, 0]}
    - {card: tomato-sauce, quantity: 1, pos: [70, 66, 0]}
  exits:
    foyer: {label: Back to the foyer, target: foyer}
    utility: {label: Through to the utility room, target: utility}
    living: {label: Through the arch to the sitting room, target: living-room}
bathroom:
  label: The Mint Bathroom
  description: Warm water, mint tiles, and Molly's litter tray. A shower restores Cleanliness.
  board_type: basic
  board_image: bathroom.png
  board_image_style: stretch
  palette: ["#c9e0d1", "#f6edcf", "#cf8a91"]
  props:
    shower0: {prop: shower, pos: [27, 27, 0], scale: 1.1, behavior: shower, actions: [["Take a shower", ".shower"]]}
    litter0: {prop: litter-tray, pos: [73, 62, 0], scale: 1.15, behavior: litter, actions: [["Clean litter tray", ".clean"]]}
    fern0: {prop: plant, pos: [78, 22, 0], scale: 0.8}
  exits:
    utility: {label: Back to the utility room, target: utility}
    bedroom: {label: Into the bedroom, target: bedroom}
living-room:
  label: Marmalade Sitting Room
  description: A place to trade stories. Try Emotes, pin a peep, or add a friend.
  board_type: basic
  board_image: living-room.png
  board_image_style: stretch
  palette: ["#d8af82", "#cb7764", "#6d9698"]
  props:
    sofa0: {prop: sofa, pos: [48, 28, 0], scale: 1.3}
    reading-lamp: {prop: lamp, pos: [80, 30, 0], scale: 1}
    books0: {prop: bookshelf, pos: [16, 27, 0], scale: 1}
    sitting-rug: {prop: rug, pos: [52, 64, 0], scale: 1.7}
  cards:
    - {card: wave, quantity: 1, pos: [27, 70, 0]}
    - {card: heart, quantity: 1, pos: [78, 73, 0]}
  exits:
    foyer: {label: Back to the foyer, target: foyer}
    kitchen: {label: Into the kitchen, target: kitchen}
bedroom:
  label: The Patchwork Bedroom
  description: A quiet upstairs room. Finish the house tasks to earn room-editing permission.
  board_type: basic
  board_image: bedroom.png
  board_image_style: stretch
  palette: ["#b7c8cd", "#edc6a0", "#c48a9b"]
  props:
    bed0: {prop: bed, pos: [36, 31, 0], scale: 1.3}
    bedside-lamp: {prop: lamp, pos: [72, 28, 0], scale: 0.85}
    bedroom-picture: {prop: framed-picture, pos: [79, 60, 0], scale: 0.9}
    quilt-rug: {prop: rug, pos: [35, 73, 0], scale: 1.15}
  cards:
    - {card: seal-plushie, quantity: 1, pos: [62, 64, 0]}
  exits:
    foyer: {label: Downstairs to the foyer, target: foyer}
    bathroom: {label: Into the bathroom, target: bathroom}
utility:
  label: The Helpful Utility
  description: No luck required. Collect your personal tools here before tackling the house chores.
  board_type: basic
  board_image: utility.png
  board_image_style: stretch
  palette: ["#e1cfac", "#88a59e", "#d49062"]
  props:
    supplies0:
      prop: supply-shelf
      pos: [24, 25, 0]
      scale: 1.1
      behavior: supplies
      content: [pooper-scooper, plastic-bag, plastic-bag, hand-light, hand-light, juicy-drink]
      personal: true
      actions: [["Collect supplies", ".supplies"]]
    vacuum0: {prop: vacuum-stand, pos: [72, 29, 0], scale: 1, behavior: vacuum, actions: [["Borrow vacuum", ".take-vacuum"]]}
    cellar-stairs: {prop: stairs, pos: [76, 70, 0], scale: 0.9, actions: [["Down to basement", ".go basement"]]}
  exits:
    kitchen: {label: Back to the kitchen, target: kitchen}
    bathroom: {label: Into the bathroom, target: bathroom}
    basement: {label: Down to the basement, target: basement}
basement:
  label: The Blue-Hour Basement
  description: Too dark to see the props. Equip a Hand Light in Inventory, then Use it; it lasts thirty minutes.
  board_type: basic
  board_image: basement.png
  board_image_style: stretch
  palette: ["#627681", "#d5b57f", "#708e87"]
  dark: true
  props:
    key0: {prop: keys-cabinet, pos: [28, 24, 0], scale: 1.1, behavior: key, actions: [["Take spare key", ".take-key"]]}
    bugs0: {prop: centipedes, pos: [64, 62, 0], scale: 1.25, behavior: centipedes, actions: [["Vacuum centipedes", ".vacuum"]]}
    basement-shelf: {prop: bookshelf, pos: [77, 24, 0], scale: 0.9}
  exits:
    utility: {label: Back upstairs, target: utility}
garden:
  label: The Pocket Garden
  description: You made it outside! Check your Journal, share an emote, and make the bedroom your own.
  board_type: basic
  board_image: garden.png
  board_image_style: stretch
  palette: ["#9eb783", "#eed19c", "#d78584"]
  props:
    garden-plant0: {prop: plant, pos: [23, 24, 0], scale: 1.3}
    garden-plant1: {prop: plant, pos: [80, 65, 0], scale: 1.5}
    garden-bench: {prop: sofa, pos: [65, 24, 0], scale: 1.1}
  cards:
    - {card: happy-dance, quantity: 1, pos: [41, 54, 0]}
    - {card: starlight, quantity: 1, pos: [60, 70, 0]}
    - {card: spirited, quantity: 1, pos: [29, 73, 0]}
  exits:
    foyer: {label: Back inside, target: foyer}
