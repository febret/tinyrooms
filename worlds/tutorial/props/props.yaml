# Prop definitions.
# scale: base model scale from model units into world units. The room instance
#        `scale` in rooms.yaml multiplies this value.
# CONFIG: reserved key for file-wide settings (never loaded as a prop).
#         `scale_adjust` multiplies every prop's `scale` in this file.
#         Example:
#         CONFIG:
#           scale_adjust: 1.0
CONFIG:
  scale_adjust: 2.0
portal:
