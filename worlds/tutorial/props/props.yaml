CONFIG:
  scale_adjust: 2
portal:
  label: A Glowing Portal
  description: A familiar doorway shimmering with possibilities. Somebody definitely
    forgot to read the safety card.
  model: portal.glb
  decorative: false
  animation: auto
  scale: 0.347
  effects:
    idle:
    - smoke
    - ember-glow
    active:
    - sparks
  active_effect: idle
  sounds:
    select: computer2.wav
    action: door-open-old.wav
dollhouse:
  label: Dollhouse
  description: A whole home in miniature. Search once every ten minutes, or step right
    inside and become emotionally responsible for it.
  model: dollhouse.glb
  decorative: false
  cast_shadow: false
  effects:
    idle:
    - galaxy-float
  active_effect: idle
shower:
  label: Sunflower Shower
  description: A warm shower washes away grime and restores Cleanliness. It will not
    wash away the choices that led you here.
  model: shower.glb
  decorative: false
  behavior: shower
  default_actions:
  - - Take a shower
    - .act shower @self
  scale: 1.801
  sounds:
    select: water1.wav
    action: water1.wav
litter-tray:
  label: Molly's Litter Tray
  description: A thankless chore with outsized consequences. Equip a pooper scooper,
    then use it here. Bring a plastic bag, unless you enjoy carrying evidence.
  model: litter-tray.glb
  decorative: false
  behavior: litter-tray
  scale: 0.699
locked-front-door:
  label: The Front Door
  description: The way out of the house. The key is in the dark basement, once the
    centipedes are gone. The door is not locked; it is simply disappointed in you.
  model: locked-front-door.glb
  decorative: false
  scale: 1.774
  sounds:
    select: click3.wav
    action: door-close.wav
keys-cabinet:
  label: Spare Key Cabinet
  description: A brass key hangs on the sunflower hook, but only once the centipedes
    are gone. The hook is judging your chore speed.
  model: keys-cabinet.glb
  decorative: false
  behavior: key
  default_actions:
  - - Take the key
    - .act take_key @self
  scale: 1.501
  sounds:
    select: tick.wav
    action: open-metal.wav
centipedes:
  label: House Centipedes
  description: A committee of legs, none of which pay rent. Borrow the utility-room
    vacuum and use it here to clear them out.
  model: centipedes.glb
  decorative: false
  behavior: centipedes
  scale: 1.207
  requires_light: true
  sounds:
    select: hiss.wav
    action: hiss.wav
vacuum-stand:
  label: Vacuum Corner
  description: A trusty wheeled vacuum with a suspiciously confident filter. Takes
    one missing tool at a time; give the dispenser a minute to recharge.
  model: vacuum-stand.glb
  decorative: false
  behavior: dispenser
  content:
  - vacuum-cleaner
  - hand-light
  cooldown: 60
  default_actions:
  - - Take tools
    - .dispense @self
  scale: 1.099
  sounds:
    select: click3.wav
    action: mech1.wav
supply-shelf:
  label: Helpful Supplies
  description: A recharging dispenser of housekeeping tools. Gives you whichever missing
    supply you actually need, then sulks for a minute.
  model: supply-shelf.glb
  decorative: false
  behavior: dispenser
  content:
  - pooper-scooper
  - plastic-bag
  cooldown: 60
  default_actions:
  - - Take supplies
    - .dispense @self
  scale: 1.553
  sounds:
    select: click2.wav
    action: draw.wav
kitchen-counter:
  label: Breakfast Counter
  description: A gingham runner, warm toast, and a kettle that has seen enough mornings
    to be smug about it. Supermarket ingredients can be prepped here.
  model: kitchen-counter.glb
  decorative: false
  behavior: crafting
  one_per_room: true
  default_actions:
  - - Craft at the counter
    - .craft @self
    - true
  scale: 1.056
  tags:
  - crafting
  - kitchen
  - prep-table
  - table
sofa:
  label: Marmalade Sofa
  description: Soft corduroy, striped cushions, and room for a friend. Also room for
    crumbs, which are not friends.
  model: sofa.glb
  decorative: true
  scale: 1.801
bed:
  label: Patchwork Bed
  description: A quilt stitched from the colors of the house and the remnants of your
    last good decision.
  model: bed.glb
  decorative: true
  scale: 1.9
plant:
  label: Monstera
  description: Glossy leaves, a wonky terracotta pot, and one new shoot that is absolutely
    plotting something.
  model: quaternius_cc0-cactus-775.glb
  decorative: true
  scale: 0.495
bookshelf:
  label: Story Shelf
  description: Hand-bound books and a dollhouse keepsake. The books are arranged by
    vibes, not author.
  model: bookshelf.glb
  decorative: true
  scale: 1.5
  effects: {}
framed-picture:
  label: A Sunny Picture
  description: A hand-painted sun over a low blue hill. It is either art or a threat
    with good lighting.
  model: framed-picture.glb
  decorative: true
  scale: 0.885
rug:
  label: Woven Flower Rug
  description: A scalloped rug with a cheerful embroidered flower. It has hidden more
    than one crime against housekeeping.
  model: rug.glb
  decorative: true
  scale: 1.801
lamp:
  label: Reading Lamp
  description: Warm light under a pleated marigold shade. Comes with a faint sense
    of being watched by upholstery.
  model: lamp.glb
  decorative: true
  scale: 1.5
vending:
  label: Card Shop
  description: Base, Tutorial, and Memebase packs. Three cards for 10 Bops; unlimited
    stock, limited judgment.
  model: lesiakower-vending-1586.glb
  decorative: false
  scale: 0.1
stairs:
  label: House Stairs
  description: Rounded wooden steps and a hand-painted banister. Every step sounds
    like a decision.
  model: stairs.glb
  decorative: false
  scale: 2

