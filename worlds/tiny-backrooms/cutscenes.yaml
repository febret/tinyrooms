summon-blue-girl:
  title: She Stands Up
  script: summon-blue-girl.js
  frame: letterbox
  duration: 6400
  audience: room
  room_bound: true
  aliases: [blue-girl]
  max_queue: 1
  params:
    stage_background: '#0d0b04'
    accent: '#e4c95c'
  sounds:
    start: cutscene-start.wav
  text:
  - {at: 200, speaker: The Hum, say: 'The fluorescent note stops. Every light in the maze holds its breath.', sound: retro-error.wav}
  - {at: 2600, speaker: Blue Girl, say: 'You opened the wrong drawer, little traveler. Now we play until the dread runs out.', sound: hiss.wav}
summon-demogorgon:
  title: Petals Open
  script: summon-demogorgon.js
  frame: letterbox
  duration: 6400
  audience: room
  room_bound: true
  aliases: [demogorgon]
  max_queue: 1
  params:
    stage_background: '#04101c'
    accent: '#8cbeff'
  sounds:
    start: cutscene-start.wav
  text:
  - {at: 200, speaker: The Vines, say: 'The black vines go still. Ash hangs in the air like held snow.', sound: retro-error.wav}
  - {at: 2600, speaker: Demogorgon, say: 'LOUD. SMALL. MINE. Unless the iron says otherwise.', sound: hiss.wav}
summon-shoggoth:
  title: It Bubbles
  script: summon-shoggoth.js
  frame: letterbox
  duration: 6400
  audience: room
  room_bound: true
  aliases: [shoggoth]
  max_queue: 1
  params:
    stage_background: '#120a24'
    accent: '#d2a0ff'
  sounds:
    start: cutscene-start.wav
  text:
  - {at: 200, speaker: The Sea, say: 'The black sea tilts. Sixteen throats practice your name.', sound: retro-error.wav}
  - {at: 2600, speaker: Shoggoth, say: 'TEKELI-LI. Stay for the soup of yourself.', sound: hiss.wav}
monster-slain:
  title: The Dark Folds Away
  script: monster-slain.js
  frame: letterbox
  duration: 5600
  audience: room
  room_bound: true
  aliases: [slain]
  max_queue: 1
  params:
    stage_background: '#0a0f0a'
    accent: '#7de07d'
  sounds:
    start: task-complete.wav
  text:
  - {at: 200, speaker: You, say: 'The right tool, held right. The dark folds up like a bad map.', sound: chirp3.wav}
  - {at: 2400, speaker: The Maze, say: 'Somewhere, a socket clicks. A door is listening for symbols.', sound: task-notify.wav}
doom-dragged-back:
  title: Collected
  script: doom-dragged-back.js
  frame: letterbox
  duration: 5600
  audience: private
  room_bound: true
  aliases: [doom]
  max_queue: 1
  params:
    stage_background: '#160404'
    accent: '#e5484d'
  sounds:
    start: retro-error.wav
  text:
  - {at: 200, speaker: The Dark, say: 'The dread ran out. It always runs out. Now you come home with nothing.', sound: hiss.wav}
  - {at: 2400, speaker: The Dark, say: 'Back to the entrance. Zeroed, emptied, reminded.', sound: retro-error.wav}
door-unlocks:
  title: The Door Drinks the Symbols
  script: door-unlocks.js
  frame: letterbox
  duration: 5600
  audience: room
  room_bound: true
  aliases: [unlocks]
  max_queue: 1
  params:
    stage_background: '#0b0e14'
    accent: '#ffd76a'
  sounds:
    start: door-open-old.wav
  text:
  - {at: 200, speaker: The Door, say: 'Four sockets, four symbols, one correct order. Accepted.', sound: switch.wav}
  - {at: 2400, speaker: The Door, say: 'Pass, traveler. The next dark is already waiting.', sound: door-open-old.wav}
escape-dawn:
  title: Morning, At Last
  script: escape-dawn.js
  frame: movie
  duration: 7000
  audience: room
  room_bound: true
  aliases: [escape]
  max_queue: 1
  params:
    stage_background: '#1d2b3a'
    accent: '#ffd76a'
  sounds:
    start: applause.wav
  text:
  - {at: 400, speaker: You, say: 'Sunlight. Real, warm, indifferent sunlight.', sound: chirp3.wav}
  - {at: 2600, speaker: Mara, say: 'You did it. All three doors, all three beasts. Try not to let the house unionize.', sound: task-complete.wav}
