<!doctype html>
<html lang="en" class="full-height">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Restore the Photograph</title>
    <link rel="stylesheet" href="/activities/shared.css">
    <link rel="stylesheet" href="./picture-pieces.css">
  </head>
  <body>
    <main class="shell viewport-column pieces-shell">
      <p class="connection" id="connection" role="status">Waiting for Tinyrooms…</p>
      <h1>Restore the Photograph</h1>
      <p class="pieces-hint" id="level-hint"></p>
      <div class="pieces-tabs" id="tabs" role="tablist" aria-label="Photograph levels"></div>
      <section class="pieces-board" aria-label="Photo quarters">
        <div class="pieces-slots" id="slots"></div>
        <div class="pieces-tray" id="tray" aria-label="Loose quarters"></div>
      </section>
      <div class="pieces-footer">
        <p id="status" role="status">Pick a level, then place each quarter where it belongs.</p>
        <div class="actions">
          <button type="button" class="quiet" id="shuffle">Shuffle</button>
          <button type="button" class="primary" id="check">Read the symbols</button>
        </div>
      </div>
    </main>
    <script src="/activities/shared.js"></script>
    <script type="module" src="./picture-pieces.js"></script>
  </body>
</html>
