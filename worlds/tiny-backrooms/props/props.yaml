CONFIG:
  scale_adjust: 1
# --- Level 1: the Backrooms (investigate loop) ---
humming-fluorescent:
  label: Humming Fluorescent
  description: A tube light that hums one endless note. Search it for what the
    light has been hiding.
  model: humming-fluorescent.glb
  decorative: false
  behavior: investigate
  requires_light: true
  default_actions:
  - - Search
    - .act search @self
  sounds:
    select: hiss.wav
    action: switch.wav
damp-carpet:
  label: Damp Carpet
  description: The carpet squelches. Something was spilled here, or dragged.
    Search it anyway.
  model: damp-carpet.glb
  decorative: false
  behavior: investigate
  requires_light: true
  default_actions:
  - - Search
    - .act search @self
  sounds:
    select: click2.wav
    action: swish.wav
yellow-wallpaper:
  label: Yellow Wallpaper
  description: Greasy diamond-pattern paper, peeling at the seams. It bulges in
    one spot, like a held breath.
  model: yellow-wallpaper.glb
  decorative: false
  behavior: investigate
  requires_light: true
  default_actions:
  - - Search
    - .act search @self
  sounds:
    select: click2.wav
    action: draw.wav
tb-filing-cabinet:
  label: Rusted Filing Cabinet
  description: Every drawer is labeled 1974. One of them is breathing. Search it
    if you must.
  model: filing-cabinet.glb
  decorative: false
  behavior: investigate
  requires_light: true
  default_actions:
  - - Search
    - .act search @self
  sounds:
    select: click3.wav
    action: open-metal.wav
office-chair:
  label: Abandoned Office Chair
  description: Still slowly spinning, though nobody has touched it in years.
    Check the seat cushion.
  model: office-chair.glb
  decorative: false
  behavior: investigate
  requires_light: true
  default_actions:
  - - Search
    - .act search @self
  sounds:
    select: click2.wav
    action: swish.wav
water-cooler:
  label: Gurgling Water Cooler
  description: It gurgles on a schedule, like it is swallowing. The bottle is
    full of something almost like water.
  model: water-cooler.glb
  decorative: false
  behavior: investigate
  requires_light: true
  default_actions:
  - - Search
    - .act search @self
  sounds:
    select: bubble1.wav
    action: bubble1.wav
exit-sign-flicker:
  label: Flickering Exit Sign
  description: EXIT, flickering, pointing at a blank wall. It is lying, or the
    wall is. Look behind it.
  model: exit-sign-flicker.glb
  decorative: false
  behavior: investigate
  requires_light: true
  default_actions:
  - - Search
    - .act search @self
  sounds:
    select: tick.wav
    action: switch.wav
snack-vending:
  label: Dead Snack machine
  description: All coils empty except one, which holds a photograph instead of
    crisps. Rock it gently.
  model: snack-vending.glb
  decorative: false
  behavior: investigate
  requires_light: true
  default_actions:
  - - Search
    - .act search @self
  sounds:
    select: click3.wav
    action: mech1.wav
ceiling-tile:
  label: Stained Ceiling Tile
  description: The stain is roughly person-shaped. The tile sags, heavy with
    hidden weight. Push it up.
  model: ceiling-tile.glb
  decorative: false
  behavior: investigate
  requires_light: true
  default_actions:
  - - Search
    - .act search @self
  sounds:
    select: click2.wav
    action: draw.wav
carpet-stain:
  label: Dark Carpet Stain
  description: It was scrubbed, but not forgiven. The fibers hide grit, glass,
    and maybe a photograph.
  model: carpet-stain.glb
  decorative: false
  behavior: investigate
  requires_light: true
  default_actions:
  - - Search
    - .act search @self
  sounds:
    select: click2.wav
    action: swish.wav
# --- Level 2: the Upside Down ---
vine-wall:
  label: Black Vine Wall
  description: Veins pulse faintly inside the vines. Something paper-like is
    caught in the tendrils.
  model: vine-wall.glb
  decorative: false
  behavior: investigate
  requires_light: true
  default_actions:
  - - Search
    - .act search @self
  sounds:
    select: hiss.wav
    action: swish.wav
spore-cluster:
  label: Spore Cluster
  description: Pale pods breathing in the ash-light. One has burst, scattering
    glitter and a torn corner of photo.
  model: spore-cluster.glb
  decorative: false
  behavior: investigate
  requires_light: true
  default_actions:
  - - Search
    - .act search @self
  sounds:
    select: bubble1.wav
    action: crunch1.wav
christmas-lights:
  label: Dead Christmas Lights
  description: They spell nothing now, but one bulb still ticks with current.
    Somebody left a message in the wire nest.
  model: christmas-lights.glb
  decorative: false
  behavior: investigate
  requires_light: true
  default_actions:
  - - Search
    - .act search @self
  sounds:
    select: tick.wav
    action: switch.wav
hawkins-bike:
  label: Rusted Hawkins Bike
  description: A kid-sized bike, handlebars bent toward the dark. The satchel
    still holds something flat and glossy.
  model: hawkins-bike.glb
  decorative: false
  behavior: investigate
  requires_light: true
  default_actions:
  - - Search
    - .act search @self
  sounds:
    select: click2.wav
    action: mech1.wav
demodog-nest:
  label: Demodog Nest
  description: Shredded lab coats lined with teeth marks. The nest-mother is
    out hunting. Be quick, be quiet, take the photo scrap.
  model: demodog-nest.glb
  decorative: false
  behavior: investigate
  requires_light: true
  default_actions:
  - - Search
    - .act search @self
  sounds:
    select: hiss.wav
    action: crunch1.wav
floating-rock:
  label: Floating Rock
  description: 'It hovers a hand above the ash, slowly turning. Wedged beneath
    it: papers that should have blown away years ago.'
  model: floating-rock.glb
  decorative: false
  behavior: investigate
  requires_light: true
  default_actions:
  - - Search
    - .act search @self
  sounds:
    select: click2.wav
    action: draw.wav
ash-pile:
  label: Gray Ash Pile
  description: Everything here ends as ash. Sift it; the fire missed something
    photographic.
  model: ash-pile.glb
  decorative: false
  behavior: investigate
  requires_light: true
  default_actions:
  - - Search
    - .act search @self
  sounds:
    select: click2.wav
    action: swish.wav
broken-radio:
  label: Broken Lab Radio
  description: It hisses between stations, and between the hiss, a lullaby. The
    battery cover hides a flat surprise.
  model: broken-radio.glb
  decorative: false
  behavior: investigate
  requires_light: true
  default_actions:
  - - Search
    - .act search @self
  sounds:
    select: tick.wav
    action: retro-error.wav
lab-door:
  label: Sealed Lab Door
  description: HAWKINS NATIONAL LABORATORY, stenciled over. The porthole is
    smashed from the inside. Reach through carefully.
  model: lab-door.glb
  decorative: false
  behavior: investigate
  requires_light: true
  default_actions:
  - - Search
    - .act search @self
  sounds:
    select: click3.wav
    action: open-metal.wav
mindflayer-lichen:
  label: Mindflayer Lichen
  description: A bruise-colored crust that flinches from your flashlight. Peel
    back the edge; it kept a souvenir.
  model: mindflayer-lichen.glb
  decorative: false
  behavior: investigate
  requires_light: true
  default_actions:
  - - Search
    - .act search @self
  sounds:
    select: hiss.wav
    action: swish.wav
# --- Level 3: the Outer Plane ---
non-euclid-obelisk:
  label: Non-Euclid Obelisk
  description: It has too many sides, and the count changes. A photo quarter is
    folded into its impossible crease.
  model: non-euclid-obelisk.glb
  decorative: false
  behavior: investigate
  requires_light: true
  default_actions:
  - - Search
    - .act search @self
  sounds:
    select: click3.wav
    action: cutscene-start.wav
chanting-idol:
  label: Chanting Idol
  description: It chants in a throat you almost recognize. Offerings at its base
    include a torn photograph.
  model: chanting-idol.glb
  decorative: false
  behavior: investigate
  requires_light: true
  default_actions:
  - - Search
    - .act search @self
  sounds:
    select: squeak2.wav
    action: chirp1.wav
black-sea-pool:
  label: Black Sea Pool
  description: Perfectly still, perfectly black, perfectly deep. Something
    glossy floats just below the surface.
  model: black-sea-pool.glb
  decorative: false
  behavior: investigate
  requires_light: true
  default_actions:
  - - Search
    - .act search @self
  sounds:
    select: bubble1.wav
    action: bubble1.wav
tentacle-coral:
  label: Tentacle Coral
  description: 'It waves though there is no current. Wrapped in one arm: a damp,
    gibbering photograph.'
  model: tentacle-coral.glb
  decorative: false
  behavior: investigate
  requires_light: true
  default_actions:
  - - Search
    - .act search @self
  sounds:
    select: hiss.wav
    action: swish.wav
shoggoth-slime:
  label: Shoggoth Slime Trail
  description: 'Still warm, still thinking. The trail loops around something the
    mass could not digest: a photo quarter.'
  model: shoggoth-slime.glb
  decorative: false
  behavior: investigate
  requires_light: true
  default_actions:
  - - Search
    - .act search @self
  sounds:
    select: bubble1.wav
    action: crunch1.wav
elder-rune-stone:
  label: Elder Rune Stone
  description: 'The ward hums against your teeth. Tucked behind the stone, where
    the dark is thinnest: paper.'
  model: elder-rune-stone.glb
  decorative: false
  behavior: investigate
  requires_light: true
  default_actions:
  - - Search
    - .act search @self
  sounds:
    select: tick.wav
    action: cutscene-start.wav
void-window:
  label: Void Window
  description: 'A window onto stars that look back. On the sill, held down by a
    cold stone: a torn photograph.'
  model: void-window.glb
  decorative: false
  behavior: investigate
  requires_light: true
  default_actions:
  - - Search
    - .act search @self
  sounds:
    select: click2.wav
    action: switch.wav
gibbering-mound:
  label: Gibbering Mound
  description: It speaks with mouths it borrowed. Listen long enough and it
    tells you where it hid the picture. Then stop listening.
  model: gibbering-mound.glb
  decorative: false
  behavior: investigate
  requires_light: true
  default_actions:
  - - Search
    - .act search @self
  sounds:
    select: squeak2.wav
    action: retro-error.wav
bone-chime:
  label: Bone Chime
  description: It rings in no wind. Each tone is a name you almost know. A photo
    quarter hangs from the longest bone.
  model: bone-chime.glb
  decorative: false
  behavior: investigate
  requires_light: true
  default_actions:
  - - Search
    - .act search @self
  sounds:
    select: chirp1.wav
    action: ring.wav
starry-abyss:
  label: Starry Abyss Grate
  description: Lift the grate and the stars look up at you. Something flat
    snagged on the bars on its way down.
  model: starry-abyss.glb
  decorative: false
  behavior: investigate
  requires_light: true
  default_actions:
  - - Search
    - .act search @self
  sounds:
    select: click3.wav
    action: open-metal.wav
# --- Lurking monsters (state-switching props) ---
blue-girl-lurker:
  label: Flickering Exit Sign
  description: 'EXIT, flickering, pointing at a blank wall. It is lying, or the
    wall is. Look behind it.'
  decorative: false
  behavior: lurking
  states:
    dormant: exit-sign-flicker.glb
    revealed: blue-girl.glb
  active_state: dormant
  default_actions:
  - - Search
    - .act search @self
  - - Strike with the tool
    - .act strike @self
  sounds:
    select: tick.wav
    action: switch.wav
demogorgon-lurker:
  label: Demodog Nest
  description: Shredded lab coats lined with teeth marks. The nest-mother is
    out hunting. Be quick, be quiet, take the photo scrap.
  decorative: false
  behavior: lurking
  states:
    dormant: demodog-nest.glb
    revealed: demogorgon.glb
  active_state: dormant
  default_actions:
  - - Search
    - .act search @self
  - - Strike with the tool
    - .act strike @self
  sounds:
    select: hiss.wav
    action: crunch1.wav
shoggoth-lurker:
  label: Gibbering Mound
  description: It speaks with mouths it borrowed. Listen long enough and it
    tells you where it hid the picture. Then stop listening.
  decorative: false
  behavior: lurking
  states:
    dormant: gibbering-mound.glb
    revealed: shoggoth.glb
  active_state: dormant
  default_actions:
  - - Search
    - .act search @self
  - - Strike with the tool
    - .act strike @self
  sounds:
    select: squeak2.wav
    action: retro-error.wav
# --- Exit doors ---
exit-door-br:
  label: First Exit Door
  description: 'Riveted steel with four empty symbol sockets in a row. Feed it
    the Backrooms photo pieces in order: HOLLOW EYE, KNOTTED BELL, BRASS KEY, PAPER MOTH.'
  model: exit-door-br.glb
  decorative: false
  behavior: exit_door
  default_actions:
  - - Study the door
    - .act study @self
  sounds:
    select: click3.wav
    action: door-close.wav
exit-door-ud:
  label: Second Exit Door
  description: 'A lab blast door veined with black vines. Four sockets wait:
    ASHEN STAR, PETAL MAW, IRON FANG, DROWNED BELL.'
  model: exit-door-ud.glb
  decorative: false
  behavior: exit_door
  default_actions:
  - - Study the door
    - .act study @self
  sounds:
    select: click3.wav
    action: door-close.wav
exit-door-op:
  label: Last Exit Door
  description: 'A door of black coral that breathes. Four sockets gibber for:
    YAWNING SIGIL, SIXTEEN THROATS, BLACK TIDE, CROOKED CROWN.'
  model: exit-door-op.glb
  decorative: false
  behavior: exit_door
  default_actions:
  - - Study the door
    - .act study @self
  sounds:
    select: click3.wav
    action: door-close.wav
# --- Workbench + dispensers ---
picture-workbench:
  label: Picture Workbench
  description: 'A traveler workbench: string, pins, and a cracked magnifier.
    Study the fragments here to open the picture activity and learn the code.'
  model: picture-workbench.glb
  decorative: false
  behavior: workbench
  activity: picture-pieces
  default_actions:
  - - Study the fragments
    - .act study @self
  sounds:
    select: click2.wav
    action: draw.wav
med-cache-br:
  label: Traveler Med-Cache
  description: 'A recharging field kit: almond water and portal jerky for whoever
    is still alive to need them.'
  model: med-cache.glb
  decorative: false
  behavior: dispenser
  content:
  - almond-water
  - portal-jerky
  - mold-bread
  - static-candy
  cooldown: 60
  default_actions:
  - - Take supplies
    - .dispense @self
  sounds:
    select: click2.wav
    action: mech1.wav
med-cache-ud:
  label: Hunter Med-Cache
  description: Hawkins-issue field kit, long expired, still restocked by persons
    unknown. Take what you are missing.
  model: med-cache.glb
  decorative: false
  behavior: dispenser
  content:
  - almond-water
  - portal-jerky
  - mold-bread
  - static-candy
  cooldown: 60
  default_actions:
  - - Take supplies
    - .dispense @self
  sounds:
    select: click2.wav
    action: mech1.wav
med-cache-op:
  label: Cultist Med-Cache
  description: Nobody admits to stocking it. The bandages chant faintly. Take
    what you are missing and do not ask.
  model: med-cache.glb
  decorative: false
  behavior: dispenser
  content:
  - almond-water
  - portal-jerky
  - mold-bread
  - static-candy
  cooldown: 60
  default_actions:
  - - Take supplies
    - .dispense @self
  sounds:
    select: click2.wav
    action: mech1.wav
tool-crate-br:
  label: Brass-Bound Tool Crate
  description: 'Traveler Mara cache: a music box, a glitch gun, and a spare
    flashlight for whoever she failed to save last time.'
  model: tool-crate.glb
  decorative: false
  behavior: dispenser
  content:
  - lullaby-music-box
  - deglitcher
  - backrooms-flashlight
  cooldown: 60
  default_actions:
  - - Take tools
    - .dispense @self
  sounds:
    select: click3.wav
    action: open-metal.wav
tool-crate-ud:
  label: Hawkins Armory Crate
  description: 'A quartermaster crate: an iron bat, a gas mask, and a spare
    flashlight. Jonathan handwriting on the lid says TAKE IT ALL.'
  model: tool-crate.glb
  decorative: false
  behavior: dispenser
  content:
  - iron-bat
  - gas-mask
  - backrooms-flashlight
  cooldown: 60
  default_actions:
  - - Take tools
    - .dispense @self
  sounds:
    select: click3.wav
    action: open-metal.wav
tool-crate-op:
  label: Warded Reliquary
  description: 'A lead box bound in elder signs. Inside: the sign itself, a
    hazmat suit, and a spare flashlight. Open it. Do not lick it.'
  model: tool-crate.glb
  decorative: false
  behavior: dispenser
  content:
  - elder-sign
  - hazmat-suit
  - backrooms-flashlight
  cooldown: 60
  default_actions:
  - - Take tools
    - .dispense @self
  sounds:
    select: click3.wav
    action: open-metal.wav
# --- Hazard markers ---
poison-vent:
  label: Seeping Floor Vent
  description: Green fog pours out of this vent and crawls across the floor.
    Equip a gas mask or hazmat suit before you breathe here.
  model: poison-vent.glb
  decorative: false
  behavior: hazard
  effects:
    idle:
    - poison-fog
  active_effect: idle
  default_actions:
  - - Inspect the fog
    - .act inspect @self
  sounds:
    select: hiss.wav
    action: hiss.wav
rad-rod:
  label: Cracked Emitter Rod
  description: A snapped emitter rod spitting yellow static snow. Equip a hazmat
    suit before you linger; a gas mask will not save you here.
  model: rad-rod.glb
  decorative: false
  behavior: hazard
  effects:
    idle:
    - rad-static
  active_effect: idle
  default_actions:
  - - Inspect the static
    - .act inspect @self
  sounds:
    select: tick.wav
    action: retro-error.wav
# --- Finale ---
sun-memorial:
  label: Sun Memorial
  description: A brass sun bolted to warm concrete. Touch it. You earned it.
  model: sun-memorial.glb
  decorative: false
  behavior: investigate
  default_actions:
  - - Touch the sun
    - .act search @self
  sounds:
    select: chirp3.wav
    action: applause.wav
