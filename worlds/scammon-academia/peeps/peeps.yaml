principal:
  label: Principal Pesto
  description: The gray husky principal keeps an eye on the hall and always has time
    for a new teacher.
  room: hall
  image: principal.svg
  script: principal.py
  actions:
  - - Talk
    - .talk principal
  - - Ask for help
    - .talk principal
  dialog:
    start:
      text: Welcome to Scammon Academia! I am Principal Pesto. The gray husky on the
        wall is me. Are you here to teach, or just to peek into the classrooms?
      choices:
      - label: How do I start teaching?
        next: teaching
      - label: What are my quests?
        next: quests
      - label: How do teacher standings work?
        next: standings
      - label: Goodbye, Principal.
        end: true
    teaching:
      text: Buy a classroom door in the Classrooms activity, then step inside and
        use Start Lesson. Slot a subject Skill from your inventory, then teach topic
        cards to the class. When you are ready, give the class a test.
      choices:
      - label: Tell me about topics and skills.
        next: topics
      - label: Back to the beginning.
        next: start
    topics:
      text: Every subject has a Skill card and ten topic cards. A topic card only
        works when its subject Skill is slotted in your Skills panel. Students lose
        energy as they listen, so do not teach forever before the test!
      choices:
      - label: Back to the beginning.
        next: start
    quests:
      text: Here is the Scammon Academia quest board. Pick a quest and I will add
        it to your journal so you can track it.
      choices:
      - label: Get a classroom.
        next: accepted
        start_task: get-a-classroom
      - label: Teach your first lesson.
        next: accepted
        start_task: first-lesson
      - label: Earn a 3.0 GPA lesson.
        next: accepted
        start_task: gpa-3-0
      - label: Teach ten lessons.
        next: accepted
        start_task: ten-lessons
      - label: Teach every subject.
        next: subjects
      - label: Back to the beginning.
        next: start
    subjects:
      text: A well-rounded faculty teaches every subject. Pick a subject to add its
        quest to your journal; complete all nine to become the pride of Scammon.
      choices:
      - label: Reading.
        next: accepted
        start_task: teach-reading
      - label: Writing.
        next: accepted
        start_task: teach-writing
      - label: Math.
        next: accepted
        start_task: teach-math
      - label: History.
        next: accepted
        start_task: teach-history
      - label: Geography.
        next: accepted
        start_task: teach-geography
      - label: Chemistry.
        next: accepted
        start_task: teach-chemistry
      - label: Tech.
        next: accepted
        start_task: teach-tech
      - label: Sport.
        next: accepted
        start_task: teach-sport
      - label: Biology.
        next: accepted
        start_task: teach-biology
      - label: Back to the quest board.
        next: quests
    accepted:
      text: It is in your journal now. Open the Journal to see your progress. Come
        back any time for help.
      choices:
      - label: Show me the quest board again.
        next: quests
      - label: Goodbye, Principal.
        end: true
    standings:
      text: Every lesson earns you a teacher GPA from the class test. Standings rank
        teachers by their average GPA this quarter. A quarter lasts one hundred lessons
        school-wide, and the top five teachers earn bonus Bops when it ends. Then
        the averages reset for the next quarter.
      choices:
      - label: Back to the beginning.
        next: start
