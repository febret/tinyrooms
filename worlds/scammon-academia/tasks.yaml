# Scammon Academia quests. The principal points new teachers at these, and the
# journal tracks each one. Steps advance from generic lesson signals emitted by
# the classrooms mod.
get-a-classroom:
  title: A Classroom of Your Own
  description: Open the Classrooms activity and buy your own classroom door.
  scope: personal
  revision: 1
  memory_tags:
  - scammon-classroom
  memory: I bought my own classroom at Scammon Academia.
  reward:
    kudos: 3
    cards:
    - topic-reading-alphabet
  steps:
  - step_id: buy-classroom
    trigger: signal
    match:
      event: classroom_bought
    title: Get a classroom
    memory_tag: got-classroom
    memory: I got a classroom.

first-lesson:
  title: First Day of School
  description: Start a lesson in your classroom and teach the class a topic.
  scope: personal
  revision: 1
  memory_tags:
  - scammon-first-lesson
  memory: I taught my first class at Scammon Academia.
  reward:
    kudos: 2
  steps:
  - step_id: start-lesson
    trigger: signal
    match:
      event: lesson_started
    title: Start your first lesson
    memory_tag: first-lesson-started
    memory: I started my first lesson.
  - step_id: finish-lesson
    trigger: signal
    match:
      event: lesson_completed
    title: Give the class a test
    memory_tag: first-lesson-complete
    memory: I gave the class a test.

gpa-3-0:
  title: Honor Roll Teacher
  description: Finish a lesson with a teacher GPA of 3.0 or better.
  scope: personal
  revision: 1
  memory_tags:
  - scammon-honor-roll
  memory: I earned a 3.0 GPA lesson.
  reward:
    kudos: 5
    cards:
    - topic-math-counting
  steps:
  - step_id: honor-roll
    trigger: signal
    match:
      event: lesson_gpa_3
    title: Earn a 3.0 GPA lesson
    memory_tag: honor-roll
    memory: I earned a 3.0 GPA lesson.

ten-lessons:
  title: Ten Lessons In
  description: Complete ten lessons across the school year.
  scope: personal
  revision: 1
  memory_tags:
  - scammon-ten-lessons
  memory: I completed ten lessons across the school year.
  reward:
    kudos: 10
    cards:
    - topic-biology-plants
  steps:
  - step_id: ten-lessons
    trigger: signal
    match:
      event: lesson_completed
    amount: 10
    title: Complete ten lessons
    memory_tag: ten-lessons
    memory: I completed ten lessons.

# One task per subject; the engine advances only the first incomplete step of a
# task, so order-independent objectives must be separate tasks.
teach-reading:
  title: Teach Reading
  description: Teach at least one Reading topic in a lesson.
  scope: personal
  revision: 1
  memory: I taught Reading in a lesson.
  reward: {kudos: 3}
  steps:
  - step_id: teach
    trigger: signal
    match: {event: subject_taught, subject: reading}
    title: Teach Reading
    memory_tag: taught-reading
    memory: I taught Reading.
