get-a-classroom:
  title: A Classroom of Your Own
  description: Open the Classrooms activity and buy your own classroom door.
  scope: personal
  revision: 1
  memory_tags:
  - scammon-classroom
  memory: I bought my own classroom at Scammon Academia.
  reward:
    kudos: 3
    cards:
    - topic-reading-alphabet
  steps:
  - step_id: buy-classroom
    trigger: signal
    match:
      event: classroom_bought
    title: Get a classroom
    memory_tag: got-classroom
    memory: I got a classroom.
first-lesson:
  title: First Day of School
  description: Start a lesson in your classroom and teach the class a topic.
  scope: personal
  revision: 1
  memory_tags:
  - scammon-first-lesson
  memory: I taught my first class at Scammon Academia.
  reward:
    kudos: 2
  steps:
  - step_id: start-lesson
    trigger: signal
    match:
      event: lesson_started
    title: Start your first lesson
    memory_tag: first-lesson-started
    memory: I started my first lesson.
  - step_id: finish-lesson
    trigger: signal
    match:
      event: lesson_completed
    title: Give the class a test
    memory_tag: first-lesson-complete
    memory: I gave the class a test.
gpa-3-0:
  title: Honor Roll Teacher
  description: Finish a lesson with a teacher GPA of 3.0 or better.
  scope: personal
  revision: 1
  memory_tags:
