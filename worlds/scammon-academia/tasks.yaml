  memory: I earned a 3.0 GPA lesson.
  reward:
    kudos: 5
    cards:
    - topic-math-counting
  steps:
  - step_id: honor-roll
    trigger: signal
    match:
      event: lesson_gpa_3
    title: Earn a 3.0 GPA lesson
    memory_tag: honor-roll
    memory: I earned a 3.0 GPA lesson.
ten-lessons:
