fence-mara:
  label: Fence Mara
  description: A retired thief who now sells other people's courage back to them at
    fair prices.
  room: hideout
  image: fence-mara.png
  actions:
  - - Ask about jobs
    - .heist board
  - - Ask about heat
    - .heist heat
  dialog:
    start:
      text: So you want to crack this bank. Bold. Buy tools from the locker, start
        a job from the board, and stay out of the red cones. Heat follows success;
        lay low if the city starts recognizing you.
      choices:
      - label: What tools should I buy?
        next: tools
      - label: What happens if we are caught?
        next: caught
      - label: Enough talk.
        end: true
    tools:
      text: Lockpicks open doors. Disguises buy patience. Smoke and decoys buy distance.
        EMPs buy silence. Drills buy vaults. Grapples buy a second way out. Jammers
        buy one delayed mistake.
      choices:
      - label: Back
        next: start
    caught:
      text: Caught means dropped loot, a lost deposit, a short walk home, and a story
        the guards will exaggerate. Nobody loses their tools or their crew.
      choices:
      - label: Back
        next: start
