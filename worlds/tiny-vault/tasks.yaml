first-job:
  title: First Job
  description: Finish one vault heist, loud or quiet.
  scope: personal
  revision: 1
  memory_tags: [tiny-vault]
  memory: I finished my first vault job. The fence paid; the guards complained.
  reward:
    kudos: 2
    cards: [heist-gold-bar]
  sounds:
    started: task-notify.wav
    completed: applause.wav
    notification: beep1.wav
  steps:
  - step_id: finish-one
    trigger: signal
    match:
      event: heist_job_complete
      completed: '1'
    title: Complete one heist
clean-getaway:
  title: Clean Getaway
  description: Finish a heist before the alarm ever rises.
  scope: personal
  revision: 1
  memory_tags: [tiny-vault]
  memory: I left the bank before anyone knew the vault was breathing hard.
  reward:
    kudos: 3
    cards: [heist-diamond]
  sounds:
    started: task-notify.wav
    completed: applause.wav
    notification: beep1.wav
  steps:
  - step_id: ghost-run
    trigger: signal
    match:
      event: heist_job_complete
      clean: '1'
    title: Complete one heist without an alarm
master-thief:
  title: Master Thief
  description: Complete five heists. The city will learn your footsteps.
  scope: personal
  revision: 1
  memory_tags: [tiny-vault]
  memory: Five vaults, five getaways, one very tired pair of shoes.
  reward:
    kudos: 5
    cards: [heist-master-key]
  sounds:
    started: task-notify.wav
    completed: applause.wav
    notification: beep1.wav
  steps:
  - step_id: five-scores
    trigger: signal
    amount: 5
    match:
      event: heist_job_complete
      completed: '1'
    title: Complete five heists
daily-score:
  title: Daily Score
  description: Complete one heist today. Crime loves routine.
  scope: personal
  revision: 1
  repeatable: true
  reset_policy: daily
  memory_tags: [tiny-vault]
  memory: Another day, another clean score.
  reward:
    kudos: 1
    cards: [heist-bear-bond]
  sounds:
    started: task-notify.wav
    completed: applause.wav
    notification: beep1.wav
  steps:
  - step_id: today-one
    trigger: signal
    match:
      event: heist_job_complete
      completed: '1'
    title: Complete one heist today
