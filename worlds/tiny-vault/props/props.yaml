  decorative: false
  scale: 1
  tags:
  - heist-alarm
  - heist
  default_actions:
  - - Check the alarm
    - .heist status
    - true
  sprite_footprint: [3, 2]
  sounds:
    select: beep1.wav
    action: beep1.wav
heist-vault:
  label: The Vault
  description: A round steel mouth full of other people's retirement plans.
