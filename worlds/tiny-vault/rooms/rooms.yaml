hideout:
  label: The Hideout
  description: A lamplit back room with a job board, tool lockers, and a fence who
    knows more than the paperwork.
  board_type: basic
  board_image: hideout-floor.png
  board_image_style: stretch
  palette:
  - '#241d18'
  - '#c9a24a'
  - '#4a6b8a'
  environment: night
  editor:
    environment:
    - palette
    - board_image_style
    map:
      x: 0
      y: 0
  props:
    job-board:
      prop: heist-job-board
      pos: [50, 16, 0]
      rot: [0, 0, 0]
      scale: 1.4
      sign_style: chalk
      surface:
        text: 'TINY VAULT JOBS

Open the board, buy tools, mark a leader.'
    tool-shelf:
      prop: heist-tool-shelf
      pos: [20, 20, 0]
      rot: [0, 0, 0]
      scale: 1.1
    planning-table:
      prop: live-edge-slab-table
      pos: [50, 55, 0]
      rot: [0, 0, 0]
      scale: 1.1
    hideout-chair-a:
      prop: mustard-armchair
      pos: [36, 68, 0]
      rot: [0, 20, 0]
      scale: 1
    hideout-chair-b:
      prop: mustard-armchair
      pos: [64, 68, 0]
      rot: [0, -20, 0]
      scale: 1
    hideout-lamp:
      prop: bookstack-floor-lamp
      pos: [84, 20, 0]
      rot: [0, 0, 0]
      scale: 1
  exits: {}
