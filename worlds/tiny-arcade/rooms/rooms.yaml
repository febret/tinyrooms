          Admin, moderator, or game master:
          use Reset game in room actions.'
  game:
    kind: chess
    controller: chess-controller
    renderer: grid
    reset_powers:
    - admin
    - moderator
    - game-master
    assets:
      grain: rooms/wood-grain.png
    models:
      wP: chess-pawn-white
      wN: chess-knight-white
      wB: chess-bishop-white
      wR: chess-rook-white
      wQ: chess-queen-white
      wK: chess-king-white
      bP: chess-pawn-black
      bN: chess-knight-black
      bB: chess-bishop-black
      bR: chess-rook-black
      bQ: chess-queen-black
      bK: chess-king-black
    effects:
      threat: [ember-glow]
      check: [ember-glow, fire]
    config:
      columns: 8
      rows: 8
      origin: [19, 11.7]
      size: [62, 76.6]
      light: '#efdfbd'
      dark: '#5b3b28'
  exits:
    lobby:
      label: Back to the Arcade Lobby
      target: lobby
