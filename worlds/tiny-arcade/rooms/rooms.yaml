restroom:
  label: The Restroom Lounge
  description: A neon-tiled restroom lounge with three statement toilets, a stocked
    medicine cabinet, an apothecary cupboard, and a mirror that reflects only your
    best angles.
  board_type: basic
  board_image: restroom.png
  board_image_style: stretch
  palette:
  - '#10202b'
  - '#7af7e4'
  - '#ff8fd0'
  grid: [1, 0, 0]
  props:
