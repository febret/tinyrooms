    kind: chess
    controller: chess-controller
    renderer: grid
    reset_powers:
    - admin
    - moderator
    - game-master
    assets:
      grain: rooms/wood-grain.png
    models:
      wP: chess-pawn-white
      wN: chess-knight-white
      wB: chess-bishop-white
      wR: chess-rook-white
      wQ: chess-queen-white
      wK: chess-king-white
