<!doctype html>
<html lang="en" class="full-height">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Tinyrooms Chess Activity</title>
    <link rel="stylesheet" href="/activities/shared.css">
    <link rel="stylesheet" href="./chess.css">
  </head>
  <body>
    <main class="shell viewport-column chess-shell">
      <p class="connection" id="connection" role="status">Waiting for Tinyrooms…</p>
      <section class="chess-top" aria-label="Chess status">
        <div class="chess-status">
          <strong id="status">Chess</strong>
          <span id="details" class="muted">Open this board from the lobby.</span>
        </div>
        <div class="chess-meta">
          <span class="badge">Energy <strong id="energy">—</strong></span>
          <button type="button" class="quiet small" id="reset" hidden>Reset board</button>
        </div>
      </section>
      <svg class="chess-defs" aria-hidden="true" focusable="false">
        <defs>
          <linearGradient id="ivory-body" x1="0" y1="0" x2="0.35" y2="1">
            <stop offset="0" stop-color="#fffaf0"/>
            <stop offset="0.45" stop-color="#ead7af"/>
            <stop offset="1" stop-color="#b98f54"/>
          </linearGradient>
          <linearGradient id="obsidian-body" x1="0" y1="0" x2="0.35" y2="1">
            <stop offset="0" stop-color="#6d6678"/>
            <stop offset="0.35" stop-color="#2c2833"/>
            <stop offset="1" stop-color="#08070c"/>
          </linearGradient>
        </defs>
      </svg>
      <section class="chess-table" aria-label="Chess board">
        <div class="chess-board" id="board" role="grid" aria-label="Chess board"></div>
        <div class="chess-side">
          <div>
            <h2>Captured by White</h2>
            <p id="captured-black" class="captured" aria-live="polite"></p>
          </div>
          <div>
            <h2>Captured by Black</h2>
            <p id="captured-white" class="captured" aria-live="polite"></p>
          </div>
          <p class="smallprint muted">Captures pay Bops by piece value. Checkmate pays 3 Kudos. Each move costs 5 Energy.</p>
        </div>
      </section>
      <div class="dialog-shade" id="promotion" hidden>
        <section class="paper" role="dialog" aria-modal="true" aria-labelledby="promotion-title">
          <h2 id="promotion-title">Promote to</h2>
          <div class="actions" id="promotion-options"></div>
        </section>
      </div>
    </main>
    <script src="/activities/shared.js"></script>
    <script type="module" src="./chess.js"></script>
  </body>
</html>
