<!doctype html>
<html lang="en" class="full-height">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
    <title>Tinyrooms Paintball Arena</title>
    <link rel="stylesheet" href="/activities/shared.css">
    <link rel="stylesheet" href="./paintball.css">
  </head>
  <body>
    <main class="shell viewport-column paint-shell">
      <p class="connection" id="connection" role="status">Waiting for Tinyrooms…</p>
      <section class="paint-hud" aria-label="Arena status">
        <div class="paint-score"><strong id="status">Paintball Arena</strong><span id="scoreboard" class="muted"></span></div>
        <div class="paint-meta">
          <span class="badge">Health <strong id="health">—</strong></span>
          <span class="badge">Energy <strong id="energy">—</strong></span>
          <span class="badge">Color <strong id="paint">—</strong></span>
        </div>
      </section>
      <section class="paint-stage">
        <canvas id="arena" aria-label="Paintball arena"></canvas>
        <div class="paint-podium" id="podium" hidden></div>
      </section>
    </main>
    <script src="/activities/shared.js"></script>
    <script type="module" src="./paintball.js"></script>
  </body>
</html>
