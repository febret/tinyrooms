paintball-vending:
  label: Paintball Arena
  description: A neon arena terminal humming with paint canisters. Select it to enter
    the arena. Each round costs 20 Energy.
  model: paintball-vending.glb
  decorative: true
  behavior: paintball
  activity: paintball
  one_per_room: true
  scale: 2
  sprite_footprint:
  - 4
  - 3
  tags:
  - arcade
  - paintball
  - vending
  default_actions:
  - - Enter the paintball arena
    - .play paintball
    - true
chess-cabinet:
  label: Chess Cabinet
  description: A neon arcade cabinet wired for chess. Select it to play either side.
  model: chess-cabinet.glb
  decorative: true
  behavior: chess
  activity: chess
  one_per_room: true
  scale: 1.2
  sprite_footprint:
  - 4
  - 3
  tags:
  - arcade
  - chess
  - game
  default_actions:
  - - Play chess
    - .play chess
    - true
arcade-snack-dresser:
  label: Snack Counter
  description: A neon-lit snack counter serving fresh supermarket treats. One free
    snack per customer, then it needs a moment to restock.
  model: arcade-snack-dresser.glb
  decorative: false
  behavior: dispenser
  content:
  - market-cookies
  - market-blueberry-muffins
  - market-cereal
  - market-chocolate
  - market-honey
  - market-apple
  - market-banana
  - market-strawberry
  cooldown: 45
  default_actions:
  - - Grab a snack
    - .dispense @self
  scale: 1.45
  tags:
  - arcade
  - supermarket
  - snack
  - dispenser
  sounds:
    select: click2.wav
    action: draw.wav
arcade-drink-cooler:
  label: Chilled Drink Cooler
  description: A humming cooler packed with supermarket drinks. Cold enough to reset
    your reflexes between rounds.
  model: arcade-drink-cooler.glb
  decorative: false
  behavior: dispenser
  content:
  - market-water
  - market-milk
  - market-coffee
  - market-tea
  - market-cocoa
  - market-herbal-tea
  - market-smoothie-base
  - market-lemon
  cooldown: 45
  default_actions:
  - - Grab a drink
    - .dispense @self
  scale: 1.2
  tags:
  - arcade
  - supermarket
  - snack
  - drink
  - dispenser
  sounds:
    select: click3.wav
    action: hiss.wav
arcade-sweet-shelf:
  label: Sweet Shelf
  description: A glowing shelf of supermarket desserts. The neon makes everything
    look like a high score.
  model: arcade-sweet-shelf.glb
  decorative: false
  behavior: dispenser
  content:
  - market-cake
  - market-apple-pie
  - market-cookies
  - market-blueberry-muffins
  - market-chocolate
  - market-cocoa
  cooldown: 60
  default_actions:
  - - Pick a dessert
    - .dispense @self
  scale: 1.25
  tags:
  - arcade
  - supermarket
  - snack
  - dessert
  - dispenser
  sounds:
    select: click1.wav
    action: ring.wav
