paintball-vending:
  label: Paintball Vending Machine
  description: A neon vending machine humming with paint canisters. Buy a blaster
    or a set of ten paintballs, then enter the arena.
  model: paintball-vending.glb
  decorative: true
  behavior: paintball
  activity: paintball
  one_per_room: true
  scale: 2
  sprite_footprint:
  - 4
  - 3
  tags:
  - arcade
  - paintball
  - vending
  default_actions:
  - - Enter the paintball arena
    - .play paintball
    - true
