# Base skill cards
sturdy:
  label: Sturdy
  description: Increases physical resilience, Constitution +1
  image: sturdy.webp
  type: skill
  rank: Script Kiddo
  rarity: Common
  bonuses: {constitution: 1}

nimble:
  label: Nimble
  description: Light on your feet. Dexterity +1 while slotted.
  image: nimble.webp
  type: skill
  rank: Script Kiddo
  rarity: Common
  bonuses: {dexterity: 1}
charming:
  label: Charming
  description: A little everyday warmth. Charisma +1 while slotted.
  image: charming.webp
  type: skill
  rank: Script Kiddo
  rarity: Common
  bonuses: {charisma: 1}
stylish:
  label: Stylish
  description: Make your own entrance. Fanciness +1 while slotted.
  image: stylish.webp
  type: skill
  rank: Script Kiddo
  rarity: Common
  bonuses: {fanciness: 1}
spirited:
  label: Spirited
  description: A little extra get-up-and-go. Maximum Energy +10 while slotted.
  image: spirited.webp
  type: skill
  rank: Script Kiddo
  rarity: Uncommon
  bonuses: {max_energy: 10}
wave:
  label: Little Wave
  description: An animated hello, made for sharing.
  image: wave.webp
  animation: wave.gif
  type: emote
  category: Animation
  rarity: Common
happy-dance:
  label: Happy Dance
  description: A tiny, looping victory dance.
  image: happy-dance.webp
  animation: happy-dance.gif
  type: emote
  category: Animation
  rarity: Common
heart:
  label: Warm Heart
  description: Send a hand-drawn heart floating into the room.
