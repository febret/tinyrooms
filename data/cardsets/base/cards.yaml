# Base skill cards
sturdy:
  label: Sturdy
  description: Increases physical resilience, Constitution +1
  image: sturdy-art.webp
  type: skill
  rank: Script Kiddo
  rarity: Common
  bonuses: {constitution: 1}

nimble:
  label: Nimble
  description: Light on your feet. Dexterity +1 while slotted.
  image: nimble-art.webp
  type: skill
  rank: Script Kiddo
  rarity: Common
  bonuses: {dexterity: 1}
charming:
  label: Charming
  description: A little everyday warmth. Charisma +1 while slotted.
  image: charming-art.webp
  type: skill
  rank: Script Kiddo
  rarity: Common
  bonuses: {charisma: 1}
stylish:
  label: Stylish
  description: Make your own entrance. Fanciness +1 while slotted.
  image: stylish-art.webp
  type: skill
  rank: Script Kiddo
  rarity: Common
  bonuses: {fanciness: 1}
spirited:
  label: Spirited
  description: A little extra get-up-and-go. Maximum Energy +10 while slotted.
  image: spirited-art.webp
  type: skill
  rank: Script Kiddo
  rarity: Uncommon
  bonuses: {max_energy: 10}
# Tutorial reward. Kept out of the base pack draw list so every peep earns one.
multiverse-map:
  label: Multiverse Map
  description: A folded map of every world. Slot it to open the Multiverse from the toolbar and cross between worlds and follow beacons.
  image: multiverse-map-art.png
  type: skill
  rank: Script Kiddo
  rarity: Uncommon
  stack_limit: 1
  quest: true
wave:
  label: Little Wave
  description: An animated hello, made for sharing.
  image: wave-art.webp
  animation: wave.gif
  type: emote
  rarity: Common
happy-dance:
  label: Happy Dance
  description: A tiny, looping victory dance.
  image: happy-dance-art.webp
  animation: happy-dance.gif
  type: emote
  rarity: Common
heart:
  label: Warm Heart
  description: Send a hand-drawn heart floating into the room.
  image: heart-art.webp
  animation: heart.gif
  type: emote
  rarity: Common
