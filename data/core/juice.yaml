# Fraction of max energy required to act again after the counter reaches 0
recovery_threshold: 0.1
# Maximum energy per user level (levels 0-15)
max_energy_per_level: [80, 100, 110, 120, 130, 140, 155, 170, 185, 200, 220, 240, 260, 280, 300, 330]
